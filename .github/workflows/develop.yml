name: develop

# R-51, every merge to develop: the pull-request gates plus the full Playwright
# suite at both viewports. The suite runs against the compose stack in
# deploy/stack, whose configuration declares one phone and one desktop project.
#
# The merge gate is split across runners so a merge commit no longer waits for
# the slowest chain: the fast `gates` job fails first, and the image-building
# integration suites and the browser E2E suites run beside each other, each on
# its own hosted runner (genie-ops-center-v2-ejs).
on:
  push:
    branches:
      - develop

# nrwl/nx-set-shas looks this workflow's run history up through the GitHub API
# to find the last successful develop run, so the token needs `actions: read`
# (genie-ops-center-v2-bf7). Everything else stays read-only.
permissions:
  contents: read
  actions: read

# A merge to develop supersedes the previous develop run, so a burst of pushes
# does not queue redundant runner hours; a cancelled run writes no caches,
# which is accepted. Release tags are never grouped (genie-ops-center-v2-ejs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # The fast gates, exactly what ci:pr runs before its integration layer. No
    # image suite and no browser suite, so this job stays cheap and fails first.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner has no browser; the Storybook component tests launch the
      # pinned Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      # Base the affected range on the last successful develop run, not the
      # pushed commit's parent. With `cancel-in-progress: true`, push B cancels
      # the run for push A and gates only A→B, so if A's run was cancelled or
      # failed the projects A touched are never gated on develop. nx-set-shas
      # reads this workflow's own run history and exports NX_BASE/NX_HEAD. A
      # history with no successful run yet — the first push — falls back to
      # git's empty tree, so every project is affected rather than an empty
      # range (genie-ops-center-v2-bf7).
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: develop
          fallback-sha: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
      - run: pnpm exec nx affected -t lint typecheck test build build-storybook test-storybook --base="$NX_BASE" && pnpm run validate

  integration-discover:
    # One projection of the affected integration roster, so the matrix below
    # runs one runner per project and a new module's generated test:integration
    # target is picked up without a develop.yml edit (genie-ops-center-v2-bf7).
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      projects: ${{ steps.discover.outputs.projects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: develop
          fallback-sha: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
      # The workspace is the source of truth for the roster: a push that touches
      # no integration project prints `[]` and the matrix is skipped, and a new
      # module with the target appears here without a list edit.
      - id: discover
        run: |
          set -eu
          projects="$(pnpm exec nx show projects --affected -t test:integration --base="$NX_BASE" --json)"
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  integration:
    # One runner per discovered project: the app's image builds and the
    # Storybook browser matrix no longer compete on one 4-vCPU runner (develop
    # run 35893905134), and a new module's generated test:integration target
    # gets its own shard automatically (genie-ops-center-v2-bf7).
    needs:
      - gates
      - integration-discover
    if: needs.integration-discover.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One failed project does not cancel its siblings' shards.
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.integration-discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite builds full images; free the preinstalled toolchains this
      # repository never uses, or the runner runs out of disk.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # The suite drives the pinned Chromium through Playwright.
      - run: pnpm exec playwright install --with-deps chromium
      # The shard runs only the project the discover job handed it. A bail
      # stops the run once the project fails, and the projects never compete
      # for the runner's 4 vCPUs.
      - run: pnpm exec nx run "$PROJECT:test:integration" --nx-bail --parallel=1
        env:
          PROJECT: ${{ matrix.project }}

  e2e:
    # The browser E2E suites, which build the fixture stack and the app image.
    # The fixture stack precedes the ordinary suite, exactly as ci:develop runs
    # them. The E2E job stays unconditional: ci:develop always ran both browser
    # suites regardless of the affected set, so the deployable image is proved
    # end to end on every merge.
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suites build full images; free the preinstalled toolchains this
      # repository never uses, or the runner runs out of disk.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # The runner has no browser; both suites launch the pinned Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec nx run-many -t test:e2e:fixture -p @genie/app
      - run: pnpm exec nx run-many -t test:e2e -p @genie/app
      # The generated-module proof (R-30/AC-7): it generates a module, builds
      # the image carrying it and proves the denied route at both viewports.
      - run: pnpm exec nx run-many -t test:e2e:generated -p @genie/app
