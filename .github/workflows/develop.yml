name: develop

# R-51, every merge to develop: the pull-request gates plus the full Playwright
# suite at both viewports. The suite runs against the compose stack in
# deploy/stack, whose configuration declares one phone and one desktop project.
on:
  push:
    branches:
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A push to develop has `origin/develop` at HEAD, so an affected run based
      # on it would be empty. Base the merge gates on the pushed commit's parent
      # instead, and fall back to `origin/develop` for the all-zero first push.
      - id: base
        run: |
          set -eu
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "ref=origin/develop" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm run ci:develop
        env:
          NX_BASE: ${{ steps.base.outputs.ref }}
