name: release

# R-51/R-54/R-55, every release tag: one image per customer folder, built with
# that customer's include list, each of which must pass typecheck and the smoke
# test before it is pushed. With no customer folder the job builds the default
# every-module image and pushes it under a `development` tag instead, so the
# build path is proved before the first customer exists. That image contains the
# placeholder and is not a customer deliverable.
#
# Every publish goes through `scripts/build-customer-image.sh` (or the
# development wrapper), which resolves the built image's immutable digest,
# smoke-checks that digest, and only then pushes that exact identity. There is no
# path here that pushes an image smoke did not verify.
on:
  push:
    tags:
      - "v*"

# The repository's default workflow token is read-only. Only the two publishing
# jobs ask for package write, which the registry login and push need
# (genie-ops-center-v2-0lj).
permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      customers: ${{ steps.list.outputs.customers }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: list
        run: |
          set -eu
          found=$(find customers -mindepth 3 -maxdepth 3 -path 'customers/*/deploy/modules.txt' 2>/dev/null \
            | sed 's#^customers/\([^/]*\)/deploy/modules.txt$#\1#' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "customers=$found" >> "$GITHUB_OUTPUT"

  publish-customers:
    needs: discover
    if: needs.discover.outputs.customers != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.discover.outputs.customers) }}
    steps:
      # The job token can write packages, so the checkout keeps no credential
      # in .git/config while the gates and the build run.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image suites build many full images; free the preinstalled toolchains
      # this repository never uses, or the runner runs out of disk.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # The release gates run the E2E suites, and the runner has no browser.
      - run: pnpm exec playwright install --with-deps chromium
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Values reach the shell through env, never expanded into the script.
      - env:
          CUSTOMER_SLUG: ${{ matrix.slug }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: scripts/build-customer-image.sh "$CUSTOMER_SLUG" "$RELEASE_VERSION" --publish

  publish-development:
    needs: discover
    if: needs.discover.outputs.customers == '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image suites build many full images; free the preinstalled toolchains
      # this repository never uses, or the runner runs out of disk.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # The release gates run the E2E suites, and the runner has no browser.
      - run: pnpm exec playwright install --with-deps chromium
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: scripts/build-development-image.sh "$RELEASE_VERSION" --publish
