name: release

# R-51/R-54/R-55, every release tag: one image per customer folder, built with
# that customer's include list, each of which must pass typecheck and the smoke
# test before it is pushed. With no customer folder the job builds the default
# every-module image and pushes it under a `development` tag instead, so the
# build path is proved before the first customer exists. That image contains the
# placeholder and is not a customer deliverable.
#
# A release is refused unless the tagged commit already has a successful
# develop.yml push run (genie-ops-center-v2-sl1). Releases come from develop for
# now; the main-based rule is deferred to genie-ops-center-v2-3ui.
#
# Every publish goes through `scripts/build-customer-image.sh` (or the
# development wrapper), which resolves the built image's immutable digest,
# smoke-checks that digest, then pushes it under a run-unique temporary ref and
# creates the stable tag from the pushed manifest digest with
# `docker buildx imagetools create`, verifying the published tag's config digest
# before success. There is no path here that publishes an image smoke did not
# verify. `docker buildx imagetools` talks to the registry directly, so no
# `docker/setup-buildx-action` is needed: Buildx ships on `ubuntu-latest` and
# these commands create no builder instance.
#
# The registry credential appears only in a publish job that runs no dependency
# code (genie-ops-center-v2-dwn). A verify job gates, builds and smokes the
# candidate with no package permission, writes its immutable identity and saves
# the image to a short-lived artifact; the matching publish job holds
# `packages: write`, runs checkout and setup-node but no pnpm install and no Nx,
# loads that artifact and promotes the identity with `--publish-digest`. A
# hostile dependency that ran during install cannot read the token or move the
# identity on the publish runner, because no such process ever runs there.
#
# Residual (H3): the verify job still builds the bytes a compromised dependency
# can influence. The split removes the write token that could push any image in
# the repository; it does not remove the dependency's control over this build.
on:
  push:
    tags:
      - "v*"

# The repository's default workflow token is read-only. The discover job asks
# for `actions: read` to look up the tagged commit's develop run; only the two
# publishing jobs ask for package write, which the registry login and push need
# (genie-ops-center-v2-0lj).
permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      customers: ${{ steps.list.outputs.customers }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # genie-ops-center-v2-sl1: refuse the tag unless the tagged commit has a
      # successful develop.yml push run. Releases come from develop for now; a
      # main-based rule (an ancestor-of-main check) is deferred to
      # genie-ops-center-v2-3ui. Fail closed, naming the commit.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          runs=$(gh run list --workflow develop.yml --commit "$GITHUB_SHA" --branch develop --event push --status success --limit 1 --json databaseId)
          if [ -z "$runs" ] || [ "$runs" = "[]" ]; then
            echo "::error::No successful develop.yml run for $GITHUB_SHA. A release tag must point at a commit that passed the develop gate; merge it to develop, wait for the run to succeed, then re-tag."
            exit 1
          fi
      - id: list
        run: |
          set -eu
          found=$(find customers -mindepth 3 -maxdepth 3 -path 'customers/*/deploy/modules.txt' 2>/dev/null \
            | sed 's#^customers/\([^/]*\)/deploy/modules.txt$#\1#' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "customers=$found" >> "$GITHUB_OUTPUT"

  # The verify jobs gate, build and smoke with no package permission at all, so
  # the job token cannot push even if a dependency escapes. Each hands its
  # immutable identity and the built image to the matching publish job: the
  # identity in the artifact (and, for the single development job, as a job
  # output), the image as a zstd-compressed `docker save` tarball.
  verify-customers:
    needs: discover
    if: needs.discover.outputs.customers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.discover.outputs.customers) }}
    steps:
      # The job token has no package permission, so the checkout keeps no
      # credential in .git/config while the gates and the build run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image suites build many full images; free the preinstalled toolchains
      # this repository never uses, or the runner runs out of disk.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # The app integration gate drives the pinned Chromium (its target depends
      # on the fixture and dev E2E suites); the runner has no browser.
      - run: pnpm exec playwright install --with-deps chromium
      - run: mkdir -p candidate
      # The gates, the build and the smoke run with no registry credential on
      # disk (genie-ops-center-v2-sl1). The smoked identity is recorded on disk
      # and travels with the image in the artifact below.
      - env:
          CUSTOMER_SLUG: ${{ matrix.slug }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: scripts/build-customer-image.sh "$CUSTOMER_SLUG" "$RELEASE_VERSION" --no-publish --identity-out candidate/identity
      # Save the exact bytes smoke verified. The bytes exist only in this
      # runner's local image store, so the publish job cannot rebuild them; it
      # loads this tarball and the promotion's config-digest check proves the
      # published tag carries the identity smoke saw.
      - run: |
          set -euo pipefail
          docker save "$(cat candidate/identity)" | zstd -T0 -o candidate/image.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ matrix.slug }}
          path: candidate/
          # The tarball is already zstd; a second zip pass only burns CPU.
          compression-level: 0
          # One release, one promotion: the bytes are needed for minutes.
          retention-days: 1

  publish-customers:
    needs: [discover, verify-customers]
    if: needs.discover.outputs.customers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.discover.outputs.customers) }}
    steps:
      # The job token can write packages, so the checkout keeps no credential in
      # .git/config while the promotion runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Node runs the promote path of the release CLI, which imports only
      # `node:` builtins. No pnpm install and no Nx run in this job, so no
      # dependency code can read ~/.docker/config.json once the login writes it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ matrix.slug }}
          path: candidate
      - run: |
          set -euo pipefail
          zstd -dc candidate/image.tar.zst | docker load
      # The packages:write token is written to ~/.docker/config.json only here,
      # after the image the verify job built and smoked is loaded.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Promote the exact identity the verify job smoked, read from the
      # artifact it uploaded. No gate, build or smoke runs while the token is
      # present, and nothing here rebuilds or retags a candidate.
      - env:
          CUSTOMER_SLUG: ${{ matrix.slug }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: scripts/build-customer-image.sh "$CUSTOMER_SLUG" "$RELEASE_VERSION" --publish-digest "$(cat candidate/identity)"

  verify-development:
    needs: discover
    if: needs.discover.outputs.customers == '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      identity: ${{ steps.identity.outputs.identity }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: pnpm exec playwright install --with-deps chromium
      - run: mkdir -p candidate
      - env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: scripts/build-development-image.sh "$RELEASE_VERSION" --no-publish --identity-out candidate/identity
      # The single development job has one verify instance, so the identity can
      # travel as a job output, not only in the artifact.
      - id: identity
        run: echo "identity=$(cat candidate/identity)" >> "$GITHUB_OUTPUT"
      - run: |
          set -euo pipefail
          docker save "$(cat candidate/identity)" | zstd -T0 -o candidate/image.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-development
          path: candidate/
          # The tarball is already zstd; a second zip pass only burns CPU.
          compression-level: 0
          retention-days: 1

  publish-development:
    needs: [discover, verify-development]
    if: needs.discover.outputs.customers == '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-development
          path: candidate
      - run: |
          set -euo pipefail
          zstd -dc candidate/image.tar.zst | docker load
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Promote the identity the verify job emitted as a job output. It is passed
      # through the environment, never pasted into the shell text.
      - env:
          RELEASE_VERSION: ${{ github.ref_name }}
          CANDIDATE_IDENTITY: ${{ needs.verify-development.outputs.identity }}
        run: scripts/build-development-image.sh "$RELEASE_VERSION" --publish-digest "$CANDIDATE_IDENTITY"
