name: release

# R-51/R-54/R-55, every release tag: one image per customer folder, built with
# that customer's include list, each of which must pass typecheck and the smoke
# test before it is pushed. With no customer folder the job builds the default
# every-module image and pushes it under a `development` tag instead, so the
# build path is proved before the first customer exists. That image contains the
# placeholder and is not a customer deliverable.
#
# A release is refused unless the tagged commit already has a successful
# develop.yml push run (genie-ops-center-v2-sl1). Releases come from develop for
# now; the main-based rule is deferred to genie-ops-center-v2-3ui.
#
# Every publish goes through `scripts/build-customer-image.sh` (or the
# development wrapper), which resolves the built image's immutable digest,
# smoke-checks that digest, then pushes it under a run-unique temporary ref and
# creates the stable tag from the pushed manifest digest with
# `docker buildx imagetools create`, verifying the published tag's config digest
# before success. There is no path here that publishes an image smoke did not
# verify. `docker buildx imagetools` talks to the registry directly, so no
# `docker/setup-buildx-action` is needed: Buildx ships on `ubuntu-latest` and
# these commands create no builder instance.
#
# The registry credential appears only after the gates, the build and the smoke
# have run (genie-ops-center-v2-sl1): the verify step runs with `--no-publish`
# and writes the smoked identity out, then `docker/login-action` writes the
# packages:write token, then a `--publish-digest` step promotes that identity.
# Between the smoke and the login, the job stops the Nx daemon and kills the
# processes it orphaned, so nothing the install or the build left running can
# read the token or move the identity (genie-ops-center-v2-dwn).
on:
  push:
    tags:
      - "v*"

# The repository's default workflow token is read-only. The discover job asks
# for `actions: read` to look up the tagged commit's develop run; only the two
# publishing jobs ask for package write, which the registry login and push need
# (genie-ops-center-v2-0lj).
permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      customers: ${{ steps.list.outputs.customers }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # genie-ops-center-v2-sl1: refuse the tag unless the tagged commit has a
      # successful develop.yml push run. Releases come from develop for now; a
      # main-based rule (an ancestor-of-main check) is deferred to
      # genie-ops-center-v2-3ui. Fail closed, naming the commit.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          runs=$(gh run list --workflow develop.yml --commit "$GITHUB_SHA" --branch develop --event push --status success --limit 1 --json databaseId)
          if [ -z "$runs" ] || [ "$runs" = "[]" ]; then
            echo "::error::No successful develop.yml run for $GITHUB_SHA. A release tag must point at a commit that passed the develop gate; merge it to develop, wait for the run to succeed, then re-tag."
            exit 1
          fi
      - id: list
        run: |
          set -eu
          found=$(find customers -mindepth 3 -maxdepth 3 -path 'customers/*/deploy/modules.txt' 2>/dev/null \
            | sed 's#^customers/\([^/]*\)/deploy/modules.txt$#\1#' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "customers=$found" >> "$GITHUB_OUTPUT"

  publish-customers:
    needs: discover
    if: needs.discover.outputs.customers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.discover.outputs.customers) }}
    steps:
      # The job token can write packages, so the checkout keeps no credential
      # in .git/config while the gates and the build run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image suites build many full images; free the preinstalled toolchains
      # this repository never uses, or the runner runs out of disk.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # The app integration gate drives the pinned Chromium (its target depends
      # on the fixture and dev E2E suites); the runner has no browser.
      - run: pnpm exec playwright install --with-deps chromium
      # The gates, the build and the smoke run with no registry credential on
      # disk (genie-ops-center-v2-sl1). The smoked identity is written out for
      # the publish step below.
      - env:
          CUSTOMER_SLUG: ${{ matrix.slug }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: scripts/build-customer-image.sh "$CUSTOMER_SLUG" "$RELEASE_VERSION" --no-publish --identity-out "$RUNNER_TEMP/candidate-identity"
      # genie-ops-center-v2-dwn (sl1 review M1): a separate publish job cannot
      # promote the smoke-tested image — it exists only in this runner's local
      # image store, `docker tag` needs it locally, and the wrapper needs
      # node_modules to run — so nothing this job left running may survive into
      # the credentialed steps. The Nx daemon is long-lived by design; stop it,
      # then kill every process this job orphaned (reparented to init), which is
      # exactly what a lifecycle script detaches with `setsid`/`nohup`. Both run
      # before the token exists, so no leftover can read it from the docker
      # config or move the identity file the publish step consumes.
      - run: |
          set -eu
          pnpm exec nx reset
          leftovers() { ps -eo pid=,ppid= -u "$(id -u)" | awk '$2 == 1 { print $1 }'; }
          for p in $(leftovers); do kill -TERM "$p" 2>/dev/null || true; done
          sleep 1
          for p in $(leftovers); do kill -KILL "$p" 2>/dev/null || true; done
      # The packages:write token is written to ~/.docker/config.json only here,
      # after every gate, the build and the smoke have run.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Promote the exact identity the verify step smoked. No gate, build or
      # smoke re-runs while the token is present.
      - env:
          CUSTOMER_SLUG: ${{ matrix.slug }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: scripts/build-customer-image.sh "$CUSTOMER_SLUG" "$RELEASE_VERSION" --publish-digest "$(cat "$RUNNER_TEMP/candidate-identity")"

  publish-development:
    needs: discover
    if: needs.discover.outputs.customers == '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image suites build many full images; free the preinstalled toolchains
      # this repository never uses, or the runner runs out of disk.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # The app integration gate drives the pinned Chromium (its target depends
      # on the fixture and dev E2E suites); the runner has no browser.
      - run: pnpm exec playwright install --with-deps chromium
      # The gates, the build and the smoke run with no registry credential on
      # disk (genie-ops-center-v2-sl1). The smoked identity is written out for
      # the publish step below.
      - env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: scripts/build-development-image.sh "$RELEASE_VERSION" --no-publish --identity-out "$RUNNER_TEMP/candidate-identity"
      # genie-ops-center-v2-dwn (sl1 review M1): see the customer job. Stop the
      # Nx daemon and kill this job's orphaned processes before the token exists.
      - run: |
          set -eu
          pnpm exec nx reset
          leftovers() { ps -eo pid=,ppid= -u "$(id -u)" | awk '$2 == 1 { print $1 }'; }
          for p in $(leftovers); do kill -TERM "$p" 2>/dev/null || true; done
          sleep 1
          for p in $(leftovers); do kill -KILL "$p" 2>/dev/null || true; done
      # The packages:write token is written to ~/.docker/config.json only here,
      # after every gate, the build and the smoke have run.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Promote the exact identity the verify step smoked. No gate, build or
      # smoke re-runs while the token is present.
      - env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: scripts/build-development-image.sh "$RELEASE_VERSION" --publish-digest "$(cat "$RUNNER_TEMP/candidate-identity")"
