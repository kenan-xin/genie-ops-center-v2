name: entra-scheduled

# The scheduled Entra run (Spec 2 tech plan D2-2, S2-16). It proves what only a real Microsoft
# Entra ID tenant shows, against the test tenant "Default Directory" through a realm brokered to
# it: group object ids in the `groups` claim, a group label naming them, nested groups and app
# assignment as the S-G guide says, and an observation of what the Keycloak Attribute Importer
# does to the `groups` attribute when Entra sends no `groups` claim (the 200-group overage).
#
# It is never a pull-request check and never a merge gate: it runs on a schedule and by hand.
# GitHub runs a schedule only from the default branch, so the scheduled trigger fires once this
# file reaches it; each run checks out develop, which is what it proves.
#
# Repository secret (create it under Settings, Secrets and variables, Actions):
#   ENTRA_TEST_TENANT  one JSON object, with the fields tenantId, clientId, clientSecret,
#                      groupId, parentGroupId, assigned {email,password},
#                      unassigned {email,password}, and optional overage {email,password}.
# The tenant setup each field needs is in docs/guides/sign-in/s-g-large-entra-jit.md. When the
# secret is absent the job prints a notice and skips the suite; it does not fail.
on:
  schedule:
    # Mondays, 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  entra:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The secret reaches only the guard step and the suite step, never an install script.
    steps:
      - id: secret
        env:
          ENTRA_TEST_TENANT: ${{ secrets.ENTRA_TEST_TENANT }}
        run: |
          if [ -z "$ENTRA_TEST_TENANT" ]; then
            echo "::notice title=Entra run skipped::The ENTRA_TEST_TENANT repository secret is not set, so the Entra suite did not run. See docs/guides/sign-in/s-g-large-entra-jit.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secret.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          persist-credentials: false
      - if: steps.secret.outputs.configured == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.4.2
      - if: steps.secret.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - if: steps.secret.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      # The suite builds the app image; free the preinstalled toolchains this repository never
      # uses, or the runner runs out of disk.
      - if: steps.secret.outputs.configured == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - if: steps.secret.outputs.configured == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.secret.outputs.configured == 'true'
        env:
          ENTRA_TEST_TENANT: ${{ secrets.ENTRA_TEST_TENANT }}
        run: pnpm exec nx run @genie/app:test:e2e:entra
