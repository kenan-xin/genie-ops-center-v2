# The tracked .githooks/ dispatchers run Beads, then `lefthook run`. Without
# this, every run tries to sync hooks into the custom core.hooksPath, prints a
# warning box that suggests `lefthook install --force`, and that command
# overwrites the dispatchers (.githooks/README.md).
no_auto_install: true

pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json}"
      # oxfmt ignores docs/**, so a commit whose staged files are all ignored
      # leaves it no target; that is success, not an error (genie-ops-center-v2-sdm).
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      # oxlint.config.ts ignores paths such as .claude/helpers/** and
      # apps/genie/src/modules.ts, so a commit staging only those leaves no target.
      run: pnpm exec oxlint --config oxlint.config.ts --no-error-on-unmatched-pattern {staged_files}
    - name: typecheck
      glob: "*.{ts,tsx,mts,cts}"
      # tsc checks whole projects, so Nx picks the projects the staged files
      # belong to and reuses its cache. It reads the working tree, not the index.
      # printf and sed join the files with commas, without a trailing one. A
      # space-separated --files value made Nx pass files on to tsc (TS5112).
      run: pnpm exec nx affected -t typecheck --outputStyle=static --files="$(printf '%s,' {staged_files} | sed 's/,$//')"

commit-msg:
  jobs:
    - name: conventional-commits
      # The rules in AGENTS.md, "Commits and Pull Request Titles". Git's own merge
      # and autosquash subjects pass. commitlint was not added: two dependencies
      # and a Node start on every commit for one regular expression.
      run: |
        subject=$(grep -v '^#' {1} | grep -m1 -v '^[[:space:]]*$' || true)
        if printf '%s\n' "$subject" | grep -Eq '^(Merge |(fixup|squash|amend)! )'; then exit 0; fi
        if printf '%s\n' "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^A-Z ].*[^.]$' && [ ${#subject} -lt 72 ]; then exit 0; fi
        echo "commit-msg: \"$subject\" is not a Conventional Commits subject." >&2
        echo "Write type(scope): subject, lowercase, no final period, under 72 characters (AGENTS.md, \"Commits and Pull Request Titles\")." >&2
        exit 1
