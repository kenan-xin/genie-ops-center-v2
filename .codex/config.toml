[features]
hooks = true

# Quoted on purpose: nx configure-ai-agents --check (Nx 23.3.0) matches this exact text.
[mcp_servers."nx-mcp"]
command = "npx"
args = ["nx", "mcp"]

# Starts in packages/ui because shadcn mcp reads components.json from its process directory and ignores --cwd.
[mcp_servers.shadcn]
command = "sh"
args = ["-c", "cd \"$(git rev-parse --show-toplevel)/packages/ui\" && exec npx -y shadcn@4.22.1 mcp"]
