# The smallest deployment R-40 asks for: the image and its database. It is a
# disposable local stack: the database is created and destroyed by the browser
# run and is never reachable off-host, so the fixed `genie`/`genie` credential
# below is a throwaway for that stack, not a secret. Production credentials are
# generated per deployment by the customer stack (Section 1), which replaces
# this file.
services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: genie
      POSTGRES_PASSWORD: genie
      POSTGRES_DB: genie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genie"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: ${GENIE_IMAGE:-genie-s005:test}
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://genie:genie@database:5432/genie
      PUBLIC_URL: http://127.0.0.1:3400
      PORT: "3400"
    ports:
      - "${GENIE_HOST_PORT:-3400}:3400"
