<!DOCTYPE html>
<!-- PROTOTYPE (d8l5.30, S2-20). Access in the role-per-row model (R-37a to R-37e).
     Screens: ?screen=grants|overview.
     Grants states: &state=empty|picker|help|role-choice|add|remove-confirm|remove-last|module-off|core-ask|advanced|advanced-guard.
     Overview states: &state=overview-recipient|overview-module (each one opens the Overview screen).
     &recipient=<id> picks a recipient (group or person id). &theme=dark switches the theme.
     Data: fictional sample tenant, people and groups. In-memory state only, reset on reload.
     Module roles and default access roles match develop (Invoices, Analytics, Slides, Placeholder, Core Ask).
     Icons: lucide (ISC license), inlined. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE: Access</title>
<style>
  /* Token layer, the shadcn variables of tokens.md. Only --primary and --primary-foreground are tenant colors. */
  :root{
    --background:#ffffff;--foreground:#111827;--card:#ffffff;--muted:#f9fafb;--muted-foreground:#4b5563;
    --border:#e5e7eb;--input:#6b7280;--primary:#2563eb;--primary-foreground:#ffffff;--ring:var(--primary);--destructive:#dc2626;
    --tile:#f3f4f6;--body-2:#374151;--pill:#f3f4f6;--pill-fg:#374151;
    --ok:#047857;--ok-bg:#ecfdf5;--warn:#92400e;--warn-bg:#fffbeb;--warn-line:#fcd34d;--dang-text:#b91c1c;--dang-bg:#fef2f2;
    --sel-bg:#eff6ff;--sel-fg:#1d4ed8;--link:var(--primary);
    --scrim:rgba(17,24,39,.45);
    --font-sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",monospace;
    --text-xs:max(12px,.8rem);--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;--text-xl:1.25rem;--text-2xl:1.5rem;
    --ease:cubic-bezier(.16,1,.3,1);
    color-scheme:light;
  }
  [data-theme=dark]{
    --background:#030712;--foreground:#f3f4f6;--card:#111827;--muted:#111827;--muted-foreground:#9ca3af;
    --border:#1f2937;--input:#6b7280;--ring:#60a5fa;--tile:#1f2937;--body-2:#d1d5db;--pill:#1f2937;--pill-fg:#d1d5db;
    --ok:#6ee7b7;--ok-bg:rgba(6,78,59,.35);--warn:#fde68a;--warn-bg:rgba(120,53,15,.3);--warn-line:#92400e;--dang-text:#f87171;--dang-bg:rgba(127,29,29,.3);
    --sel-bg:rgba(30,58,138,.35);--sel-fg:#93c5fd;--link:#60a5fa;--scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
  html{font-size:15px;scrollbar-color:#d1d5db transparent}
  [data-theme=dark] html,html[data-theme=dark]{scrollbar-color:#374151 transparent}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);font-size:var(--text-base);line-height:1.5;color:var(--foreground);background:var(--background);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:#dbeafe;color:#1e3a8a}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
  h1[tabindex="-1"]:focus{outline:none}
  a{color:var(--link);text-underline-offset:3px}
  button,input,select{font:inherit;color:inherit}
  .num{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted-foreground)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .ic.lg{width:20px;height:20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:no-preference){.spin{animation:spin 1s linear infinite}.dialog{animation:rise .24s var(--ease)}.toast{animation:rise .24s var(--ease)}}

  /* Shell: top bar on phones, sidebar of 240 px from 1024 px */
  .shell{min-height:100vh}
  .side{display:none}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;height:56px;padding:0 8px 0 4px;background:var(--background);border-bottom:1px solid var(--border)}
  .topbar .title{font-weight:700;font-size:var(--text-lg)}
  .iconbtn{width:44px;height:44px;display:inline-grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--body-2);cursor:pointer;position:relative}
  .iconbtn:hover{background:var(--tile)}
  .tile{width:28px;height:28px;border-radius:8px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:700;font-size:var(--text-sm);flex:none}
  .dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:var(--text-xs);font-weight:600;display:grid;place-items:center}
  .main{min-width:0;padding:16px 16px 140px}
  @media (min-width:768px){.main{padding:24px 24px 120px}}
  @media (min-width:1024px){
    .shell{display:grid;grid-template-columns:240px minmax(0,1fr)}
    .topbar{display:none}
    .side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--muted);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px}
    .main{padding:28px 32px 120px}
  }
  .tenant{display:flex;align-items:center;gap:10px;padding:6px 8px 4px;font-size:var(--text-sm);font-weight:600}
  .tenant small{display:block;font-size:var(--text-xs);font-weight:500;color:var(--muted-foreground)}
  .navcap{font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);margin:18px 10px 6px}
  .navrow{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:8px;color:var(--body-2);font-size:var(--text-sm);font-weight:500;text-decoration:none}
  .navrow:hover{background:var(--tile)}
  .navrow[aria-current=page]{background:var(--card);box-shadow:inset 0 0 0 1px var(--border);color:var(--link);font-weight:600}
  .who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid var(--border);font-size:var(--text-sm)}
  .who small{display:block;font-size:var(--text-xs);color:var(--muted-foreground)}
  .avatar{width:32px;height:32px;border-radius:999px;background:var(--tile);color:var(--body-2);display:grid;place-items:center;font-size:var(--text-xs);font-weight:600;flex:none}

  /* Page header and tabs */
  .ph h1{margin:0;font-size:var(--text-lg);font-weight:700;letter-spacing:-.01em}
  .ph p{margin:4px 0 0;font-size:var(--text-sm);color:var(--muted-foreground);max-width:70ch}
  @media (min-width:1024px){.ph h1{font-size:var(--text-xl)}}
  /* Under 1024 px the top bar carries the page title, so the header is for screen readers only. */
  @media (max-width:1023px){.ph{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.tabs{margin-top:0}}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:16px 0 20px}
  .tabs a{display:inline-flex;align-items:center;height:44px;padding:0 12px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted-foreground);font-size:var(--text-sm);font-weight:500;text-decoration:none}
  .tabs a:hover{color:var(--foreground)}
  .tabs a[aria-current=page]{border-color:var(--primary);color:var(--link);font-weight:600}

  /* Toolbar: one row at md from 768 px, two rows on a phone */
  .toolbar{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;margin-bottom:16px}
  .toolbar .lbl{font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground)}
  .toolbar .picker{grid-column:1 / -1}
  .toolbar .adv{grid-column:1 / -1;justify-self:end}
  @media (min-width:768px){
    .toolbar{display:flex;flex-wrap:wrap}
    .toolbar .picker{width:min(380px,100%)}
    .toolbar .adv{margin-left:auto}
  }
  .seg{display:inline-flex;padding:3px;border-radius:8px;background:var(--tile);height:40px}
  .seg button{border:0;border-radius:6px;background:none;padding:0 14px;font-size:var(--text-sm);font-weight:500;color:var(--muted-foreground);cursor:pointer;min-width:44px}
  .seg button[aria-pressed=true]{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px rgba(17,24,39,.08),inset 0 0 0 1px var(--border)}
  .picker{position:relative}
  .pickbtn{display:flex;align-items:center;gap:8px;width:100%;height:40px;min-height:40px;padding:0 12px;border:1px solid var(--input);border-radius:8px;background:var(--card);cursor:pointer;text-align:left;font-size:var(--text-sm)}
  .pickbtn .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;max-width:60%}
  .pickbtn .fact{color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pickbtn .chev{margin-left:auto;color:var(--muted-foreground)}
  .pickpanel{position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;min-width:280px;background:var(--card);border:1px solid var(--border);border-radius:6px;box-shadow:0 12px 32px -8px rgba(17,24,39,.22),0 2px 6px rgba(17,24,39,.06);padding:8px}
  .pickpanel ul{list-style:none;margin:8px 0 0;padding:0;max-height:300px;overflow:auto}
  .pickopt{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 8px;border:0;border-radius:6px;background:none;cursor:pointer;text-align:left;font-size:var(--text-sm)}
  .pickopt:hover,.pickopt[aria-current=true]{background:var(--sel-bg)}
  .pickopt small{display:block;color:var(--muted-foreground);font-size:var(--text-xs)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border-radius:8px;border:1px solid transparent;font-size:var(--text-sm);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
  .btn.sm{height:32px;padding:0 10px;position:relative}
  .btn.sm::after{content:"";position:absolute;inset:-6px 0}
  .btn.primary{background:var(--primary);color:var(--primary-foreground)}
  .btn.primary:hover{opacity:.94}
  .btn.secondary{background:var(--card);border-color:var(--input);color:var(--foreground)}
  .btn.secondary:hover,.btn.ghost:hover{background:var(--muted)}
  .btn.ghost{background:none;color:var(--body-2)}
  .btn.danger{background:var(--destructive);color:#fff}
  .btn.danger:hover{opacity:.94}
  .btn.removeish{background:var(--card);border-color:var(--input);color:var(--dang-text)}
  .btn[aria-disabled=true],.btn:disabled{opacity:.5;cursor:not-allowed}
  .btn[aria-busy=true]{cursor:progress}
  .linkbtn{border:0;background:none;padding:0;color:var(--link);font-size:var(--text-sm);font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px}
  .linkbtn:hover{text-decoration:underline;text-underline-offset:3px}

  /* Cards and the assignment card */
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
  @media (min-width:1024px){.card{padding:24px}}
  .card h2{margin:0;font-size:var(--text-lg);font-weight:600}
  .cardhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .lead{margin:4px 0 16px;font-size:var(--text-sm);color:var(--muted-foreground);max-width:72ch}
  .empty{text-align:center;padding:48px 24px}
  .empty .badge{width:48px;height:48px;border-radius:12px;background:var(--tile);color:var(--body-2);display:grid;place-items:center;margin:0 auto 12px}
  .empty h2{margin:0 0 6px}
  .empty p{margin:0 auto;max-width:52ch;color:var(--muted-foreground);font-size:var(--text-sm)}

  /* Help disclosure */
  .help{position:relative;display:inline-block}
  .helpbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 6px;border:0;border-radius:8px;background:none;color:var(--link);font-size:var(--text-sm);font-weight:600;cursor:pointer}
  .helppanel{position:absolute;z-index:25;top:calc(100% + 4px);left:0;width:320px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 32px -8px rgba(17,24,39,.22);padding:14px 16px;font-size:var(--text-sm);color:var(--body-2)}
  .helppanel p{margin:0 0 8px}
  @media (max-width:639px){.helppanel{position:fixed;left:16px;right:16px;top:auto;bottom:96px;width:auto}}

  /* Pills */
  .pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:var(--text-xs);font-weight:600;white-space:nowrap}
  .pill.label{background:var(--pill);color:var(--pill-fg)}
  .pill.pending{background:var(--pill);color:var(--pill-fg)}
  .pill.inactive{background:var(--warn-bg);color:var(--warn)}

  /* Transfer list, two-pane form */
  .tl{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .pane{border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-height:360px;overflow:hidden}
  .panehead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;border-bottom:1px solid var(--border);background:var(--muted)}
  .cap{font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground)}
  .panetools{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
  .search{position:relative;flex:1;min-width:0}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-foreground)}
  .search input{width:100%;height:40px;min-height:40px;padding:0 12px 0 36px;border:1px solid var(--input);border-radius:8px;background:var(--card);font-size:var(--text-sm)}
  .search input::placeholder{color:var(--muted-foreground)}
  .cb{width:18px;height:18px;margin:0;accent-color:var(--primary);flex:none;cursor:pointer}
  .cbhit{display:inline-grid;place-items:center;width:44px;height:44px;margin:-12px -13px;cursor:pointer}
  .rows{list-style:none;margin:0;padding:0;flex:1}
  .grp{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:10px 12px 4px;background:var(--card)}
  .row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;column-gap:12px;row-gap:6px;min-height:56px;padding:8px 12px;border-top:1px solid var(--border)}
  .grp + .row{border-top:0}
  .row.sel{background:var(--sel-bg)}
  .row.off.catalog .nm{color:var(--muted-foreground);font-weight:500}
  .row.off.catalog .cb{opacity:.5;cursor:not-allowed}
  .row label.who-l{display:block;min-width:0;cursor:pointer}
  .row .nm{font-size:var(--text-sm);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .dt{display:block;font-size:var(--text-xs);color:var(--muted-foreground)}
  .row .also{display:block;font-size:var(--text-xs);color:var(--body-2)}
  .row .side-r{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .rolecell{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .rolesel{position:relative}
  .rolesel select{appearance:none;-webkit-appearance:none;height:32px;min-width:196px;padding:0 32px 0 10px;border:1px solid var(--input);border-radius:8px;background:var(--card);font-size:var(--text-sm);font-weight:500;cursor:pointer}
  .rolesel select:disabled{cursor:not-allowed;opacity:.6}
  .rolesel .ic{position:absolute;z-index:2;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted-foreground)}
  .rolesel::after{content:"";position:absolute;inset:-6px 0}
  .rolesel select{position:relative;z-index:1}
  .rolestatic{font-size:var(--text-sm);color:var(--body-2);padding:0 2px;white-space:nowrap}
  .was{font-size:var(--text-xs);color:var(--muted-foreground);text-decoration:line-through}
  .panefoot{display:flex;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--border);min-height:57px;align-items:center}
  .noresult{padding:20px 12px;font-size:var(--text-sm);color:var(--muted-foreground)}
  .below{margin:14px 0 0;font-size:var(--text-sm);color:var(--muted-foreground)}
  .below + .below{margin-top:6px}

  /* Roster form: one list, Granted first, under 900 px of card width */
  .roster{border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .roster .rhead{position:sticky;top:56px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:var(--muted);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .roster .rhead:first-of-type{border-top:0}
  .roster .row{grid-template-columns:20px minmax(0,1fr) auto}
  .roster .row .rolecell{grid-column:2 / -1;align-items:stretch}
  .roster .row .rolesel select{width:100%}
  .roster .grp{position:static;padding-top:8px}
  .rosterfoot{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--border)}
  @media (min-width:1024px){.roster .rhead{top:0}}

  /* Pending bar: sticky at the foot of the page; on a phone it is the bottom bar with Save */
  .pendbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--border);box-shadow:0 -6px 16px -10px rgba(17,24,39,.2)}
  .pendbar .msg{flex:1 1 220px;font-size:var(--text-sm);min-width:0}
  .pendbar .msg b{font-weight:600}
  .pendbar .msg span{display:block;color:var(--muted-foreground);font-size:var(--text-xs)}
  .pendbar .acts{display:flex;gap:8px;flex:1 1 100%}
  .pendbar .acts .btn{flex:1}
  @media (min-width:768px){.pendbar{left:24px;right:24px;bottom:16px;border:1px solid var(--border);border-radius:12px}.pendbar .acts{flex:none}.pendbar .acts .btn{flex:none}}
  @media (min-width:1024px){.pendbar{left:272px;right:32px}}
  .err{color:var(--dang-text)}

  /* Dialog: 480 px centered; a bottom sheet under 768 px */
  .scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
  .dialog{width:100%;max-height:88vh;overflow:auto;background:var(--card);border-radius:12px 12px 0 0;padding:20px 20px 0;box-shadow:0 24px 48px -12px rgba(17,24,39,.35)}
  .dialog h2{margin:0 0 8px;font-size:var(--text-lg);font-weight:700}
  .dialog p{margin:0 0 12px;font-size:var(--text-sm);color:var(--body-2)}
  .dialog .blk{margin:0 0 14px}
  .dialog .blk h3{margin:0 0 6px;font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground)}
  .dialog ul{list-style:none;margin:0;padding:0}
  .dialog li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border);font-size:var(--text-sm)}
  .dialog li:first-child{border-top:0}
  .dialog li b{font-weight:600}
  .dialog li span{color:var(--muted-foreground);text-align:right}
  .dialog .modsec{padding:12px 0 2px;border-top:1px solid var(--border)}
  .dialog .modsec:first-of-type{border-top:0;padding-top:0}
  .dialog .modsec h4{margin:0 0 8px;font-size:var(--text-sm);font-weight:600}
  .dacts{position:sticky;bottom:0;display:flex;gap:8px;padding:14px 0 calc(16px + env(safe-area-inset-bottom));margin-top:4px;background:var(--card);border-top:1px solid var(--border)}
  .dacts .btn{flex:1}
  @media (min-width:768px){
    .scrim{align-items:center;padding:24px}
    .dialog{max-width:480px;border-radius:12px;padding:24px 24px 0}
    .dacts{justify-content:flex-end;border-top:0;padding-bottom:20px}
    .dacts .btn{flex:none}
  }

  /* Toast */
  .toast{position:fixed;z-index:50;left:16px;right:16px;bottom:96px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#111827;color:#f9fafb;font-size:var(--text-sm);box-shadow:0 12px 32px -8px rgba(17,24,39,.4)}
  .toast .ic{color:#6ee7b7}
  @media (min-width:768px){.toast{left:auto;right:32px;bottom:24px;max-width:420px}}
  .sub{display:block;font-size:var(--text-xs);color:var(--muted-foreground)}
  .pickcap{padding:10px 8px 4px;font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground)}

  /* Overview: results card, table from 768 px, card list on a phone */
  .ovcard{padding:0;overflow:hidden}
  @media (min-width:1024px){.ovcard{padding:0}}
  .ovhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
  .ovhead .count{flex:1 1 220px;margin:0;font-size:var(--text-sm)}
  .ovhead .search{flex:1 1 240px;max-width:320px}
  table.ov{width:100%;border-collapse:collapse;font-size:var(--text-sm)}

  .ov td{padding:12px 16px;border-top:1px solid var(--border);vertical-align:top}
  .ov tbody tr:first-child td{border-top:0}
  .whocell{display:flex;align-items:flex-start;gap:8px}
  .whocell .ic{margin-top:2px;color:var(--muted-foreground)}
  .pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .ovcards{list-style:none;margin:0;padding:0}
  .ovcards li{display:grid;gap:6px;padding:14px 16px;border-top:1px solid var(--border);font-size:var(--text-sm)}
  .ovcards li:first-child{border-top:0}
  .ovcards .kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px}
  .ovcards .k{font-size:var(--text-xs);color:var(--muted-foreground);padding-top:2px}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--border);font-size:var(--text-sm)}
  .pager .btns{display:flex;gap:8px}
  .ovnote{display:flex;gap:8px;margin:0;padding:12px 16px;border-top:1px solid var(--border);font-size:var(--text-xs);color:var(--muted-foreground)}
  .ovnote .ic{margin-top:1px}

  /* Advanced access: slide-over of 560 px from 768 px, full-height sheet on a phone */
  .scrim.sideover{align-items:stretch;justify-content:flex-end;padding:0}
  .dialog.sheet{display:flex;flex-direction:column;height:100%;max-height:none;max-width:none;border-radius:0}
  @media (min-width:768px){.dialog.sheet{max-width:560px;border-radius:12px 0 0 12px}}
  .sheethead{display:flex;align-items:flex-start;gap:8px}
  .sheethead > div{flex:1;min-width:0}
  .sheethead .iconbtn{margin:-8px -8px 0 0}
  .sheetbody{flex:1}
  .advcap{margin:20px 0 6px;font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground)}
  .dialog li.advrow{align-items:center;padding:10px 0}
  .advrow .grow{flex:1;min-width:0}
  .advrow .nm{font-weight:600}
  .reason{font-size:var(--text-xs);color:var(--warn);margin-top:4px}
  .field{display:grid;gap:6px;margin-bottom:12px}
  .field label{font-size:var(--text-sm);font-weight:600}
  .field .rolesel select{width:100%;height:40px}
  .field .hint{margin:0;font-size:var(--text-xs);color:var(--muted-foreground)}
  .sheet .dacts{flex-wrap:wrap;align-items:center}
  .sheet .dacts .msg{flex:1 1 100%;font-size:var(--text-xs);color:var(--muted-foreground)}
  @media (min-width:768px){.sheet .dacts .msg{flex:1 1 auto}}
</style>

<body>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
"use strict";
/* ---------- Icons (lucide, ISC) ---------- */
const ICONS = {
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',

  sliders:'<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  key:'<path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/>',
  palette:'<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',
  settings:'<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
  scroll:'<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>',
  blocks:'<rect width="7" height="7" x="14" y="3" rx="1"/><path d="M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"/>',
  tag:'<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>',
  menu:'<path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/>',
  bell:'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  loader:'<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  ok:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
};
const ic = (n, c = "") => `<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/* ---------- Sample data: fictional tenant, people and groups ---------- */
// roles: the module's declared roles; def: its default access role (shown first in every choice).
const MODULES = [
  { id: "invoices", name: "Invoices", group: "Modules", detail: "Invoices, payments and the review inbox", roles: ["Invoices and Payments user", "Finance", "Viewer"], def: "Viewer", on: true },
  { id: "analytics", name: "Analytics", group: "Modules", detail: "Dashboards and saved questions", roles: ["Analytics viewer", "Analytics editor"], def: "Analytics editor", on: false },
  { id: "slides", name: "Slides", group: "Modules", detail: "Decks built from your data", roles: ["Slides editor"], def: "Slides editor", on: true },
  { id: "placeholder", name: "Placeholder", group: "Modules", detail: "Reference module for new capabilities", roles: ["Placeholder user"], def: "Placeholder user", on: true },
  { id: "ask", name: "Ask", group: "Core", detail: "The agent chat on every page", roles: ["Ask user"], def: "Ask user", on: true },
];
const GROUP_ORDER = ["Modules", "Core"];
const modById = Object.fromEntries(MODULES.map((m) => [m.id, m]));
const roleChoices = (m) => [m.def, ...m.roles.filter((r) => r !== m.def)];

const TENANT = { name: "Harbor Point", letter: "H" };
const ME = { id: "p-alex", name: "Alex Morgan" };
const GROUPS = [
  { id: "g-finance", name: "Finance team", members: 12 },
  { id: "g-ops", name: "Operations", members: 40 },
  { id: "g-analysts", name: "Analysts", members: 8 },
  { id: "g-sales", name: "Sales desk", members: 15 },
  { id: "g-pmo", name: "Project office", members: 6 },
  { id: "g-leads", name: "Leadership", members: 3 },
];
const PEOPLE = [
  { id: "p-alex", name: "Alex Morgan", email: "alex.morgan@example.com", groups: [] },
  { id: "p-jordan", name: "Jordan Lee", email: "jordan.lee@example.com", groups: ["g-leads"] },
  { id: "p-jamie", name: "Jamie Chen", email: "jamie.chen@example.com", groups: ["g-finance", "g-ops"] },
  { id: "p-sam", name: "Sam Rivera", email: "sam.rivera@example.com", groups: ["g-sales"] },
  { id: "p-taylor", name: "Taylor Brooks", email: "taylor.brooks@example.com", groups: ["g-analysts"] },
  { id: "p-morgan", name: "Morgan Ellis", email: "morgan.ellis@example.com", groups: ["g-ops"] },
  { id: "p-casey", name: "Casey Park", email: "casey.park@example.com", groups: ["g-pmo", "g-analysts"] },
  { id: "p-robin", name: "Robin Hale", email: "robin.hale@example.com", groups: [], disabled: true },
  { id: "p-drew", name: "Drew Patel", email: "drew.patel@example.com", groups: ["g-finance"] },
];
// Direct catalogue assignments: one role per module per recipient.
const GRANTS = {
  "g-finance": { invoices: "Finance", analytics: "Analytics viewer", ask: "Ask user" },
  "g-ops": { invoices: "Viewer", slides: "Slides editor", ask: "Ask user" },
  "g-analysts": { analytics: "Analytics editor", slides: "Slides editor" },
  "g-sales": { ask: "Ask user" },
  "g-pmo": { placeholder: "Placeholder user" },
  "g-leads": {},
  "p-alex": { ask: "Ask user" },
  "p-jamie": { invoices: "Invoices and Payments user" },
  "p-sam": { slides: "Slides editor" },
  "p-robin": { invoices: "Viewer" },
  "p-drew": { invoices: "Finance" },
  "p-alex": {}, "p-jordan": {}, "p-taylor": {}, "p-morgan": {}, "p-casey": {},
};
// More holders of Invoices, so Overview by module pages past ten rows. Former finance is archived.
for (const [id, name, members, role, archived] of [
  ["g-ap", "Accounts payable", 9, "Finance"], ["g-ar", "Accounts receivable", 7, "Finance"],
  ["g-treasury", "Treasury", 4, "Viewer"], ["g-proc", "Procurement", 11, "Viewer"],
  ["g-ctrl", "Controllers", 5, "Invoices and Payments user"], ["g-payroll", "Payroll", 6, "Viewer"],
  ["g-tax", "Tax desk", 3, "Viewer"], ["g-audit", "Audit committee", 5, "Viewer"],
  ["g-north", "Regional office North", 22, "Invoices and Payments user"], ["g-south", "Regional office South", 18, "Invoices and Payments user"],
  ["g-credit", "Credit control", 4, "Finance"], ["g-billing", "Billing support", 10, "Invoices and Payments user"],
  ["g-former", "Former finance", 5, "Viewer", true],
]) { GROUPS.push({ id, name, members, archived }); GRANTS[id] = { invoices: role }; }
// Roles the catalogue cannot show (Advanced access owns them). where: "core" or a module id; scope: null or one record.
const ADVANCED = {
  "g-finance": [{ role: "Auditor", where: "core", scope: null }],
  "g-ops": [{ role: "Finance", where: "invoices", scope: "INV-2026-0142" }, { role: "Invoice approver", where: "invoices", scope: null, custom: true }],
  "g-leads": [{ role: "Tenant administrator", where: "core", scope: null }],
  "p-alex": [{ role: "Access manager", where: "core", scope: null, custom: true }],
  "p-casey": [{ role: "Invoice approver", where: "invoices", scope: "INV-2026-0157", custom: true }],
};
// Records of a module that owns records (only Invoices here), and the tenant's custom roles.
const RECORDS = { invoices: ["INV-2026-0142", "INV-2026-0157", "INV-2026-0163", "INV-2026-0171"] };
const CUSTOM_ROLES = [{ role: "Access manager", where: "core" }, { role: "Invoice approver", where: "invoices" }];
const ADDERS = ["Alex Morgan", "Jordan Lee"];
const MONTHS = ["Jul", "Aug", "Sep", "Oct"];
// Deterministic sample "added by" for each assignment.
const addedBy = (key) => {
  const h = [...key].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  return { by: ADDERS[h % 2], on: `${1 + ((h >>> 3) % 28)} ${MONTHS[(h >>> 8) % 4]} 2026` };
};
const whereName = (w) => (w === "core" ? "Core administration" : modById[w].name);
const recipientById = (id) => GROUPS.find((g) => g.id === id) || PEOPLE.find((p) => p.id === id);
const isPerson = (id) => id && id.startsWith("p-");
// A person's group paths to one module (groups receive nothing through groups).
const groupPaths = (pid, mid) => isPerson(pid)
  ? recipientById(pid).groups.filter((g) => GRANTS[g][mid]).map((g) => ({ role: GRANTS[g][mid], via: recipientById(g).name }))
  : [];

/* ---------- State ---------- */
const P = new URLSearchParams(location.search);
const S = {
  screen: P.get("screen") === "overview" ? "overview" : "grants",
  kind: "group", rid: null,
  add: {}, change: {}, remove: {},
  checked: { catalog: new Set(), granted: new Set() },
  q: { catalog: "", granted: "", roster: "", picker: "" },
  picker: false, help: false, dialog: null, saving: false, toast: "",
  ov: { by: "recipient", subject: null, page: 0 },
  adv: { add: [], remove: new Set(), pick: "", scope: "" },
};
S.q.ov = "";
const wide = () => (document.querySelector(".main")?.clientWidth || innerWidth) >= 948;

function applyState(state) {
  const pick = (id) => { S.rid = id; S.kind = isPerson(id) ? "person" : "group"; };
  switch (state) {
    case "picker": S.picker = true; break;
    case "help": pick("g-ops"); S.help = true; break;
    case "role-choice": pick("g-ops"); S.change.invoices = "Finance"; break;
    case "add": pick("g-analysts"); S.add.invoices = "Viewer"; S.add.ask = "Ask user"; break;
    case "remove-confirm": pick("p-jamie"); S.remove.invoices = true; S.dialog = "remove"; break;
    case "remove-last": pick("p-sam"); S.remove.slides = true; S.dialog = "remove"; break;
    case "module-off": pick("g-finance"); S.checked.granted.add("analytics"); break;
    case "core-ask": pick("g-sales"); break;
    case "advanced": pick("g-ops"); S.dialog = "advanced"; S.adv.add.push({ role: "Auditor", where: "core", scope: null }); break;
    case "advanced-guard": pick("g-leads"); S.dialog = "advanced"; break;
    case "overview-recipient": S.screen = "overview"; S.ov.subject = "p-jamie"; break;
    case "overview-module": S.screen = "overview"; S.ov.by = "module"; S.ov.subject = "invoices"; break;
  }
  const r = P.get("recipient");
  if (r && recipientById(r)) pick(r);
}

/* ---------- Derived ---------- */
const saved = () => (S.rid ? GRANTS[S.rid] : {});
const grantedIds = () => MODULES.filter((m) => (saved()[m.id] && !S.remove[m.id]) || S.add[m.id]).map((m) => m.id);
const roleOf = (id) => S.add[id] || S.change[id] || saved()[id];
const counts = () => ({ add: Object.keys(S.add).length, change: Object.keys(S.change).length, remove: Object.keys(S.remove).length });
const dirty = () => { const c = counts(); return c.add + c.change + c.remove > 0; };
const matches = (m, q) => !q || (m.name + " " + m.detail + " " + (roleOf(m.id) || "")).toLowerCase().includes(q.toLowerCase());
const movable = (side, m) => side === "granted" || m.on;

/* ---------- Actions ---------- */
function pickRecipient(id) {
  if (dirty() && id !== S.rid) { S.dialog = { discard: id }; S.picker = false; return render(); }
  S.rid = id; S.picker = false; S.q.picker = ""; resetStage(); render();
  document.querySelector(".pickbtn")?.focus();
}
function resetStage() { S.add = {}; S.change = {}; S.remove = {}; S.checked.catalog.clear(); S.checked.granted.clear(); }
function move(side) {
  const set = S.checked[side];
  for (const id of set) {
    if (side === "catalog") {
      if (!modById[id].on) continue;
      if (S.remove[id]) delete S.remove[id]; else S.add[id] = modById[id].def;
    } else {
      if (S.add[id]) delete S.add[id]; else { S.remove[id] = true; delete S.change[id]; }
    }
  }
  set.clear(); render(); announce(`${counts().add} to add, ${counts().change} to change, ${counts().remove} to remove`);
}
function moveAllShown(side) {
  for (const m of shownRows(side)) if (movable(side, m)) S.checked[side].add(m.id);
  move(side);
}
function setRole(id, v) {
  if (S.add[id]) S.add[id] = v;
  else if (v === saved()[id]) delete S.change[id];
  else S.change[id] = v;
  render();
  document.getElementById(`role-${id}`)?.focus();
}
function save() {
  if (Object.keys(S.remove).length) { S.dialog = "remove"; return render(); }
  commit();
}
function commit() {
  S.dialog = null; S.saving = true; render();
  setTimeout(() => {
    const g = GRANTS[S.rid];
    for (const id of Object.keys(S.remove)) delete g[id];
    Object.assign(g, S.add, S.change);
    resetStage(); S.saving = false;
    showToast("Saved. The audit log records the change.");
  }, 700);
}
function showToast(t) {
  S.toast = t; render(); announce(t);
  setTimeout(() => { S.toast = ""; render(); }, 4000);
}

/* ---------- Advanced access ---------- */
// Roles Advanced access adds: core administration, Auditor, a module role at one record, custom roles.
const advChoices = () => [
  { cap: "Core", items: ["Tenant administrator", "Auditor"].map((role) => ({ role, where: "core" })) },
  { cap: "Module role at one record", items: MODULES.filter((m) => RECORDS[m.id]).flatMap((m) => roleChoices(m).map((role) => ({ role, where: m.id, needsRecord: true }))) },
  { cap: "Custom roles", items: CUSTOM_ROLES.map((c) => ({ ...c, custom: true })) },
];
const advPicked = () => { if (!S.adv.pick) return null; const [g, i] = S.adv.pick.split(":").map(Number); return advChoices()[g].items[i]; };
// Active people one holder reaches: a person, or the active members of a group that is not archived.
const activePeople = (hid) => {
  const r = recipientById(hid);
  if (r.archived || r.disabled) return [];
  return isPerson(hid) ? [hid] : PEOPLE.filter((p) => !p.disabled && p.groups.includes(hid)).map((p) => p.id);
};
// R-38: a removal that leaves no active Tenant administrator is refused. Counts people, not rows.
function guardReason(a) {
  if (a.role !== "Tenant administrator") return "";
  const others = new Set(Object.entries(ADVANCED).flatMap(([h, list]) => list.filter((x) => x !== a && x.role === a.role).flatMap(() => activePeople(h))));
  return others.size ? "" : "Last active Tenant administrator path. Give the role to somebody else first.";
}
function openAdvanced() { S.adv = { add: [], remove: new Set(), pick: "", scope: "" }; S.dialog = "advanced"; render(); }
function saveAdvanced() {
  const kept = (ADVANCED[S.rid] || []).filter((_, i) => !S.adv.remove.has(i));
  ADVANCED[S.rid] = [...kept, ...S.adv.add];
  S.dialog = null; showToast("Saved. The audit log records the change.");
}
function announce(t) { const l = document.getElementById("live"); l.textContent = ""; setTimeout(() => (l.textContent = t), 30); }

/* ---------- Views ---------- */
function shell(content) {
  const nav = (cap, rows) => `<div class="navcap">${cap}</div>` + rows.map(([n, icon, cur]) =>
    `<a class="navrow" href="#" ${cur ? 'aria-current="page"' : ""}>${ic(icon)}${n}</a>`).join("");
  return `<div class="shell">
    <nav class="side" aria-label="Admin portal">
      <div class="tenant"><span class="tile" aria-hidden="true">${TENANT.letter}</span><span>${TENANT.name}<small>Admin portal</small></span></div>
      ${nav("People and access", [["People", "user"], ["Groups", "users"], ["Roles", "shield"], ["Access", "key", true]])}
      ${nav("Tenant", [["Branding", "palette"], ["Settings", "settings"], ["Audit log", "scroll"]])}
      ${nav("Catalog", [["Modules", "blocks"], ["Categories", "tag"]])}
      <div class="who"><span class="avatar" aria-hidden="true">AM</span><span>${ME.name}<small>Access manager</small></span></div>
    </nav>
    <div>
      <header class="topbar"><button class="iconbtn" aria-label="Open navigation">${ic("menu", "lg")}</button><span class="tile" aria-hidden="true">${TENANT.letter}</span><span class="title">Access</span><button class="iconbtn" style="margin-left:auto" aria-label="Inbox, 3 unread">${ic("bell", "lg")}<span class="dot" aria-hidden="true">3</span></button></header>
      <main class="main">${content}</main>
    </div>
  </div>`;
}
function header() {
  return `<div class="ph"><h1 tabindex="-1">Access</h1><p>${S.screen === "overview" ? "Who reaches which module, with which role, and through which path." : "Choose a group or a person. Then give them modules and pick the role they hold in each."}</p></div>
  <nav class="tabs" aria-label="Access"><a href="?screen=grants" ${S.screen === "grants" ? 'aria-current="page"' : ""}>Grants</a><a href="?screen=overview" ${S.screen === "overview" ? 'aria-current="page"' : ""}>Overview</a></nav>`;
}
function toolbar() {
  const r = S.rid && recipientById(S.rid);
  const list = (S.kind === "group" ? GROUPS.filter((g) => !g.archived) : PEOPLE).filter((x) => !S.q.picker || x.name.toLowerCase().includes(S.q.picker.toLowerCase()));
  const fact = (x) => (isPerson(x.id) ? x.email : `${x.members} members`);
  return `<div class="toolbar">

function ovRows() {

  const shown = rows.slice(page * 10, page * 10 + 10);
  const head = `<div class="ovhead"><p class="count"><b class="num">${all.length}</b> ${byMod ? (all.length === 1 ? "holder of" : "holders of") : (all.length === 1 ? "assignment for" : "assignments for")} <b>${esc(name)}</b></p>
    ${all.length ? `<div class="search">${ic("search")}<input type="search" aria-label="Search these results" placeholder="Search these results" value="${esc(S.q.ov)}" data-q="ov"></div>` : ""}
    ${byMod ? "" : `<a class="btn secondary sm" href="?screen=grants&recipient=${sid}">Change access</a>`}</div>`;
  if (!all.length) return `<section class="card ovcard" aria-label="Results">${head}<p class="noresult">${byMod ? `Nobody holds a role of ${esc(name)}.` : `${esc(name)} holds no role.`}</p></section>`;
  const who = (r) => `<div class="whocell">${ic(isPerson(r.hid) ? "user" : "users")}<div>${esc(recipientById(r.hid).name)}${r.off ? `<div class="pillrow"><span class="pill inactive">Not in effect</span></div><span class="sub">${r.off}</span>` : ""}</div></div>`;
  const mod = (r) => `${esc(whereName(r.mid))}${r.scope ? `<div class="pillrow"><span class="pill label">One record · ${esc(r.scope)}</span></div>` : ""}`;
  const role = (r) => `${esc(r.role)}${r.custom ? `<div class="pillrow"><span class="pill label">Custom role</span></div>` : ""}`;
  const path = (r) => `${esc(r.path)}${r.also.length ? `<span class="sub">also through ${r.also.map(esc).join(", ")}</span>` : ""}`;
  const added = (r) => { const a = addedBy(`${r.hid}:${r.mid}:${r.role}`); return `<span class="num">${a.on}</span><span class="sub">by ${a.by}</span>`; };
  const body = !shown.length ? `<p class="noresult">No row matches the search.</p>`
    : matchMedia("(min-width:768px)").matches
      ? `<table class="ov"><thead><tr><th scope="col">Who</th><th scope="col">Module</th><th scope="col">Role</th><th scope="col">Path</th><th scope="col">Added</th></tr></thead>
        <tbody>${shown.map((r) => `<tr><td>${who(r)}</td><td>${mod(r)}</td><td>${role(r)}</td><td>${path(r)}</td><td>${added(r)}</td></tr>`).join("")}</tbody></table>`
      : `<ul class="ovcards">${shown.map((r) => `<li>${who(r)}<div class="kv"><span class="k">Module</span><span>${mod(r)}</span></div><div class="kv"><span class="k">Role</span><span>${role(r)}</span></div>
        <div class="kv"><span class="k">Path</span><span>${path(r)}</span></div><div class="kv"><span class="k">Added</span><span>${added(r)}</span></div></li>`).join("")}</ul>`;
  const pager = rows.length ? `<div class="pager"><span class="num">${page * 10 + 1}–${page * 10 + shown.length} of ${rows.length}</span>
    <span class="btns"><button type="button" class="btn secondary sm" data-act="ovpage" data-v="-1" ${page === 0 ? "disabled" : ""}>Previous</button><button type="button" class="btn secondary sm" data-act="ovpage" data-v="1" ${page >= pages - 1 ? "disabled" : ""}>Next</button></span></div>` : "";
  return `<section class="card ovcard" aria-label="Results">${head}${body}${pager}
    <p class="ovnote">${ic("help")}<span>Access adds up. Removing one path leaves the others, which the Path column names. What changed and when is in the <a href="#">audit log</a>.</span></p></section>`;
}
function overviewScreen() {
  return ovToolbar() + (S.ov.subject ? ovResults() : `<section class="card empty"><div class="badge">${ic("search", "lg")}</div><h2>Choose what to look up</h2>
    <p>Pick a group or a person, or a module. Nothing is read before you choose, so there is no table of everybody against everything.</p></section>`);
}

let lastFocus = null;
function render() {
  const focusSel = document.activeElement?.dataset?.q ? `[data-q="${document.activeElement.dataset.q}"]` : null;
  const body = S.screen === "overview" ? overviewScreen() : toolbar() + (S.rid ? assignmentCard() : emptyState());
  document.getElementById("app").innerHTML = shell(header() + body) + pendingBar()
    + (S.dialog === "remove" ? removeDialog() : S.dialog === "advanced" ? advancedSheet() : S.dialog ? discardDialog() : "")
    + (S.toast ? `<div class="toast" role="status">${ic("ok")}${esc(S.toast)}</div>` : "");
  if (focusSel) { const el = document.querySelector(focusSel); el?.focus(); el?.setSelectionRange?.(el.value.length, el.value.length); }
  const auto = document.querySelector("[data-autofocus]");
  if (auto && !auto.contains(document.activeElement)) auto.focus();
  document.body.style.overflow = S.dialog ? "hidden" : "";
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (S.picker && !e.target.closest(".picker")) { S.picker = false; render(); }
  if (S.help && !e.target.closest(".help")) { S.help = false; render(); }
  if (!t) return;
  if (t.classList.contains("scrim") && e.target !== t) return;
  if (t.getAttribute("aria-disabled") === "true") return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case "kind": if (S.kind !== v) { if (dirty()) { S.dialog = { discard: null, kind: v }; lastFocus = t; return render(); } S.kind = v; S.rid = null; resetStage(); } render(); break;
    case "picker": S.picker = !S.picker; lastFocus = t; render(); if (S.picker) document.getElementById("pickq")?.focus(); break;
    case "pick": pickRecipient(v); break;
    case "help": S.help = !S.help; render(); document.querySelector(".helpbtn")?.focus(); break;
    case "move": move(v); break;
    case "allshown": moveAllShown(v); break;
    case "cancel": resetStage(); render(); break;
    case "save": if (!S.saving) { lastFocus = t; save(); } break;
    case "confirm": commit(); break;
    case "discard": { const d = S.dialog; S.dialog = null; S.rid = d.discard; if (d.kind) S.kind = d.kind; resetStage(); render(); break; }
    case "close": S.dialog = null; render(); (lastFocus && document.querySelector(`[data-act="${lastFocus.dataset.act}"]`))?.focus(); break;
    case "advanced": lastFocus = t; openAdvanced(); break;
    case "advrm": S.adv.remove.add(+v); render(); refocus(`[data-act="advundo"][data-v="${v}"]`); break;
    case "advundo": S.adv.remove.delete(+v); render(); refocus(`[data-act="advrm"][data-v="${v}"]`); break;
    case "advdrop": S.adv.add.splice(+v, 1); render(); refocus("#adv-role"); break;
    case "advadd": { const p = advPicked(); S.adv.add.push({ role: p.role, where: p.where, scope: S.adv.scope || null, custom: p.custom }); S.adv.pick = ""; S.adv.scope = ""; render(); refocus("#adv-role"); break; }
    case "advsave": saveAdvanced(); break;
    case "ovby": if (S.ov.by !== v) { S.ov = { by: v, subject: null, page: 0 }; S.q.ov = ""; } render(); break;
    case "ovpick": S.ov.subject = v; S.ov.page = 0; S.q.ov = ""; S.picker = false; S.q.picker = ""; render(); document.querySelector(".pickbtn")?.focus(); break;
    case "ovpage": S.ov.page = Math.max(0, S.ov.page + Number(v)); render(); refocus('[data-act="ovpage"]:not(:disabled)'); break;
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.role) return setRole(t.dataset.role, t.value);
  if (t.dataset.adv) { S.adv[t.dataset.adv] = t.value; if (t.dataset.adv === "pick") S.adv.scope = ""; render(); return refocus(`#${t.id}`); }
  if (t.dataset.check) { const s = S.checked[t.dataset.check]; t.checked ? s.add(t.dataset.v) : s.delete(t.dataset.v); render(); document.getElementById(t.id)?.focus(); return; }
  if (t.dataset.all) {
    const sides = t.dataset.all === "roster" ? ["granted", "catalog"] : [t.dataset.all];
    for (const side of sides) for (const m of shownRows(side)) if (movable(side, m)) t.checked ? S.checked[side].add(m.id) : S.checked[side].delete(m.id);
    render(); document.querySelector(`[data-all="${t.dataset.all}"]`)?.focus();
  }
});
document.addEventListener("input", (e) => { const q = e.target.dataset.q; if (q) { S.q[q] = e.target.value; if (q === "ov") S.ov.page = 0; render(); } });
function refocus(sel) { document.querySelector(sel)?.focus(); }
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (S.dialog) { S.dialog = null; render(); return; }
    if (S.picker) { S.picker = false; render(); document.querySelector(".pickbtn")?.focus(); return; }
    if (S.help) { S.help = false; render(); document.querySelector(".helpbtn")?.focus(); return; }
  }
  if (e.key === "Tab" && S.dialog) {
    const f = [...document.querySelectorAll(".dialog :is(button, select, input, a)")].filter((x) => !x.disabled);
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  }
});
// Re-render when the transfer list form (948 px of main width) or the Overview table (768 px) changes.
const layout = () => `${wide()}|${matchMedia("(min-width:768px)").matches}`;
let wasWide = null;
addEventListener("resize", () => { if (layout() !== wasWide) { wasWide = layout(); render(); } });

if (P.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
applyState(P.get("state"));
render(); wasWide = layout(); render();
</script>
</body>
</html>
