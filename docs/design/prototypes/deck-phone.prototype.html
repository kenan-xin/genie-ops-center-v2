<!DOCTYPE html>
<!-- PROTOTYPE, throwaway. Icons: Lucide (ISC), the paths the app uses (Sparkles for the agent). Phone deck page (390 px), follow-up 13. Replaces the editor screen of phone-adapt.prototype.html,
     which covered only the style dock (owner, 2026-11-14: "we should not blindly trust the prototype").
     Question: how does the phone deck page fit every action it must offer, with the slide near the top?
     Switch with ?state=idle|selected|tool|slide-more|element-more, or the bar at the bottom.
     Must keep: Present and "Present with notes" (R-55a), the agent button (R-42), "Figures as of" and Refresh data (R-54),
     Export to PowerPoint (R-55), Add element and Background (R-52a), Edit slide, Undo (R-46), the notes pane (owner pick C).
     Pattern: a two-state dock, as the mobile slide apps use: slide tools with nothing selected, element tools with a selection.
     World: DESIGN.md (white page, hairlines, 8px controls, 12px sheets, one blue accent, 44px targets). Data: fictional. No network. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE: phone deck page with a two-state dock</title>
<style>
:root{--bg:#fff;--fg:#111827;--panel:#f9fafb;--tile:#f3f4f6;--hair:#e5e7eb;--control:#d1d5db;--input:#6b7280;--muted:#4b5563;--idle:#374151;--primary:#2563eb;--info:#eff6ff;--danger:#b91c1c;--font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font);color:var(--fg);background:#e9ebef;padding:20px 16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.stage{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:820px){.stage{grid-template-columns:1fr}}
.phone{width:390px;height:844px;background:#fff;border-radius:36px;box-shadow:0 0 0 10px #1f2937,0 30px 60px -20px rgb(0 0 0/.45);overflow:hidden;position:relative;display:flex;flex-direction:column}
.status{height:40px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 4px;font-size:.8125rem;font-weight:600}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}.sm{width:16px;height:16px}.agent{width:17px;height:17px}
.bar{flex:none;display:flex;align-items:center;gap:2px;padding:4px 12px 6px 4px;border-bottom:1px solid var(--hair)}
.ib{width:44px;height:44px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--idle);flex:none;position:relative}
.ib:hover{background:var(--panel)}
.ttl{flex:1;min-width:0;padding:0 2px}.ttl b{display:block;font-size:.9375rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:.75rem;color:var(--muted);padding:10px 16px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.present{height:40px;border:0;border-radius:8px;background:var(--primary);color:#fff;font-weight:600;font-size:.875rem;padding:0 12px;display:flex;align-items:center;gap:6px;flex:none}
.agentdot{position:absolute;top:5px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--primary);border:2px solid #fff}
.scroll{flex:1;overflow:auto;background:var(--panel)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.th{flex:none;width:76px;border:0;background:none;padding:0;display:grid;gap:3px;justify-items:start;font-size:.6875rem;color:var(--muted);font-weight:600}
.th i{display:block;width:76px;aspect-ratio:16/9;border-radius:4px;background:#fff;border:1px solid var(--hair);position:relative;overflow:hidden}
.th i::before{content:"";position:absolute;left:8%;top:14%;width:70%;height:7%;background:#111827;border-radius:1px}
.th i::after{content:"";position:absolute;left:8%;top:34%;width:50%;height:5%;background:#9ca3af;border-radius:1px}
.th[aria-current=true] i{outline:2px solid var(--primary);outline-offset:1px}
.th.add i{display:grid;place-items:center;border-style:dashed;color:var(--muted)}.th.add i::before,.th.add i::after{display:none}
.slidewrap{padding:0 16px}
.slide{position:relative;aspect-ratio:16/9;background:#fff;border-radius:6px;box-shadow:0 0 0 1px var(--hair);font-size:11px}
.s-title{position:absolute;left:5%;top:9%;right:5%;font-weight:700;font-size:15px;padding:2px}
.s-rule{position:absolute;left:5%;right:5%;top:30%;height:2px;background:#93c5fd}
.s-text{position:absolute;left:5%;top:37%;width:88%;height:48%;padding:3px;color:#374151}
.s-foot{position:absolute;left:5%;right:5%;bottom:5%;display:flex;justify-content:space-between;font-size:8px;color:#6b7280}
.sel{position:absolute;inset:0;border:2px solid var(--primary);border-radius:2px;pointer-events:none}
.sel b{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--primary);border-radius:3px}
.sel b:nth-child(1){left:-7px;top:-7px}.sel b:nth-child(2){right:-7px;top:-7px}.sel b:nth-child(3){left:-7px;bottom:-7px}.sel b:nth-child(4){right:-7px;bottom:-7px}
.hint{font-size:.8125rem;color:var(--muted);padding:8px 16px 0;min-height:28px}
.notes{margin:12px 16px 0;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:12px}
.notes .h{display:flex;justify-content:space-between;align-items:center;font-size:.875rem;font-weight:600;margin-bottom:8px}
.notes textarea{width:100%;min-height:96px;border:1px solid var(--input);border-radius:8px;padding:10px 12px;font:inherit;font-size:1rem;resize:none}
.cnt{font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between;margin-top:6px}
.dock{flex:none;background:#fff;border-top:1px solid var(--hair);padding:4px 4px 22px;position:relative;z-index:5}
.dock .ctx{display:flex;align-items:center;justify-content:space-between;padding:2px 12px 2px 16px;font-size:.8125rem;color:var(--muted);min-height:36px}
.done{border:0;background:none;color:var(--primary);font-weight:600;font-size:.875rem;height:36px;padding:0 6px}
.tools{display:flex;justify-content:space-around}
.tool{width:68px;min-height:52px;border:0;background:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.6875rem;font-weight:600;color:var(--idle)}
.tool[aria-pressed=true]{color:var(--primary);background:var(--info)}
.card{position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);background:#fff;border:1px solid var(--hair);border-radius:12px;box-shadow:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1);padding:14px 16px}
.lbl{font-size:.875rem;font-weight:600;margin-bottom:8px}
.sws{display:flex;gap:10px;flex-wrap:wrap}.sw{width:40px;height:40px;border-radius:10px;border:1px solid var(--hair)}.sw.on{outline:2px solid var(--primary);outline-offset:2px}
.pills{display:flex;gap:8px;margin-top:12px}.pill{height:40px;border-radius:8px;border:1px solid var(--hair);background:#fff;padding:0 12px;font-weight:600;font-size:.875rem;display:flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgb(17 24 39/.07)}
.scrim{position:absolute;inset:0;background:rgb(17 24 39/.38);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;z-index:21;padding:8px 12px 26px;box-shadow:0 25px 50px -12px rgb(17 24 39/.18)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--control);margin:0 auto 10px}
.sheet h2{font-size:.8125rem;color:var(--muted);font-weight:600;margin:4px 8px 6px}
.row{width:100%;min-height:52px;border:0;background:none;border-radius:10px;display:flex;align-items:center;gap:14px;padding:0 10px;font-size:.9375rem;text-align:left}
.row:hover{background:var(--panel)}.row small{display:block;color:var(--muted);font-size:.75rem}
.sep{height:1px;background:var(--hair);margin:6px 8px}
.side{background:#fff;border:1px solid var(--hair);border-radius:12px;padding:18px 20px;font-size:.9375rem;line-height:1.55;min-width:0}
.side h2{font-size:1.0625rem;margin:0 0 6px}.side h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}.side ul{margin:0;padding-left:18px}
.switcher{background:#111827;border-radius:14px;padding:6px;display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.switcher button{border:0;background:none;color:#fff;height:40px;padding:0 12px;border-radius:10px;font-weight:600;font-size:.8125rem}.switcher button[aria-pressed=true]{background:#fff;color:#111827}
</style></head><body>
<div class="stage"><div class="phone" id="phone"></div><div><div class="switcher" id="sw" role="group" aria-label="State"></div><aside class="side" id="side"></aside></div></div>
<script>
const P={back:'<path d="m15 18-6-6 6-6"/>',undo:'<path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',spark:'<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4M22 4h-4"/><circle cx="4" cy="20" r="2"/>',play:'<path d="M6 3v18l14-9z"/>',plus:'<path d="M5 12h14M12 5v14"/>',bucket:'<path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0zM5 2l5 5M2 13h15M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4z"/>',pencil:'<path d="M21.2 6.8a2.8 2.8 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.8l-1.3 4.4a.5.5 0 0 0 .6.6l4.4-1.3a2 2 0 0 0 .8-.5zM15 5l4 4"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',type:'<path d="M4 7V4h16v3M9 20h6M12 4v16"/>',square:'<rect x="3" y="3" width="18" height="18" rx="2"/>',move:'<path d="m5 9-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/>',file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zM14 2v4a2 2 0 0 0 2 2h4M9 15l3 3 3-3M12 18v-6"/>',refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',notes:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zM14 2v4a2 2 0 0 0 2 2h4M8 13h8M8 17h6"/>',trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',copy:'<rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16V4a2 2 0 0 1 2-2h12"/>',bold:'<path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"/>',align:'<path d="M15 12H3M17 18H3M21 6H3"/>',reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>'};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const STATES={idle:'Nothing selected','selected':'Text selected','tool':'Text tool open','slide-more':'More, nothing selected','element-more':'More, text selected'};
const S={st:new URLSearchParams(location.search).get('state')||'idle'};
function render(){
 const sel=S.st==='selected'||S.st==='tool'||S.st==='element-more';
 const top=`<div class="status"><span>9:41</span><span>5G</span></div><div class="bar"><button class="ib" aria-label="Back to decks">${ic('back')}</button><div class="ttl"><b>Collections are on track for October</b></div><button class="ib" aria-label="Undo">${ic('undo')}</button><button class="ib" aria-label="Agent">${ic('spark','agent')}<span class="agentdot"></span></button><button class="present" aria-label="Present">${ic('play','sm')}Present</button></div>`;
 const strip=`<div class="meta">2 slides · figures as of 27 Oct 2026</div><div class="strip" aria-label="Slides">${[1,2].map(n=>`<button class="th" aria-current="${n==1}"><i></i>${n}</button>`).join('')}<button class="th add" aria-label="Add slide"><i>${ic('plus','sm')}</i>Add</button></div>`;
 const slide=`<div class="slidewrap"><div class="slide" aria-label="Slide 1"><div class="s-title">Collections are on track for October.</div><div class="s-rule"></div><div class="s-text">Every figure comes from the linked payments.${sel?'<span class="sel"><b></b><b></b><b></b><b></b></span>':''}</div><div class="s-foot"><span>Figures as of 27 Oct 2026</span><span>1</span></div></div></div>`;
 const hint=`<div class="hint">${sel?'Drag to move. Drag a corner to resize, or tap Position.':'Tap an element on the slide to style it.'}</div>`;
 const notes=`<div class="notes"><div class="h"><span>Speaker notes</span><span style="font-size:.75rem;color:#047857;font-weight:600">Saved</span></div><textarea aria-label="Speaker notes" placeholder="What you want to say on this slide"></textarea><div class="cnt"><span>Only you see notes. They go to PowerPoint.</span><span>0 / 2,000</span></div></div><div style="height:16px"></div>`;
 let dock;
 if(!sel){dock=`<div class="dock"><div class="tools">${[['Add','plus','Add element'],['Background','bucket','Background'],['Edit slide','pencil','Edit slide'],['More','more','More','slide-more']].map(([l,i,a,go])=>`<button class="tool" ${go?`data-go="${go}"`:''} aria-label="${a}" aria-pressed="${S.st===go}">${ic(i)}${l}</button>`).join('')}</div></div>`}
 else{const card=S.st==='tool'?`<div class="card" role="dialog" aria-label="Text style"><div class="lbl">Text color</div><div class="sws">${['#111827','#ffffff','#1e3a8a','#2563eb','#047857','#b91c1c','#6b7280'].map((c,i)=>`<button class="sw ${i==0?'on':''}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}</div><div class="pills"><button class="pill">${ic('bold','sm')}Bold</button><button class="pill">${ic('align','sm')}Left</button><button class="pill">Size 18</button></div></div>`:'';
  dock=`<div class="dock">${card}<div class="ctx"><span>Text box</span><button class="done" data-go="idle">Done</button></div><div class="tools">${[['Text','type','tool'],['Fill','bucket'],['Border','square'],['Position','move'],['More','more','element-more']].map(([l,i,go])=>`<button class="tool" ${go?`data-go="${go}"`:''} aria-pressed="${S.st===go}">${ic(i)}${l}</button>`).join('')}</div></div>`}
 let sheet='';
 if(S.st==='slide-more')sheet=`<div class="scrim" data-go="idle"></div><div class="sheet" role="dialog" aria-label="Deck and slide actions"><div class="grab"></div><h2>Present</h2><button class="row">${ic('notes')}<span>Present with notes<small>Opens the presenter window</small></span></button><div class="sep"></div><h2>Deck</h2><button class="row">${ic('file')}<span>Export to PowerPoint</span></button><button class="row">${ic('refresh')}<span>Refresh data<small>Figures are as of 27 Oct 2026</small></span></button><button class="row">${ic('pencil')}<span>Rename deck</span></button><div class="sep"></div><h2>This slide</h2><button class="row" style="color:var(--danger)">${ic('trash')}<span>Delete slide</span></button></div>`;
 if(S.st==='element-more')sheet=`<div class="scrim" data-go="selected"></div><div class="sheet" role="dialog" aria-label="Text box actions"><div class="grab"></div><h2>Text box</h2><button class="row">${ic('pencil')}<span>Edit text</span></button><button class="row">${ic('reset')}<span>Use theme style</span></button><button class="row" style="color:var(--danger)">${ic('trash')}<span>Delete element</span></button></div>`;
 document.getElementById('phone').innerHTML=top+`<div class="scroll">${strip}${slide}${hint}${notes}</div>`+dock+sheet;
 document.getElementById('sw').innerHTML=Object.entries(STATES).map(([k,v])=>`<button data-go="${k}" aria-pressed="${S.st===k}">${v}</button>`).join('');
 document.getElementById('side').innerHTML=`<h2>Phone deck page: ${STATES[S.st]}</h2><div style="color:var(--muted);font-size:.875rem">390 by 844. Desktop stays as built.</div><h3>What changed from the first prototype</h3><ul><li>The dock has two states. Nothing selected: Add, Background, Edit slide, More. An element selected: Text, Fill, Border, Position, More, with the element name and Done above.</li><li>More holds what the page dropped: Present with notes, Export to PowerPoint, Refresh data, Rename and Delete slide.</li><li>The agent button stays in the top bar, with its working dot.</li><li>"Figures as of" sits on its own line under the top bar, and on each slide.</li><li>The slide strip shows small previews and an Add tile.</li><li>The notes pane stays under the slide, your pick C.</li></ul><h3>What it costs</h3><p style="margin:0">Export and Present with notes are one tap deeper than on the built page. A long title cuts off with an ellipsis; the slide count and figures date sit on one line under the top bar.</p><h3>Try</h3><p style="margin:0">Tap More, then Done, then the bar at the bottom.</p>`;
 const u=new URL(location);u.searchParams.set('state',S.st);history.replaceState(null,'',u);
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t){S.st=t.dataset.go;render();return}const s=e.target.closest('.slide');if(s&&S.st==='idle'){S.st='selected';render()}});
render();
</script></body></html>
