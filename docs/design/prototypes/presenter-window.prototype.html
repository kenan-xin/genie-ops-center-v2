<!DOCTYPE html>
<!-- PROTOTYPE, throwaway. Speaker notes and the presenter window, S7-45 (czjw.115), wave 5 W3a.
     Switch with ?variant=A|B|C and &state=presenter|last-slide|no-notes|long-notes|audience|open-present|editor-notes|editor-notes-phone|notes-cap.
     The switcher at the bottom (top on a phone) changes both. Arrow keys and Space move the slides in the presenter states.
     Question (gate G2, picked in Phase 12): how is the presenter window laid out, how does it open, and where do notes sit in the phone editor sheet?
     A: slide first. The current slide takes about 62 percent on the left, next slide and notes on the right, timer in the top bar.
        Opens from a Present split button, item "Present with notes". Phone sheet: Notes sits under the Title field.
     B: notes first. Notes in a large reading column at 20 px, timer, current and next slide stacked on the right.
        Opens from a Present menu with "Present" and "Presenter view". Phone sheet: Notes is its own tab beside Content.
     C: stacked. Current and next slide side by side on top, notes full width below, timer in the top bar.
        Present always opens the audience and presenter windows together. Phone sheet: Notes is the last field.
     Common: present mode's black frame and round pill toolbar (here the controls never fade, so captures show them), a timer with
     elapsed time, Pause and Reset, "This is the last slide" in place of the next slide, "No notes for this slide", notes that scroll.
     Editor: a Speaker notes field under the slide at desktop, with a count, saving one step per pause (one Undo entry each).
     The Edit slide sheet holds the same notes field at every width; on a phone it is the only place to edit notes.
     Notes cap: 2,000 characters (inferred, contract style "Notes hold at most 2,000 characters."); the field stops at the cap.
     Phone presenter states: a one-column render for review; a presenter needs a second screen (P01-6).
     The two windows sync over BroadcastChannel "deck-q3": open this file in two tabs and move one. In-memory state, no network.
     World: DESIGN.md fixed layer (tokens, 8px controls, 12px cards, hairlines). Lucide icons (ISC).
     Data: fictional sample deck, no real person and no customer name. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE: Presenter window and speaker notes</title>
<style>
  :root{
    --background:#fff;--foreground:#111827;--muted:#f9fafb;--muted-foreground:#4b5563;--tile:#f3f4f6;
    --border:#e5e7eb;--control:#d1d5db;--input:#6b7280;--primary:#2563eb;--ring:var(--primary);
    --body-2:#374151;--danger:#b91c1c;--sel-bg:#eff6ff;--ok:#047857;
    --font-sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --text-xs:max(12px,.8rem);--text-sm:.875rem;--ease:cubic-bezier(.16,1,.3,1);
    --shadow-pop:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);
  }
  html{font-size:15px;scrollbar-color:#d1d5db transparent}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);font-size:1rem;line-height:1.5;color:var(--foreground);background:#fff;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
  h1,h2,p{margin:0}
  .num{font-variant-numeric:tabular-nums}
  .ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* deck page (editor) */
  .page{max-width:1280px;margin:0 auto;padding:24px 32px 96px}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
  .head h1{font-size:1.5rem;font-weight:700;letter-spacing:-.025em;line-height:1.25}
  .head p{margin-top:2px;font-size:var(--text-sm);color:var(--muted-foreground)}
  .head .act{display:flex;align-items:center;gap:8px;position:relative}
  .btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--control);border-radius:8px;background:#fff;color:#1f2937;font:inherit;font-size:var(--text-sm);font-weight:600;white-space:nowrap;cursor:pointer;transition:background-color .15s var(--ease)}
  .btn:hover{background:var(--muted)}
  .btn.pri{border-color:var(--primary);background:var(--primary);color:#fff}.btn.pri:hover{opacity:.94;background:var(--primary)}
  .btn.icon{width:40px;padding:0;justify-content:center}
  .btn:disabled{color:#6b7280;background:var(--muted);cursor:not-allowed}
  .split{display:inline-flex}
  .split .btn:first-child{border-radius:8px 0 0 8px}
  .split .btn:last-child{border-radius:0 8px 8px 0;width:36px;padding:0;justify-content:center;border-left-color:rgb(255 255 255 / .45)}
  .ghost{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px;border:0;background:none;border-radius:8px;color:var(--body-2);font:inherit;font-size:var(--text-sm);font-weight:500;cursor:pointer}
  .ghost:hover{background:var(--muted)}
  .ghost.link{color:var(--primary);font-weight:600}

  .body{display:flex;gap:16px;align-items:flex-start}
  .rail{display:flex;flex-direction:column;gap:12px;width:160px;flex:none;margin:0;padding:0;list-style:none}
  .thumb{display:flex;gap:6px;align-items:flex-start;width:100%;padding:0;border:0;background:none;font:inherit;cursor:pointer;color:var(--muted-foreground);font-size:var(--text-xs)}
  .thumb .n{width:14px;text-align:right;padding-top:2px}
  .thumb .sl{flex:1;border:1px solid var(--border);border-radius:6px}
  .thumb[aria-current=true] .sl{outline:2px solid var(--primary);outline-offset:1px}
  .thumb[aria-current=true] .n{color:var(--foreground);font-weight:700}
  .mainc{flex:1;min-width:0;max-width:880px;display:flex;flex-direction:column;gap:12px}
  .ebar{display:flex;align-items:center;gap:8px}
  .ebar .sp{flex:1}
  .ebar .undo-l{color:var(--muted-foreground);font-weight:500}
  .stage{border:1px solid var(--border);border-radius:12px;overflow:hidden}

  /* notes field */
  .notes{display:grid;gap:6px}
  .notes .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .notes label{font-size:var(--text-sm);font-weight:600}
  .notes textarea{width:100%;min-height:132px;resize:vertical;border:1px solid var(--input);border-radius:8px;padding:10px 12px;font:inherit;font-size:var(--text-sm);line-height:1.55;color:var(--foreground);background:#fff}
  .notes .help{font-size:var(--text-xs);color:var(--muted-foreground)}
  .notes .meta{display:flex;justify-content:space-between;gap:12px;font-size:var(--text-xs);color:var(--muted-foreground)}
  .notes .meta .cap{color:var(--danger);font-weight:600}
  .saved{display:inline-flex;align-items:center;gap:4px}
  .saved.ok{color:var(--ok);font-weight:600}
  .preview{display:grid;gap:6px;padding:12px;border:1px solid var(--border);border-radius:12px}
  .preview p{font-size:var(--text-sm);color:var(--body-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .preview .row{display:flex;justify-content:space-between;align-items:center}
  .preview h2{font-size:var(--text-sm);font-weight:600}

  /* menu */
  .pop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:264px;padding:6px;border:1px solid var(--border);border-radius:8px;background:#fff;box-shadow:var(--shadow-pop)}
  .menu{display:grid;gap:2px;margin:0;padding:0;list-style:none}
  .mi{display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px;border:0;border-radius:6px;background:none;font:inherit;text-align:left;cursor:pointer;color:var(--foreground);font-size:var(--text-sm)}
  .mi:hover{background:var(--muted)}
  .mi .ic{margin-top:2px}
  .mi small{display:block;font-size:var(--text-xs);color:var(--muted-foreground)}
  .callout{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid #bfdbfe;border-radius:8px;background:var(--sel-bg);color:#1e3a8a;font-size:var(--text-sm)}
  .callout .ic{margin-top:2px}
  .callout .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

  /* Edit slide sheet */
  .scrim{position:fixed;inset:0;z-index:40;background:rgb(17 24 39 / .4)}
  .sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:440px;display:flex;flex-direction:column;background:#fff;box-shadow:-10px 0 24px -8px rgb(0 0 0 / .2)}
  .sheet .top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
  .sheet .top h2{font-size:1.05rem;font-weight:700}
  .sheet .in{flex:1;overflow:auto;padding:16px 20px;display:grid;gap:16px;align-content:start}
  .sheet .sfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
  .fld{display:grid;gap:6px}
  .fld label{font-size:var(--text-sm);font-weight:600}
  .fld input,.fld textarea{width:100%;border:1px solid var(--input);border-radius:8px;padding:8px 12px;font:inherit;font-size:var(--text-sm);color:var(--foreground);background:#fff}
  .fld textarea{min-height:96px;resize:vertical}
  .tabs{display:flex;gap:2px;padding:3px;border-radius:8px;background:var(--tile)}
  .tabs button{flex:1;height:32px;border:0;border-radius:6px;background:none;font:inherit;font-size:var(--text-sm);font-weight:500;color:var(--muted-foreground);cursor:pointer}
  .tabs button[aria-selected=true]{background:#fff;color:var(--foreground);font-weight:700;box-shadow:0 0 0 1px var(--border),0 1px 2px rgb(17 24 39 / .06)}
  .grab{display:none}

  /* slides (shared renderer) */
  .sl{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#fff;container-type:inline-size}
  .canvas{position:absolute;top:0;left:0;width:960px;height:540px;transform-origin:0 0;transform:scale(calc(100cqw / 960px));overflow:hidden;color:#111827}
  .box{position:absolute;overflow:hidden}
  .box p{margin:0;line-height:1.3}
  .box ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;height:100%;justify-content:center;font-size:24px}
  .box li{display:flex;gap:10px}
  .foot{position:absolute;display:flex;justify-content:space-between;font-size:12px;color:#4b5563}
  .chart svg{width:100%;height:100%;display:block}
  .tbl{width:100%;border-collapse:collapse;font-size:20px}
  .tbl td,.tbl th{padding:10px 12px;border-bottom:1px solid #e5e7eb;text-align:left}
  .tbl th{font-size:14px;color:#4b5563}

  /* presenter window: present mode's black frame */
  .pv{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;color:#fff;z-index:10}
  .pv .bar{display:flex;align-items:center;gap:16px;height:56px;padding:0 20px;flex:none;border-bottom:1px solid rgb(255 255 255 / .12)}
  .pv .bar .t{font-size:var(--text-sm);color:rgb(255 255 255 / .75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pv .bar .sp{flex:1}
  .sync{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);color:rgb(255 255 255 / .75);white-space:nowrap}
  .sync i{width:8px;height:8px;border-radius:50%;background:#34d399}
  .timer{display:inline-flex;align-items:center;gap:4px}
  .timer output{font-size:1.25rem;font-weight:700;min-width:4.2ch;text-align:right;letter-spacing:.01em}
  .timer output.paused{color:#fcd34d}
  .wbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:36px;height:36px;padding:0 10px;border:0;border-radius:999px;background:none;color:#fff;font:inherit;font-size:var(--text-sm);font-weight:600;cursor:pointer}
  .wbtn:hover{background:rgb(255 255 255 / .15)}
  .wbtn:disabled{color:rgb(255 255 255 / .55);cursor:not-allowed;background:none}
  .wbtn:focus-visible{outline-color:#93c5fd}
  .grid{flex:1;min-height:0;display:grid;gap:16px;padding:16px 20px}
  .cell{min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px}
  .lab{font-size:var(--text-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgb(255 255 255 / .75);display:flex;justify-content:space-between;gap:8px}
  .fit{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
  .fit > .sl{width:min(100cqw,calc(100cqh * 16 / 9));border-radius:4px}
  .end{flex:1;display:grid;place-items:center;text-align:center;padding:16px;border:1px dashed rgb(255 255 255 / .3);border-radius:8px;color:rgb(255 255 255 / .8);font-size:var(--text-sm)}
  .end b{display:block;color:#fff;font-size:1rem;margin-bottom:2px}
  .np{flex:1;min-height:0;overflow:auto;padding:16px 18px;border:1px solid rgb(255 255 255 / .14);border-radius:12px;background:#18181b;color:#f9fafb;line-height:1.6;scrollbar-color:#52525b transparent}
  .np p+p{margin-top:.8em}
  .np.none{display:grid;place-items:center;color:rgb(255 255 255 / .75);font-size:var(--text-sm)}
  .pill{display:flex;justify-content:center;padding:12px 16px 16px;flex:none}
  .pill > div{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgb(255 255 255 / .1)}
  .pill .cnt{min-width:3.5rem;padding:0 6px;text-align:center;font-size:var(--text-sm)}
  .pill .vr{width:1px;height:20px;margin:0 4px;background:rgb(255 255 255 / .25)}
  .hints{font-size:var(--text-xs);color:rgb(255 255 255 / .7);white-space:nowrap}
  kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border:1px solid rgb(255 255 255 / .3);border-radius:4px;font:inherit;font-size:11px;font-weight:600}
  /* A slide first */
  .v-A .grid{grid-template-columns:62fr 38fr}
  .v-A .side{display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;min-height:0}
  .v-A .np{font-size:18px}
  .v-A .nextcell .fit{flex:none;container-type:inline-size}
  .v-A .nextcell .fit > .sl{width:100%}
  /* B notes first */
  .v-B .grid{grid-template-columns:52fr 48fr}
  .v-B .np{font-size:20px}
  .v-B .side{display:grid;grid-template-rows:auto minmax(0,1.6fr) minmax(0,1fr);gap:12px;min-height:0}
  .bigtimer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;border:1px solid rgb(255 255 255 / .14);border-radius:12px}
  .bigtimer output{font-size:2.25rem;font-weight:700}
  /* C stacked */
  .v-C .grid{grid-template-rows:minmax(0,1.25fr) minmax(0,1fr)}
  .v-C .top2{display:grid;grid-template-columns:3fr 2fr;gap:16px;min-height:0}
  .v-C .np{font-size:18px}

  /* audience state: two screens side by side */
  .desk{position:fixed;inset:0;background:#e5e7eb;display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:48px 32px 96px;align-content:center}
  .desk > div > h2{font-size:var(--text-sm);font-weight:700;color:#374151;margin-bottom:8px}
  .screen{position:relative;width:100%;aspect-ratio:16/10;container-type:inline-size;border-radius:8px;overflow:hidden;box-shadow:0 0 0 6px #1f2937,0 18px 36px -12px rgb(0 0 0 / .45)}
  .screen > .inner{position:absolute;top:0;left:0;width:1280px;height:800px;transform-origin:0 0;transform:scale(calc(100cqw / 1280px))}
  .screen .pv{position:absolute}
  .aud{position:absolute;inset:0;background:#000;display:flex;flex-direction:column}
  .aud .stagebox{flex:1;padding:16px;container-type:size;display:flex;align-items:center;justify-content:center}
  .aud .stagebox .sl{width:min(100cqw,calc(100cqh * 16 / 9))}

  .toast{position:fixed;z-index:80;top:16px;left:50%;transform:translate(-50%,-8px);display:flex;gap:10px;align-items:center;padding:6px 14px;border-radius:999px;background:#111827;color:#f9fafb;font-size:var(--text-sm);opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease)}
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

  /* phone (adapt) */
  @media (max-width:767px){
    .page{padding:56px 16px 24px}
    .head{flex-direction:column;gap:12px;margin-bottom:12px}
    .head h1{font-size:1.25rem}
    .head .wide{display:none}
    .btn{height:44px}
    .split .btn:last-child{width:44px}
    .body{flex-direction:column;gap:12px;align-items:stretch}
    .rail{flex-direction:row;width:100%;overflow-x:auto;padding:2px 2px 6px}
    .thumb{width:112px;flex:none}
    .ebar .undo-l{display:none}
    .pop{left:0;right:auto}
    .scrim{background:rgb(17 24 39 / .4)}
    .sheet{top:auto;left:0;width:auto;max-height:86vh;border-radius:16px 16px 0 0;box-shadow:0 -10px 24px -8px rgb(0 0 0 / .2)}
    .sheet .top{padding:8px 16px 12px;flex-wrap:wrap}
    .grab{display:block;flex:0 0 100%;height:4px;margin-bottom:8px;background:linear-gradient(var(--control),var(--control)) center/36px 4px no-repeat}
    .sheet .in{padding:16px}
    .fld input,.fld textarea,.notes textarea{font-size:16px}
    .fld input{height:44px}
    .tabs button{height:44px}
    .ghost{min-height:44px;min-width:44px;justify-content:center}
    /* presenter on a phone: one column for review */
    .pv{position:static;min-height:100vh;padding-top:48px}
    .pv .bar{height:auto;flex-wrap:wrap;gap:8px;padding:10px 16px}
    .pv .bar .t{flex-basis:100%}
    .grid,.v-A .grid,.v-B .grid,.v-C .grid{display:flex;flex-direction:column;padding:12px 16px}
    .v-A .side,.v-B .side,.v-C .top2{display:flex;flex-direction:column;gap:12px}
    .fit{container-type:inline-size;flex:none}
    .fit > .sl{width:100%}
    .np{max-height:50vh;font-size:17px!important}
    .nextcell .fit > .sl{width:60%}
    .v-B .npcell{order:2}
    .pill{position:sticky;bottom:0;background:#000}
    .wbtn{min-width:44px;height:44px}
    .hints{display:none}
    .desk{position:static;grid-template-columns:1fr;padding:56px 16px 24px}
    .screen{aspect-ratio:16/10}
  }

  /* Review switcher, not part of the design */
  #sw{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:6px;padding:5px;border-radius:999px;background:#0b0f19;color:#f9fafb;font-size:var(--text-xs);box-shadow:0 0 0 1px #374151,0 12px 32px -8px rgb(0 0 0 / .5);white-space:nowrap}
  #sw button{height:30px;padding:0 10px;border:0;border-radius:999px;background:none;color:#d1d5db;font:inherit;font-size:var(--text-xs);font-weight:600;cursor:pointer}
  #sw button:hover{background:#1f2937;color:#fff}
  #sw button[aria-pressed=true]{background:#f9fafb;color:#0b0f19}
  #sw select{height:30px;border:0;border-radius:999px;background:#1f2937;color:#f9fafb;font:inherit;font-size:var(--text-xs);padding:0 8px}
  #sw .name{min-width:13rem;text-align:center;font-weight:500;color:#e5e7eb}
  #sw .tag{padding:0 4px 0 10px;color:#9ca3af;letter-spacing:.06em;font-weight:700;font-size:10px}
  .pvmode #sw{left:16px;transform:none}
  @media (max-width:767px){#sw,.pvmode #sw{top:8px;bottom:auto;left:50%;right:auto;transform:translateX(-50%);max-width:calc(100% - 16px);overflow-x:auto}#sw .name,#sw .tag{display:none}}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>
<nav id="sw" aria-label="Prototype switcher">
  <span class="tag">PROTOTYPE</span>
  <button type="button" data-v="A">A</button><button type="button" data-v="B">B</button><button type="button" data-v="C">C</button>
  <span class="name" aria-live="polite"></span>
  <label class="sr" for="stsel">State</label>
  <select id="stsel"></select>
</nav>
<script>
const ICONS = {
  play:'<polygon points="6 3 20 12 6 21 6 3"/>',
  presenter:'<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="M6 8h6"/><path d="M6 12h9"/>',
  down:'<path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>',
  more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  chev:'<path d="m6 9 6 6 6-6"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"/>',
  pencil:'<path d="M21.2 6.8a1 1 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.8l-1.3 4.4a.5.5 0 0 0 .6.6l4.4-1.3a2 2 0 0 0 .8-.5Z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  pause:'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
  reset:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
};
const ic = (n, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n.toLocaleString("en-US");

/* ---------- sample deck ---------- */
const CAP = 2000;
const LONG = (() => {
  const parts = [
    "Open with the headline: cash collected rose 12 percent on the second quarter, and the rise came from fewer late payers, not from new sales.",
    "Point at the three columns. July was the slow month because two large invoices moved to August after the customers changed their approval steps.",
    "September is the best month of the year so far. Say that the reminder emails started on 2 September, and that most of the gain came after that date.",
    "If someone asks about the overdue total, do not give a number here. The next slide shows it by customer.",
    "Pause for questions before the next slide. Expect a question about payment terms for new accounts, and answer that the review is on the last slide.",
  ];
  let t = ""; let i = 0;
  while (t.length < CAP) { t += (t ? "\n" : "") + parts[i % parts.length]; i++; }
  return t.slice(0, CAP);
})();
const deck = () => [
  { bg:"#1E3A8A", els:[{ k:"title", t:"Quarter review", b:[40,184,880,88], st:"color:#fff;font-size:56px;font-weight:700" }, { k:"text", t:"Collections and payments, third quarter 2026", b:[40,288,880,48], st:"color:#dbeafe;font-size:24px" }],
    notes:"Welcome everyone. This review takes about ten minutes.\nThree topics: cash collected, the overdue invoices, and next steps." },
  { els:[{ k:"title", t:"Collections, third quarter", b:[40,32,880,88] }, { k:"text", t:"Cash collected rose 12 percent on the second quarter. Three invoices are more than 60 days overdue.", b:[40,136,320,348], st:"font-size:18px" }, { k:"chart", b:[384,136,536,348] }],
    notes:"Cash collected rose 12 percent. The gain came from fewer late payers, not from new sales.\nSeptember is the best month so far: the reminder emails started on 2 September.\nThe next slide shows the overdue invoices by customer." },
  { els:[{ k:"title", t:"Overdue by customer", b:[40,32,880,88] }, { k:"table", b:[40,136,880,348] }], notes:"" },
  { els:[{ k:"title", t:"Next steps", b:[40,32,880,88] }, { k:"bullets", items:["Call the three overdue customers","Send statements on 5 Oct","Review terms for new accounts"], b:[40,136,880,348] }],
    notes:"Ask the team who takes each call. Statements go out on 5 October." },
  { els:[{ k:"title", t:"Questions", b:[40,200,880,140], st:"font-size:56px;font-weight:700;text-align:center" }], notes:"Thank the room. Share the deck after the meeting." },
];
function elBody(e) {
  const st = e.st || (e.k === "title" ? "font-size:32px;font-weight:700" : "font-size:18px");
  switch (e.k) {
    case "title": case "text": return `<p style="${st}">${esc(e.t)}</p>`;
    case "bullets": return `<ul>${e.items.map(i => `<li><span aria-hidden="true">•</span><span>${esc(i)}</span></li>`).join("")}</ul>`;
    case "chart": {
      const data = [["Jul",182],["Aug",205],["Sep",231]];
      const bars = data.map(([m, v], i) => { const h = v / 250 * 200, x = 70 + i * 140; return `<rect x="${x}" y="${230 - h}" width="90" height="${h}" fill="#2563EB"/><text x="${x + 45}" y="254" text-anchor="middle" font-size="15" fill="#4b5563">${m}</text><text x="${x + 45}" y="${222 - h}" text-anchor="middle" font-size="15" fill="#111827" font-weight="600">${v}</text>`; }).join("");
      return `<div class="chart" style="height:100%"><svg viewBox="0 0 500 290" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><text x="0" y="18" font-size="15" font-weight="600" fill="#111827">Cash collected, SGD thousands</text><line x1="50" x2="500" y1="230" y2="230" stroke="#d1d5db"/>${bars}</svg></div>`;
    }
    case "table": return `<table class="tbl" aria-hidden="true">${[["Customer","Overdue","Days"],["Sample Trading","SGD 18,400","74"],["Example Supplies","SGD 9,150","66"],["Placeholder Logistics","SGD 4,200","61"]].map((r, i) => `<tr>${r.map(c => i ? `<td>${esc(c)}</td>` : `<th>${esc(c)}</th>`).join("")}</tr>`).join("")}</table>`;
    default: return "";
  }
}
function slideHtml(i, label) {
  const s = S.deck[i]; if (!s) return "";
  const dark = !!s.bg;
  const els = s.els.map(e => `<div class="box" style="left:${e.b[0]}px;top:${e.b[1]}px;width:${e.b[2]}px;height:${e.b[3]}px">${elBody(e)}</div>`).join("");
  const rule = s.els[0].b[1] < 100 ? `<div class="box" style="left:40px;top:120px;width:880px;height:4px;background:#2563EB"></div>` : "";
  const title = s.els[0].t;
  return `<div class="sl" ${label ? `role="img" aria-label="${esc(label)}: slide ${i + 1}, ${esc(title)}"` : 'aria-hidden="true"'}><div class="canvas" style="background:${s.bg || "#fff"}">${rule}${els}<div class="foot" style="left:40px;top:500px;width:880px;height:24px;${dark ? "color:#e5e7eb" : ""}"><span>Figures as of 30 Sep 2026</span><span>Demo Company</span></div></div></div>`;
}

/* ---------- state ---------- */
const VARIANTS = { A:"Slide first, split button", B:"Notes first, Present menu", C:"Stacked, opens both windows" };
const STATES = ["presenter","last-slide","no-notes","long-notes","audience","open-present","editor-notes","editor-notes-phone","notes-cap"];
const P = new URLSearchParams(location.search);
const S = {
  v: VARIANTS[P.get("variant")] ? P.get("variant") : "A",
  state: STATES.includes(P.get("state")) ? P.get("state") : "presenter",
  deck: deck(), i: 1, elapsed: 754, paused: false, menu: false, sheet: false, tab: "notes", undo: [], save: "saved", blocked: false,
};
const phone = () => matchMedia("(max-width: 767px)").matches;
const N = () => S.deck.length;
const mmss = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

/* ---------- sync: the audience and presenter windows share the shown slide ---------- */
const chan = "BroadcastChannel" in window ? new BroadcastChannel("deck-q3") : null;
if (chan) chan.onmessage = m => { if (m.data && m.data.type === "go" && m.data.i !== S.i) { S.i = m.data.i; render(); } };
function go(step) {
  const n = Math.min(Math.max(S.i + step, 0), N() - 1);
  if (n === S.i) return;
  S.i = n; if (chan) chan.postMessage({ type:"go", i:n }); render();
}

/* ---------- presenter window ---------- */
function timerHtml(big) {
  const out = `<output class="num ${S.paused ? "paused" : ""}" id="elapsed" aria-label="Elapsed time">${mmss(S.elapsed)}</output>`;
  const btns = `<button type="button" class="wbtn" data-act="pause" aria-label="${S.paused ? "Resume timer" : "Pause timer"}">${S.paused ? ic("play") : ic("pause")}</button><button type="button" class="wbtn" data-act="reset" aria-label="Reset timer">${ic("reset")}</button>`;
  return big ? `<div class="bigtimer"><div><div class="lab">Elapsed${S.paused ? " · paused" : ""}</div>${out}</div><div class="timer">${btns}</div></div>` : `<div class="timer" role="group" aria-label="Timer">${out}${S.paused ? '<span class="sr">paused</span>' : ""}${btns}</div>`;
}
function notesPanel() {
  const t = S.deck[S.i].notes;
  return `<div class="cell npcell"><h2 class="lab"><span>Notes</span><span class="num">Slide ${S.i + 1}</span></h2>${t ? `<div class="np" tabindex="0" role="region" aria-label="Notes for slide ${S.i + 1}">${t.split("\n").map(p => `<p>${esc(p)}</p>`).join("")}</div>` : `<div class="np none"><p>No notes for this slide.</p></div>`}</div>`;
}
function curCell() {
  return `<div class="cell" style="flex:1"><h2 class="lab"><span>Now showing</span></h2><div class="fit">${slideHtml(S.i, "Current")}</div></div>`;
}
function nextCell() {
  const last = S.i >= N() - 1;
  return `<div class="cell nextcell"><h2 class="lab"><span>Next</span>${last ? "" : `<span class="num">Slide ${S.i + 2}</span>`}</h2>${last ? `<div class="end"><p><b>This is the last slide.</b>Exit returns to the deck.</p></div>` : `<div class="fit">${slideHtml(S.i + 1, "Next")}</div>`}</div>`;
}
function pill() {
  return `<div class="pill"><div role="toolbar" aria-label="Presentation"><button type="button" class="wbtn" data-act="prev" aria-label="Previous slide" ${S.i === 0 ? "disabled" : ""}><span aria-hidden="true">←</span></button><span class="cnt num" aria-live="polite" aria-atomic="true">${S.i + 1} / ${N()}</span><button type="button" class="wbtn" data-act="next" aria-label="Next slide" ${S.i >= N() - 1 ? "disabled" : ""}><span aria-hidden="true">→</span></button><span class="vr" aria-hidden="true"></span><button type="button" class="wbtn" data-act="exit" aria-label="Exit"><span aria-hidden="true">✕</span></button></div></div>`;
}
function presenterHtml() {
  const bar = `<div class="bar"><h1 class="t">Presenter view · Quarter review, Q3 2026</h1><span class="sp"></span><span class="hints" aria-hidden="true"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>Esc</kbd> exits</span>${S.v === "B" ? "" : timerHtml(false)}<span class="sync"><i aria-hidden="true"></i>Audience window follows</span></div>`;
  let grid;
  if (S.v === "A") grid = `${curCell()}<div class="side">${nextCell()}${notesPanel()}</div>`;
  else if (S.v === "B") grid = `${notesPanel()}<div class="side">${timerHtml(true)}${curCell()}${nextCell()}</div>`;
  else grid = `<div class="top2">${curCell()}${nextCell()}</div>${notesPanel()}`;
  return `<section class="pv v-${S.v}" aria-label="Presenter window">${bar}<div class="grid">${grid}</div>${pill()}</section>`;
}
function audienceHtml() {
  return `<div class="desk"><div><h2>Screen 2: audience window (present mode, as today)</h2><div class="screen"><div class="inner"><div class="aud" role="group" aria-label="Audience window"><div class="stagebox">${slideHtml(S.i, "Audience window")}</div></div></div></div></div><div><h2>Screen 1: presenter window, on the laptop</h2><div class="screen"><div class="inner">${presenterHtml()}</div></div></div></div>`;
}

/* ---------- deck page (editor) ---------- */
function presentCtl() {
  if (S.v === "A") return `<div class="split"><button class="btn pri" data-act="toast" data-msg="Opens present mode">${ic("play")}Present</button><button class="btn pri" data-act="menu" aria-label="More ways to present" aria-haspopup="menu" aria-expanded="${S.menu}">${ic("chev")}</button></div>`;
  if (S.v === "B") return `<button class="btn pri" data-act="menu" aria-haspopup="menu" aria-expanded="${S.menu}">${ic("play")}Present${ic("chev")}</button>`;
  return `<button class="btn pri" data-act="present2">${ic("play")}Present</button>`;
}
function menuHtml() {
  if (!S.menu || S.v === "C") return "";
  const items = S.v === "A"
    ? [["play","Present","Full screen, slides only","Opens present mode"],["presenter","Present with notes","Opens a second window with your notes and a timer","Opens the presenter window and the audience window"]]
    : [["play","Present","Full screen, slides only","Opens present mode"],["presenter","Presenter view","Notes, next slide and a timer in a second window","Opens the presenter window and the audience window"]];
  return `<div class="pop" role="menu" aria-label="Present">${items.map(([i, t, s, m]) => `<button type="button" class="mi" role="menuitem" data-act="toast" data-msg="${m}">${ic(i)}<span>${t}<small>${s}</small></span></button>`).join("")}</div>`;
}
function railHtml() {
  return `<ol class="rail" aria-label="Slides">${S.deck.map((s, i) => `<li><button type="button" class="thumb" aria-current="${i === S.i}" aria-label="Slide ${i + 1}${i === S.i ? ", shown" : ""}${s.notes ? ", has notes" : ""}" data-act="show" data-val="${i}"><span class="n num" aria-hidden="true">${i + 1}</span>${slideHtml(i)}</button></li>`).join("")}</ol>`;
}
function saveLine() {
  const t = S.deck[S.i].notes, atCap = t.length >= CAP;
  const status = S.save === "saving" ? `<span class="saved">Saving…</span>` : S.save === "saved" ? `<span class="saved ok">${ic("check")}Saved</span>` : "";
  return `<div class="meta"><span id="notes-st" role="status">${atCap ? `<span class="cap">Notes hold at most ${fmt(CAP)} characters.</span>` : status}</span><span class="num" id="notes-count">${fmt(t.length)} / ${fmt(CAP)}</span></div>`;
}
function notesField(id) {
  return `<div class="notes"><div class="row"><label for="${id}">Speaker notes</label></div><p class="help" id="${id}-help">Only you see these, in the presenter window. They go into the PowerPoint export.</p><textarea id="${id}" data-notes maxlength="${CAP}" aria-describedby="${id}-help notes-count" placeholder="What to say on this slide">${esc(S.deck[S.i].notes)}</textarea>${saveLine()}</div>`;
}
function ebar() {
  const last = S.undo[S.undo.length - 1];
  return `<div class="ebar" role="toolbar" aria-label="Slide editing"><button type="button" class="btn" data-act="sheet">${ic("pencil")}Edit slide</button><span class="sp"></span><button type="button" class="btn" data-act="undo" ${last ? "" : "disabled"} aria-label="${last ? `Undo: ${last.label}` : "Undo, nothing to undo"}">${ic("undo")}Undo${last ? `<span class="undo-l">· ${esc(last.label)}</span>` : ""}</button></div>`;
}
function callout() {
  if (S.v !== "C" || !S.blocked) return "";
  return `<div class="callout" role="alert">${ic("info")}<div><p>The audience window opened. Your browser blocked the presenter window. Allow pop-ups for this site, or open it here.</p><div class="acts"><button type="button" class="btn" data-act="toast" data-msg="Opens the presenter window">${ic("presenter")}Open presenter window</button><button type="button" class="ghost" data-act="unblock">Present without notes</button></div></div></div>`;
}
function editorHtml() {
  const p = phone();
  const notesBlock = p
    ? `<section class="preview" aria-labelledby="pv-h"><div class="row"><h2 id="pv-h">Speaker notes</h2><button type="button" class="ghost link" data-act="sheet">${ic("pencil")}Edit</button></div><p>${S.deck[S.i].notes ? esc(S.deck[S.i].notes) : "No notes for this slide."}</p></section>`
    : notesField("notes-under");
  return `<div class="page"><header class="head"><div><h1>Quarter review, Q3 2026</h1><p>${N()} slides · Figures as of 30 Sep 2026</p></div><div class="act">${presentCtl()}<button class="btn wide" data-act="toast" data-msg="Downloads the .pptx with the notes">${ic("down")}Export to PowerPoint</button><button class="btn icon" aria-label="More actions" data-act="toast" data-msg="Rename, duplicate, delete">${ic("more")}</button>${menuHtml()}</div></header>${callout()}<div class="body">${railHtml()}<div class="mainc">${ebar()}<div class="stage">${slideHtml(S.i, "Shown slide")}</div>${notesBlock}</div></div></div>`;
}
function sheetHtml() {
  if (!S.sheet) return "";
  const s = S.deck[S.i];
  const title = `<div class="fld"><label for="f-title">Title</label><input id="f-title" value="${esc(s.els[0].t)}"></div>`;
  const body = s.els[1] && s.els[1].k === "text" ? `<div class="fld"><label for="f-text">Text</label><textarea id="f-text">${esc(s.els[1].t)}</textarea></div>` : "";
  const notes = notesField("notes-sheet");
  let inner;
  if (S.v === "A") inner = title + notes + body;
  else if (S.v === "B") inner = `<div class="tabs" role="tablist" aria-label="Slide fields"><button type="button" role="tab" id="tab-content" aria-selected="${S.tab === "content"}" aria-controls="tp" data-act="tab" data-val="content">Content</button><button type="button" role="tab" id="tab-notes" aria-selected="${S.tab === "notes"}" aria-controls="tp" data-act="tab" data-val="notes">Notes${s.notes ? "" : " (empty)"}</button></div><div role="tabpanel" id="tp" aria-labelledby="tab-${S.tab}" class="fld" style="gap:16px">${S.tab === "notes" ? notes : title + body}</div>`;
  else inner = title + body + notes;
  return `<div class="scrim" data-act="closesheet"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-h"><div class="top"><div class="grab" aria-hidden="true"></div><h2 id="sh-h">Edit slide ${S.i + 1}</h2><button type="button" class="ghost" data-act="closesheet" aria-label="Close">${ic("x")}</button></div><div class="in">${inner}</div><div class="sfoot"><button type="button" class="btn pri" data-act="closesheet">Done</button></div></section>`;
}

/* ---------- notes save: one step per pause, one Undo entry each ---------- */
let saveT = null, savedText = null;
function onNotes(t) {
  if (savedText === null) savedText = S.deck[S.i].notes;
  S.deck[S.i].notes = t.value.slice(0, CAP);
  S.save = "saving";
  updateMeta();
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    if (S.deck[S.i].notes !== savedText) S.undo.push({ label:`Changed notes on slide ${S.i + 1}`, i:S.i, before:savedText });
    savedText = null; S.save = "saved"; render();
  }, 800);
}
function updateMeta() {
  document.querySelectorAll(".notes .meta").forEach(m => { m.outerHTML = saveLine(); });
}
function undo() {
  const u = S.undo.pop(); if (!u) return;
  S.deck[u.i].notes = u.before; S.i = u.i; S.save = "saved"; toast(`Undid: ${u.label}`); render();
}

/* ---------- render ---------- */
const app = document.getElementById("app");
const isPv = () => ["presenter","last-slide","no-notes","long-notes"].includes(S.state);
function render() {
  const fk = keyOf(document.activeElement), sel = document.activeElement && document.activeElement.matches("textarea") ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  document.body.className = isPv() ? "pvmode" : "";
  app.innerHTML = isPv() ? presenterHtml() : S.state === "audience" ? audienceHtml() : editorHtml() + sheetHtml();
  if (fk) { const t = [...document.querySelectorAll("button,textarea,input")].find(n => keyOf(n) === fk); if (t) { t.focus({ preventScroll:true }); if (sel && t.setSelectionRange) t.setSelectionRange(...sel); } }
  document.querySelector("#sw .name").textContent = `${S.v}: ${VARIANTS[S.v]}`;
  document.querySelectorAll("#sw [data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S.v));
  history.replaceState(null, "", `?${new URLSearchParams({ variant:S.v, state:S.state })}`);
}
function keyOf(n) { if (!n || n === document.body || n.closest("#sw")) return null; return [n.id, n.dataset.act, n.dataset.val].join("|"); }

let tt;
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }

setInterval(() => {
  if (S.paused || !(isPv() || S.state === "audience")) return;
  S.elapsed++;
  document.querySelectorAll("#elapsed").forEach(o => { o.textContent = mmss(S.elapsed); });
}, 1000);

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act],[data-v]");
  if (t && t.closest("#sw")) { if (t.dataset.v) { S.v = t.dataset.v; applyState(S.state); } return; }
  if (!t) { if (S.menu && !ev.target.closest(".pop")) { S.menu = false; render(); } return; }
  const a = t.dataset.act;
  if (a === "toast") { S.menu = false; toast(t.dataset.msg); render(); }
  else if (a === "menu") { S.menu = !S.menu; render(); }
  else if (a === "present2") { S.blocked = true; toast("Opens the audience window and the presenter window"); render(); }
  else if (a === "unblock") { S.blocked = false; toast("Opens present mode"); render(); }
  else if (a === "prev") go(-1);
  else if (a === "next") go(1);
  else if (a === "exit") toast("Exit closes both windows and returns to the deck");
  else if (a === "pause") { S.paused = !S.paused; render(); }
  else if (a === "reset") { S.elapsed = 0; render(); }
  else if (a === "show") { S.i = Number(t.dataset.val); S.save = ""; render(); }
  else if (a === "sheet") { S.sheet = true; render(); const f = document.querySelector(".sheet textarea[data-notes]") || document.querySelector(".sheet input,.sheet button"); if (f) f.focus(); }
  else if (a === "closesheet") { S.sheet = false; render(); }
  else if (a === "tab") { S.tab = t.dataset.val; render(); }
  else if (a === "undo") undo();
});
document.addEventListener("input", ev => { if (ev.target.matches("[data-notes]")) onNotes(ev.target); });
document.addEventListener("change", ev => { if (ev.target.id === "stsel") applyState(ev.target.value); });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { if (S.menu) S.menu = false; else if (S.sheet) S.sheet = false; render(); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z" && !ev.target.matches("textarea,input")) { ev.preventDefault(); undo(); return; }
  if (!(isPv() || S.state === "audience") || ev.target.closest("#sw") || ev.target.matches("textarea,input,select")) return;
  if (ev.key === "ArrowRight" || ev.key === "PageDown" || (ev.key === " " && !ev.target.closest("button"))) { ev.preventDefault(); go(1); }
  else if (ev.key === "ArrowLeft" || ev.key === "PageUp") { ev.preventDefault(); go(-1); }
});
let wasPhone = phone();
addEventListener("resize", () => { if (phone() !== wasPhone) { wasPhone = phone(); render(); } });

/* ---------- named states for review and captures ---------- */
function applyState(name) {
  Object.assign(S, { state:name, deck:deck(), i:1, elapsed:754, paused:false, menu:false, sheet:false, tab:"notes", undo:[], save:"saved", blocked:false });
  clearTimeout(saveT); savedText = null;
  document.getElementById("toast").classList.remove("on");
  switch (name) {
    case "last-slide": S.i = 4; S.elapsed = 562; break;
    case "no-notes": S.i = 2; S.elapsed = 318; break;
    case "long-notes": S.deck[1].notes = LONG; break;
    case "audience": break;
    case "open-present": if (S.v === "C") S.blocked = true; else S.menu = true; break;
    case "editor-notes": S.undo.push({ label:"Changed notes on slide 2", i:1, before:"Cash collected rose 12 percent." }); break;
    case "editor-notes-phone": S.sheet = true; S.tab = "notes"; break;
    case "notes-cap": S.deck[1].notes = LONG; S.save = ""; if (phone()) S.sheet = true; break;
  }
  document.getElementById("stsel").value = name;
  render();
}
document.getElementById("stsel").innerHTML = STATES.map(s => `<option value="${s}">${s}</option>`).join("");
applyState(S.state);
</script>
</body>
</html>
