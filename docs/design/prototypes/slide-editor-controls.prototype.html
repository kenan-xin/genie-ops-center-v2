<!DOCTYPE html>
<!-- PROTOTYPE, throwaway. Slide editor position and style controls, S7-43 (czjw.103), wave 5 W3a.
     Switch with ?variant=A|B|C and &state=idle|selected-text|selected-visual|moving|resizing|nudge|add-element|background|refused|undo.
     The switcher at the bottom (top on a phone) changes both. Arrow keys nudge the selected element, so they do not cycle variants here.
     Question (gate G2, picked in Phase 12): where do the style controls live, and how does a person move and style an element on a 390 px phone?
     A: floating toolbar on the selection. Phone: the toolbar docks to the bottom, four corner handles with 44 px touch areas, drag moves and resizes.
     B: side inspector "Format" (288 px) with x, y, w, h fields and the style groups, shown only with a selection. Phone: a bottom sheet at half height
        with the fields and a nudge pad; no drag on a phone.
     C: one chip on the selection ("Text · Style") opens a popover with the style groups; drag on desktop. Phone: the chip opens a Style sheet
        with a nudge pad and w and h steppers; view and select only on the canvas.
     Common: 960 x 540 canvas, snap to 8, arrow keys nudge 8 (Shift nudges 1), font sizes 12 14 18 24 32 40 56, borders 0 1 2 4 with no radius,
     minimum boxes 80 x 32 (text) and 160 x 96 (visual), text kinds get color, size, weight, alignment, fill, border; visual kinds get fill and
     border; chart colors stay in the theme. Contrast 4.5:1 (3:1 for large text) against the fill, else the background; a refused change saves
     nothing and names the element. One gesture is one Undo entry. Text content still opens in the Edit slide sheet.
     World: DESIGN.md fixed layer (tokens, 8px controls, 12px cards, hairlines). Lucide icons (ISC). In-memory state, no network.
     Data: fictional sample deck, no real person and no customer name. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE: Slide editor controls</title>
<style>
  :root{
    --background:#fff;--foreground:#111827;--muted:#f9fafb;--muted-foreground:#4b5563;--tile:#f3f4f6;
    --border:#e5e7eb;--control:#d1d5db;--input:#6b7280;--primary:#2563eb;--ring:var(--primary);
    --body-2:#374151;--quiet:#6b7280;--danger:#b91c1c;--danger-bg:#fef2f2;--sel-bg:#eff6ff;
    --font-sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --text-xs:max(12px,.8rem);--text-sm:.875rem;--ease:cubic-bezier(.16,1,.3,1);
    --shadow-pop:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);
  }
  html{font-size:15px;scrollbar-color:#d1d5db transparent}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);font-size:1rem;line-height:1.5;color:var(--foreground);background:#fff;-webkit-font-smoothing:antialiased;padding-bottom:96px}
  ::selection{background:#dbeafe;color:#1e3a8a}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
  input{caret-color:var(--primary)}
  h1,h2,p{margin:0}
  .num{font-variant-numeric:tabular-nums}
  .ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  .page{max-width:1280px;margin:0 auto;padding:24px 32px}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
  .head h1{font-size:1.5rem;font-weight:700;letter-spacing:-.025em;line-height:1.25}
  .head p{margin-top:2px;font-size:var(--text-sm);color:var(--muted-foreground)}
  .head .act{display:flex;align-items:center;gap:8px}

  .btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--control);border-radius:8px;background:#fff;color:#1f2937;font:inherit;font-size:var(--text-sm);font-weight:600;white-space:nowrap;cursor:pointer;transition:background-color .15s var(--ease)}
  .btn:hover{background:var(--muted)}
  .btn.pri{border-color:var(--primary);background:var(--primary);color:#fff}.btn.pri:hover{opacity:.94;background:var(--primary)}
  .btn.sm{height:32px;padding:0 10px}
  .btn.icon{width:40px;padding:0;justify-content:center}
  .btn[aria-expanded=true]{background:var(--sel-bg);border-color:#93c5fd}
  .btn:disabled{color:#6b7280;background:var(--muted);cursor:not-allowed}
  .ghost{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px;border:0;background:none;border-radius:8px;color:var(--body-2);font:inherit;font-size:var(--text-sm);font-weight:500;cursor:pointer}
  .ghost:hover{background:var(--muted)}
  .ghost.link{color:var(--primary);font-weight:600}

  /* layout */
  .body{display:flex;gap:16px;align-items:flex-start}
  .rail{display:flex;flex-direction:column;gap:12px;width:160px;flex:none;margin:0;padding:0;list-style:none}
  .thumb{display:flex;gap:6px;align-items:flex-start;width:100%;padding:0;border:0;background:none;font:inherit;cursor:pointer;color:var(--muted-foreground);font-size:var(--text-xs)}
  .thumb .n{width:14px;text-align:right;padding-top:2px}
  .thumb .mini{flex:1;position:relative;aspect-ratio:16/9;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff}
  .thumb[aria-current=true] .mini{outline:2px solid var(--primary);outline-offset:1px}
  .thumb[aria-current=true] .n{color:var(--foreground);font-weight:700}
  .mainc{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
  .work{display:flex;gap:16px;align-items:flex-start}
  .stagecol{flex:1;min-width:0}

  .ebar{display:flex;align-items:center;gap:8px}
  .ebar .sp{flex:1}
  .ebar .undo-l{color:var(--muted-foreground);font-weight:500}
  .swatch-dot{width:16px;height:16px;border-radius:4px;border:1px solid rgb(17 24 39 / .2);flex:none}

  .alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid #fecaca;border-radius:8px;background:var(--danger-bg);color:#7f1d1d;font-size:var(--text-sm)}
  .alert .ic{color:var(--danger);margin-top:2px}
  .alert b{font-weight:700}
  .alert .x{margin-left:auto}

  .hint{font-size:var(--text-xs);color:var(--muted-foreground);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--control);border-bottom-width:2px;border-radius:4px;background:#fff;font:inherit;font-size:11px;font-weight:600;color:var(--body-2)}

  /* stage */
  .stage{position:relative;border:1px solid var(--border);border-radius:12px;background:var(--tile);padding:0}
  .clip{position:relative;overflow:hidden;border-radius:11px}
  .canvas{position:absolute;top:0;left:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;font-family:var(--font-sans);color:var(--foreground)}
  .box{position:absolute;overflow:hidden}
  .box.padded{padding:12px}
  .box p{margin:0;line-height:1.3;overflow-wrap:anywhere}
  .box ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;height:100%;justify-content:center}
  .box li{display:flex;gap:8px}
  .rule{position:absolute}
  .foot{position:absolute;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#4b5563}
  .chart svg{width:100%;height:100%;display:block}
  .fig{display:flex;flex-direction:column;justify-content:center;height:100%}
  .fig b{font-size:30px;line-height:1.1}
  .fig span{font-size:15px;color:#4b5563}
  .tbl{width:100%;border-collapse:collapse;font-size:15px}
  .tbl td,.tbl th{padding:6px 8px;border-bottom:1px solid #e5e7eb;text-align:left}
  .tbl th{font-size:12px;color:#4b5563}

  .overlay{position:absolute;inset:0;pointer-events:none}
  .overlay > *{pointer-events:auto}
  .hit{position:absolute;padding:0;border:0;background:none;cursor:pointer;border-radius:2px}
  .hit:hover{outline:1px dashed #60a5fa;outline-offset:0}
  .hit:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
  .hit[aria-pressed=true]{cursor:move}
  .nodrag .hit[aria-pressed=true]{cursor:pointer}
  .frame{position:absolute;outline:2px solid var(--primary);pointer-events:none}
  .ghostbox{position:absolute;outline:1px dashed #6b7280;pointer-events:none;background:rgb(37 99 235 / .04)}
  .h{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;background:#fff;border:1.5px solid var(--primary);border-radius:2px;pointer-events:auto;touch-action:none}
  .h::before{content:"";position:absolute;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%)}
  .h.nw,.h.se{cursor:nwse-resize}.h.ne,.h.sw{cursor:nesw-resize}.h.n,.h.s{cursor:ns-resize}.h.e,.h.w{cursor:ew-resize}
  .readout{position:absolute;transform:translateY(calc(-100% - 8px));display:inline-flex;gap:8px;align-items:center;height:24px;padding:0 8px;border-radius:6px;background:#111827;color:#f9fafb;font-size:var(--text-xs);font-weight:600;white-space:nowrap;pointer-events:none}
  .readout em{font-style:normal;color:#fcd34d}
  .gridlines{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgb(37 99 235 / .10) 1px,transparent 1px),linear-gradient(90deg,rgb(37 99 235 / .10) 1px,transparent 1px)}

  /* A: floating toolbar */
  .tb{position:absolute;display:flex;align-items:center;gap:2px;padding:4px;border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:var(--shadow-pop);white-space:nowrap;z-index:5}
  .tb .sep{width:1px;height:24px;background:var(--border);margin:0 4px}
  .tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:32px;height:32px;padding:0 8px;border:0;border-radius:6px;background:none;color:var(--body-2);font:inherit;font-size:var(--text-sm);font-weight:600;cursor:pointer}
  .tbtn:hover{background:var(--muted)}
  .tbtn[aria-pressed=true],.tbtn[aria-expanded=true]{background:var(--sel-bg);color:#1e3a8a}
  .tb select{height:32px;border:1px solid var(--control);border-radius:6px;padding:0 6px;font:inherit;font-size:var(--text-sm);background:#fff;color:var(--foreground)}
  .letter{font-weight:800;font-size:15px;line-height:1;border-bottom:3px solid;padding-bottom:1px}

  /* popovers and sheets */
  .pop{position:absolute;z-index:20;min-width:240px;max-width:320px;padding:14px;border:1px solid var(--border);border-radius:8px;background:#fff;box-shadow:var(--shadow-pop);display:grid;gap:12px}
  .pop h2,.sheet h2,.insp h2{font-size:var(--text-sm);font-weight:700}
  .grp{display:grid;gap:8px}
  .grp > .lab{font-size:var(--text-xs);font-weight:600;color:var(--muted-foreground);display:flex;justify-content:space-between}
  .sw{display:flex;flex-wrap:wrap;gap:6px}
  .sw button{position:relative;width:28px;height:28px;border-radius:6px;border:1px solid rgb(17 24 39 / .2);cursor:pointer;padding:0}
  .sw button[aria-pressed=true]::after{content:"";position:absolute;inset:-4px;border:2px solid var(--primary);border-radius:8px}
  .sw .none{background:linear-gradient(135deg,#fff 45%,#dc2626 45% 55%,#fff 55%)}
  .hex{display:flex;gap:6px;align-items:center}
  .hex input,.field input,select.fs{height:32px;width:100%;min-width:0;border:1px solid var(--input);border-radius:8px;padding:0 8px;font:inherit;font-size:var(--text-sm);color:var(--foreground);background:#fff}
  .hex input{width:110px;text-transform:uppercase}
  .err{font-size:var(--text-xs);color:var(--danger)}
  .seg{display:inline-flex;gap:2px;padding:3px;border-radius:8px;background:var(--tile)}
  .seg button{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:32px;height:28px;padding:0 8px;border:0;border-radius:6px;background:none;font:inherit;font-size:var(--text-sm);font-weight:500;color:var(--muted-foreground);cursor:pointer}
  .seg button[aria-pressed=true]{background:#fff;color:var(--foreground);font-weight:700;box-shadow:0 0 0 1px var(--border),0 1px 2px rgb(17 24 39 / .06)}
  .note{font-size:var(--text-xs);color:var(--muted-foreground)}
  .pos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .field{display:grid;gap:4px;font-size:var(--text-xs);font-weight:600;color:var(--muted-foreground)}
  .pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px;justify-content:start}
  .pad button{border:1px solid var(--control);border-radius:8px;background:#fff;color:var(--body-2);display:grid;place-items:center;cursor:pointer}
  .pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
  .pad .mid{grid-column:2;grid-row:2;display:grid;place-items:center;font-size:var(--text-xs);color:var(--muted-foreground)}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:44px;height:44px;border:1px solid var(--control);border-radius:8px;background:#fff;font:inherit;font-size:1.1rem;cursor:pointer;color:var(--body-2)}
  .step output{min-width:48px;text-align:center;font-weight:700}
  .menu{display:grid;gap:2px;margin:0;padding:0;list-style:none}
  .mi{display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px;border:0;border-radius:6px;background:none;font:inherit;text-align:left;cursor:pointer;color:var(--foreground);font-size:var(--text-sm)}
  .mi:hover:not(:disabled){background:var(--muted)}
  .mi .ic{margin-top:2px}
  .mi small{display:block;font-size:var(--text-xs);color:var(--muted-foreground)}
  .mi:disabled{cursor:not-allowed;color:#4b5563}
  .mi:disabled .ic{opacity:.5}
  .kindrow{display:flex;align-items:center;justify-content:space-between;gap:8px}

  /* C chip */
  .chip{position:absolute;transform:translateY(calc(-100% - 6px));display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;border:0;border-radius:8px;background:var(--primary);color:#fff;font:inherit;font-size:var(--text-sm);font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-pop)}
  .chip.below{transform:translateY(6px)}
  .chip .k{font-weight:500}

  /* B inspector */
  .insp{width:288px;flex:none;border:1px solid var(--border);border-radius:12px;background:#fff;display:grid;gap:16px;padding:16px;align-content:start}
  .insp .top{display:flex;justify-content:space-between;align-items:center}
  .insp hr,.sheet hr{border:0;border-top:1px solid var(--border);margin:0}

  .toast{position:fixed;z-index:80;top:16px;left:50%;transform:translate(-50%,-8px);display:flex;gap:10px;align-items:center;padding:6px 6px 6px 14px;border-radius:999px;background:#111827;color:#f9fafb;font-size:var(--text-sm);opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease)}
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{height:28px;padding:0 10px;border:0;border-radius:999px;background:#374151;color:#fff;font:inherit;font-size:var(--text-xs);font-weight:700;cursor:pointer}
  .toast:not(:has(button)){padding-right:14px}

  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:38vh;overflow:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border);border-radius:16px 16px 0 0;background:#fff;box-shadow:0 -10px 24px -8px rgb(0 0 0 / .18);display:grid;gap:14px}
  .sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--control);margin:0 auto}
  .sheet .top{display:flex;justify-content:space-between;align-items:center}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:#fff;box-shadow:0 -6px 16px -8px rgb(0 0 0 / .15)}
  .dock .tbtn{min-width:44px;height:44px;flex:none}
  .dock select{height:44px}
  .dock .brk{flex-basis:100%;height:0}
  .posrow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}

  /* phone (adapt) */
  @media (max-width:767px){
    body{padding-bottom:260px}
    .page{padding:56px 16px 16px}
    .head{margin-bottom:12px}
    .head h1{font-size:1.25rem}
    .head .wide{display:none}
    .body{flex-direction:column;gap:12px;align-items:stretch}
    .rail{flex-direction:row;width:100%;overflow-x:auto;padding:2px 2px 6px}
    .thumb{width:112px;flex:none}
    .ebar{flex-wrap:wrap;gap:6px}
    .ebar .sp{display:none}
    .ebar .btn{height:44px;padding:0 12px}
    .ebar .undo-l{display:none}
    .work{flex-direction:column;align-items:stretch}
    .h{width:12px;height:12px;margin:-6px 0 0 -6px}
    .h::before{width:44px;height:44px}
    .h.n,.h.s,.h.e,.h.w{display:none}
    .pop.asSheet{position:fixed;left:0;right:0;bottom:0;top:auto!important;max-width:none;border-radius:16px 16px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom));z-index:45}
    .sw button{width:36px;height:36px}
    .seg button{min-width:44px;height:36px}
    .hex input,.field input,select.fs{height:44px;font-size:16px}
    .mi{min-height:44px}
  }

  /* Review switcher, not part of the design */
  #sw{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:6px;padding:5px;border-radius:999px;background:#0b0f19;color:#f9fafb;font-size:var(--text-xs);box-shadow:0 0 0 1px #374151,0 12px 32px -8px rgb(0 0 0 / .5);white-space:nowrap}
  #sw button{height:30px;padding:0 10px;border:0;border-radius:999px;background:none;color:#d1d5db;font:inherit;font-size:var(--text-xs);font-weight:600;cursor:pointer}
  #sw button:hover{background:#1f2937;color:#fff}
  #sw button[aria-pressed=true]{background:#f9fafb;color:#0b0f19}
  #sw select{height:30px;border:0;border-radius:999px;background:#1f2937;color:#f9fafb;font:inherit;font-size:var(--text-xs);padding:0 8px}
  #sw .name{min-width:15rem;text-align:center;font-weight:500;color:#e5e7eb}
  #sw .tag{padding:0 4px 0 10px;color:#9ca3af;letter-spacing:.06em;font-weight:700;font-size:10px}
  @media (max-width:767px){#sw{top:8px;bottom:auto;max-width:calc(100% - 16px);overflow-x:auto}#sw .name,#sw .tag{display:none}}
</style>
</head>
<body>
<main class="page" id="app"></main>
<aside id="layer" aria-label="Editing panels"></aside>
<div class="toast" id="toast" role="status"></div>
<nav id="sw" aria-label="Prototype switcher">
  <span class="tag">PROTOTYPE</span>
  <button type="button" data-v="A">A</button><button type="button" data-v="B">B</button><button type="button" data-v="C">C</button>
  <span class="name" aria-live="polite"></span>
  <label class="sr" for="stsel">State</label>
  <select id="stsel"></select>
</nav>
<script>
const ICONS = {
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"/>',
  play:'<polygon points="6 3 20 12 6 21 6 3"/>',
  down:'<path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>',
  more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  chev:'<path d="m6 9 6 6 6-6"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  alert:'<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  left:'<path d="M21 6H3"/><path d="M15 12H3"/><path d="M17 18H3"/>',
  center:'<path d="M21 6H3"/><path d="M17 12H7"/><path d="M19 18H5"/>',
  right:'<path d="M21 6H3"/><path d="M21 12H9"/><path d="M21 18H7"/>',
  bucket:'<path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/>',
  square:'<rect width="18" height="18" x="3" y="3"/>',
  pencil:'<path d="M21.2 6.8a1 1 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.8l-1.3 4.4a.5.5 0 0 0 .6.6l4.4-1.3a2 2 0 0 0 .8-.5Z"/>',
  type:'<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/>',
  list:'<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
  hash:'<line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/>',

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- model ---------- */
const W = 960, H = 540, SNAP = 8;
const SIZES = [12, 14, 18, 24, 32, 40, 56];
const BORDERS = [0, 1, 2, 4];
const WEIGHTS = [[400, "Regular"], [600, "Semibold"], [700, "Bold"]];
const SWATCHES = [["#111827","Ink"],["#4B5563","Slate"],["#FFFFFF","White"],["#F3F4F6","Light gray"],["#2563EB","Brand blue"],["#1E3A8A","Dark blue"],["#EFF6FF","Pale blue"],["#047857","Green"],["#92400E","Amber"]];
const TEXT_KINDS = new Set(["title", "text", "bullets"]);
const MIN = k => TEXT_KINDS.has(k) ? { w: 80, h: 32 } : { w: 160, h: 96 };
const KIND_NAME = { title:"Title", text:"Text", bullets:"Bullets", figure:"Figure", chart:"Chart", table:"Table", image:"Image" };

const LIMITS = { body:"A slide holds at most one text or bullet list.", visual:"A slide holds at most two figures, charts, tables or images.", count:"A slide holds at most 5 elements." };

const baseSlide = () => ({
  background: null,

    { id:"text", kind:"text", text:"Cash collected rose 12 percent on the second quarter. Three invoices are more than 60 days overdue.", box:{ x:40, y:136, w:320, h:348 }, style:{} },
    { id:"chart", kind:"chart", data:[["Jul",182],["Aug",205],["Sep",231]], caption:"Cash collected, SGD thousands", box:{ x:384, y:136, w:536, h:348 }, style:{} },
  ],
});
const OTHER = [
  { n:1, background:"#1E3A8A", elements:[{ kind:"title", text:"Quarter review", box:{ x:40, y:200, w:880, h:88 }, style:{ color:"#FFFFFF", size:56 } }] },
  null,
  { n:3, elements:[{ kind:"title", text:"Overdue by customer", box:{ x:40, y:32, w:880, h:88 }, style:{} }, { kind:"table", rows:[["Customer","Overdue"],["Sample Trading","SGD 18,400"],["Example Supplies","SGD 9,150"]], box:{ x:40, y:136, w:880, h:348 }, style:{} }] },
  { n:4, elements:[{ kind:"title", text:"Next steps", box:{ x:40, y:32, w:880, h:88 }, style:{} }, { kind:"bullets", items:["Call the three overdue customers","Send statements on 5 Oct","Review terms for new accounts"], box:{ x:40, y:136, w:880, h:348 }, style:{} }] },
];

const VARIANTS = { A:"Floating toolbar on the selection", B:"Side inspector, sheet on a phone", C:"One Style chip, popover" };
const STATES = ["idle","selected-text","selected-visual","moving","resizing","nudge","add-element","background","refused","undo"];
const P = new URLSearchParams(location.search);
const S = {
  v: VARIANTS[P.get("variant")] ? P.get("variant") : "A",
  state: STATES.includes(P.get("state")) ? P.get("state") : "idle",
  slide: baseSlide(), sel: null, pop: null, drag: null, refusal: null, undo: [], hexErr: null, hint: false, sticky: null,
};
const phone = () => matchMedia("(max-width: 767px)").matches;
const el = id => S.slide.elements.find(e => e.id === id);
const clone = o => JSON.parse(JSON.stringify(o));

/* contrast (WCAG 2) */
function lum(hex) {
  const v = hex.replace("#", "").match(/../g).map(h => { const c = parseInt(h, 16) / 255; return c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; });
  return .2126 * v[0] + .7152 * v[1] + .0722 * v[2];
}
const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); };
const swName = hex => (SWATCHES.find(([h]) => h === hex.toUpperCase()) || [0, null])[1];
const colorWords = hex => { const n = swName(hex); return n ? `${n.toLowerCase()} ${hex.toUpperCase()}` : hex.toUpperCase(); };
const eff = (e, slide = S.slide) => ({
  color: e.style.color || THEME.fg,
  size: e.style.size || THEME.sizes[e.kind] || 18,
  weight: e.style.weight || THEME.weights[e.kind] || 400,
  align: e.style.align || "left",
  fill: e.style.fill || null,
  border: e.style.border || 0,
  borderColor: e.style.borderColor || "#111827",
  against: e.style.fill || slide.background || THEME.bg,
  againstName: e.style.fill ? "its fill" : slide.background ? "the slide background" : "the theme background",
});
function elName(e) {
  const t = e.text || (e.items && e.items[0]) || "";
  const short = t.length > 32 ? t.slice(0, t.lastIndexOf(" ", 32)) + "…" : t;
  return t ? `${KIND_NAME[e.kind]} "${short}"` : KIND_NAME[e.kind];
}
function contrastFail(e, slide) {
  if (!TEXT_KINDS.has(e.kind)) return null;
  const f = eff(e, slide);
  const large = f.size >= 24 || (f.size >= 18.66 && f.weight >= 700);
  const need = large ? 3 : 4.5, r = ratio(f.color, f.against);
  return r >= need ? null : `${elName(e)}: ${colorWords(f.color)} on ${f.againstName} (${colorWords(f.against)}) is ${r.toFixed(1)}:1, and this text needs ${need}:1. Pick a darker color${e.style.fill ? "" : " or give the text a fill"}.`;
}

/* ---------- slide renderer (also the rail thumbnails) ---------- */
function chartSvg(e) {
  const max = 250, bw = 90;
  const bars = e.data.map(([m, v], i) => { const h = v / max * 200, x = 70 + i * 140; return `<rect x="${x}" y="${230 - h}" width="${bw}" height="${h}" fill="${THEME.primary}"/><text x="${x + bw / 2}" y="254" text-anchor="middle" font-size="15" fill="#4b5563">${m}</text><text x="${x + bw / 2}" y="${222 - h}" text-anchor="middle" font-size="15" fill="#111827" font-weight="600">${v}</text>`; }).join("");
  return `<svg viewBox="0 0 500 290" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(e.caption)}: ${e.data.map(d => d.join(" ")).join(", ")}"><text x="0" y="18" font-size="15" font-weight="600" fill="#111827">${esc(e.caption)}</text><line x1="50" x2="500" y1="230" y2="230" stroke="#d1d5db"/>${bars}</svg>`;
}
function elBody(e) {
  const f = eff(e);
  const txt = `color:${f.color};font-size:${f.size}px;font-weight:${f.weight};text-align:${f.align}`;
  switch (e.kind) {
    case "title": case "text": return `<p style="${txt}">${esc(e.text)}</p>`;
    case "bullets": return `<ul style="${txt}">${e.items.map(i => `<li><span aria-hidden="true">•</span><span>${esc(i)}</span></li>`).join("")}</ul>`;
    case "chart": return `<div class="chart" style="height:100%">${chartSvg(e)}</div>`;
    case "figure": return `<div class="fig"><b>SGD 618,000</b><span>Collected in the quarter</span></div>`;
    case "table": return `<table class="tbl">${e.rows.map((r, i) => `<tr>${r.map(c => i ? `<td>${esc(c)}</td>` : `<th>${esc(c)}</th>`).join("")}</tr>`).join("")}</table>`;
    default: return "";
  }
}
function slideHtml(slide, live) {
  const bg = slide.background || THEME.bg;
  const els = slide.elements.map(e => {
    const f = eff(e, slide), b = e.box;
    const deco = `${f.fill ? `background:${f.fill};` : ""}${f.border ? `border:${f.border}px solid ${f.borderColor};` : ""}`;
    return `<div class="box ${f.fill || f.border ? "padded" : ""}" ${live ? `data-box="${e.id}"` : ""} style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;${deco}">${elBody(e)}</div>`;
  }).join("");
  const hasTitleAtTop = slide.elements[0] && slide.elements[0].box.y < 100;
  const rule = hasTitleAtTop ? `<div class="rule" style="left:40px;top:120px;width:880px;height:4px;background:${THEME.primary}"></div>` : "";
  const onDark = bg !== THEME.bg && lum(bg) < .2;
  return `<div style="position:absolute;inset:0;background:${bg}"></div>${rule}${els}<div class="foot" style="left:40px;top:500px;width:880px;height:24px;${onDark ? "color:#e5e7eb" : ""}"><span>Figures as of 30 Sep 2026</span><span>Demo Company</span></div>`;
}

/* ---------- undo ---------- */
let lastNudge = 0;
function commit(label, before, merge) {
  if (merge && S.undo.length && S.undo[S.undo.length - 1].label === label && Date.now() - lastNudge < 800) { lastNudge = Date.now(); }
  else { S.undo.push({ label, before }); lastNudge = Date.now(); }
  S.refusal = null;
  toast(label, true);
}
function undo() {
  const u = S.undo.pop(); if (!u) return;
  S.slide = u.before; S.refusal = null;
  if (S.sel && !el(S.sel)) S.sel = null;
  toast(`Undid: ${u.label}`); render();
}

/* ---------- style changes ---------- */
const PROP_LABEL = { color:"text color", size:"font size", weight:"weight", align:"alignment", fill:"fill", border:"border", borderColor:"border color" };
function setStyle(prop, val) {
  const e = el(S.sel); if (!e) return;
  const next = clone(S.slide), ne = next.elements.find(x => x.id === e.id);
  if (val === null) delete ne.style[prop]; else ne.style[prop] = val;
  const fail = contrastFail(ne, next);
  if (fail) { S.refusal = fail; S.hexErr = null; render(); return; }
  const before = clone(S.slide); S.slide = next;
  commit(`Changed ${KIND_NAME[e.kind]} ${PROP_LABEL[prop]}`, before);
  render();
}
function resetStyle() {
  const e = el(S.sel); if (!e || !Object.keys(e.style).length) return;
  const next = clone(S.slide); next.elements.find(x => x.id === e.id).style = {};
  const fail = contrastFail(next.elements.find(x => x.id === e.id), next);
  if (fail) { S.refusal = fail; render(); return; }
  const before = clone(S.slide); S.slide = next; commit(`Reset ${KIND_NAME[e.kind]} style`, before); render();
}
function setBackground(val) {
  const next = clone(S.slide); next.background = val;
  const fails = next.elements.filter(e => !e.style.fill).map(e => contrastFail(e, next)).filter(Boolean);
  if (fails.length) { S.refusal = `The background did not change. ${fails.join(" ")}`; render(); return; }
  const before = clone(S.slide); S.slide = next; commit("Changed slide background", before); render();
}
function setBox(id, box, label, merge) {
  const before = clone(S.slide); el(id).box = box; commit(label, before, merge);
}
const clampBox = (e, b) => { const m = MIN(e.kind); const w = Math.max(m.w, Math.min(W, b.w)), h = Math.max(m.h, Math.min(H, b.h)); return { x: Math.max(0, Math.min(W - w, b.x)), y: Math.max(0, Math.min(H - h, b.y)), w, h }; };
function nudge(dx, dy, step) {
  const e = el(S.sel); if (!e) return;
  const nb = clampBox(e, { ...e.box, x: e.box.x + dx * step, y: e.box.y + dy * step });
  if (nb.x === e.box.x && nb.y === e.box.y) return;
  S.hint = true; setBox(e.id, nb, `Moved ${KIND_NAME[e.kind]}`, true); render();
}
function resizeStep(dim, d) {
  const e = el(S.sel); if (!e) return;
  const nb = clampBox(e, { ...e.box, [dim]: e.box[dim] + d * SNAP });
  if (nb[dim] === e.box[dim]) { toast(`${KIND_NAME[e.kind]} is at its ${d < 0 ? "minimum" : "largest"} ${dim === "w" ? "width" : "height"}`); return; }
  setBox(e.id, nb, `Resized ${KIND_NAME[e.kind]}`, true); render();
}
function setField(dim, raw) {
  const e = el(S.sel); if (!e) return;
  const n = Math.round(Number(raw));
  if (!Number.isFinite(n)) { render(); return; }
  const nb = clampBox(e, { ...e.box, [dim]: n });
  if (JSON.stringify(nb) === JSON.stringify(e.box)) { render(); return; }
  setBox(e.id, nb, dim === "x" || dim === "y" ? `Moved ${KIND_NAME[e.kind]}` : `Resized ${KIND_NAME[e.kind]}`); render();
}

/* ---------- add element ---------- */
function addBlocked(kind) {
  const els = S.slide.elements;
  if (els.length >= 5) return LIMITS.count;
  if ((kind === "text" || kind === "bullets") && els.some(e => e.kind === "text" || e.kind === "bullets")) return LIMITS.body;
  const visuals = els.filter(e => !TEXT_KINDS.has(e.kind)).length;
  if (!TEXT_KINDS.has(kind) && visuals >= 2) return LIMITS.visual;
  if (kind === "table" && els.some(e => e.kind === "table")) return "A slide holds at most one table.";
  return null;
}
function addElement(kind) {
  if (addBlocked(kind)) return;
  if (kind !== "figure") { S.pop = null; toast(kind === "image" ? "Opens the file picker" : `Opens the data picker for a ${kind}`); render(); return; }
  const before = clone(S.slide);
  S.slide.elements.push({ id:"fig" + Date.now(), kind:"figure", box:{ x:664, y:136, w:256, h:160 }, style:{} });
  S.sel = S.slide.elements[S.slide.elements.length - 1].id; S.pop = null;
  commit("Added Figure", before); render();
}

/* ---------- control groups ---------- */
const pressed = b => `aria-pressed="${!!b}"`;
function swatches(prop, cur, withNone) {
  const none = withNone ? `<button type="button" class="none" data-act="style" data-prop="${prop}" data-val="" aria-label="No ${PROP_LABEL[prop] || prop}" ${pressed(!cur)}></button>` : "";
  return `<div class="sw" role="group" aria-label="${PROP_LABEL[prop] || prop}">${none}${SWATCHES.map(([h, n]) => `<button type="button" style="background:${h}" data-act="style" data-prop="${prop}" data-val="${h}" aria-label="${n}" ${pressed(cur && cur.toUpperCase() === h)}></button>`).join("")}</div>`;
}
function hexInput(prop, cur) {
  const id = `hex-${prop}`;
  return `<div class="hex"><label class="note" for="${id}">Hex</label><input id="${id}" data-hex="${prop}" value="${esc(cur || "")}" placeholder="#1E3A8A" spellcheck="false" autocomplete="off"></div>${S.hexErr === prop ? `<p class="err" role="alert">Enter a 6-digit hex color, for example #1E3A8A.</p>` : ""}`;
}
function group(name, e) {
  const f = eff(e);
  switch (name) {
    case "color": return `<div class="grp"><span class="lab">Text color</span>${swatches("color", f.color)}${hexInput("color", e.style.color)}</div>`;
    case "size": return `<div class="grp"><label class="lab" for="size-${S.v}">Font size</label><select class="fs" id="size-${S.v}" data-sel="size">${SIZES.map(s => `<option value="${s}" ${s === f.size ? "selected" : ""}>${s}</option>`).join("")}</select></div>`;
    case "weight": return `<div class="grp"><span class="lab">Weight</span><div class="seg" role="group" aria-label="Weight">${WEIGHTS.map(([w, n]) => `<button type="button" data-act="style" data-prop="weight" data-val="${w}" ${pressed(f.weight === w)}>${n}</button>`).join("")}</div></div>`;
    case "align": return `<div class="grp"><span class="lab">Alignment</span><div class="seg" role="group" aria-label="Alignment">${["left","center","right"].map(a => `<button type="button" data-act="style" data-prop="align" data-val="${a}" aria-label="Align ${a}" ${pressed(f.align === a)}>${ic(a)}</button>`).join("")}</div></div>`;
    case "fill": return `<div class="grp"><span class="lab">Fill</span>${swatches("fill", f.fill, true)}${hexInput("fill", e.style.fill)}</div>`;
    case "border": return `<div class="grp"><span class="lab">Border <span class="num">${f.border} px</span></span><div class="seg" role="group" aria-label="Border width">${BORDERS.map(b => `<button type="button" class="num" data-act="style" data-prop="border" data-val="${b}" aria-label="Border ${b} pixels" ${pressed(f.border === b)}>${b}</button>`).join("")}</div>${f.border ? swatches("borderColor", f.borderColor) : ""}</div>`;
  }
}
const groupsFor = e => TEXT_KINDS.has(e.kind) ? ["color","size","weight","align","fill","border"] : ["fill","border"];
function visualNote(e) { return TEXT_KINDS.has(e.kind) ? "" : `<p class="note">${e.kind === "chart" ? "Chart colors follow the theme. " : ""}A ${e.kind} takes a fill and a border.</p>`; }
function fullControls(e) {
  return `${groupsFor(e).map(g => group(g, e)).join("")}${visualNote(e)}<div class="kindrow"><button type="button" class="ghost" data-act="reset">Use theme style</button><button type="button" class="ghost link" data-act="edittext">${ic("pencil")}${TEXT_KINDS.has(e.kind) ? "Edit text" : "Edit slide"}</button></div>`;
}
function posFields(e) {
  return `<div class="grp"><span class="lab">Position and size <span>snaps to 8 when you drag</span></span><div class="pos">${["x","y","w","h"].map(d => `<label class="field">${d.toUpperCase()}<input type="number" inputmode="numeric" step="8" class="num" data-field="${d}" value="${e.box[d]}"></label>`).join("")}</div></div>`;
}
function nudgePad() {
  return `<div class="grp"><span class="lab">Move <span>8 per tap</span></span><div class="pad" role="group" aria-label="Move the element"><button type="button" class="u" data-act="nudge" data-val="0,-1" aria-label="Move up">${ic("aup")}</button><button type="button" class="l" data-act="nudge" data-val="-1,0" aria-label="Move left">${ic("aleft")}</button><span class="mid" aria-hidden="true">${ic("move")}</span><button type="button" class="r" data-act="nudge" data-val="1,0" aria-label="Move right">${ic("aright")}</button><button type="button" class="d" data-act="nudge" data-val="0,1" aria-label="Move down">${ic("adown")}</button></div></div>`;
}
function steppers(e) {
  return `<div class="grp"><span class="lab">Size <span>8 per tap</span></span>${[["w","Width","Narrower","Wider"],["h","Height","Shorter","Taller"]].map(([d, n, less, more]) => `<div class="step"><span class="note" style="width:48px">${n}</span><button type="button" data-act="rs" data-val="${d},-1" aria-label="${less}">−</button><output class="num" aria-label="${n}">${e.box[d]}</output><button type="button" data-act="rs" data-val="${d},1" aria-label="${more}">+</button></div>`).join("")}</div>`;
}

/* A toolbar */
function toolbarA(e) {
  const f = eff(e);
  const t = (name, inner, label) => `<button type="button" class="tbtn" data-act="pop" data-val="${name}" aria-label="${label}" aria-expanded="${S.pop === name}">${inner}</button>`;
  const fillDot = `<span class="swatch-dot" style="background:${f.fill || "#fff"}"></span>`;
  const parts = TEXT_KINDS.has(e.kind) ? [
    t("color", `<span class="letter" style="border-color:${f.color}">A</span>`, "Text color"),
    `<label class="sr" for="tbsize">Font size</label><select id="tbsize" data-sel="size" class="num">${SIZES.map(s => `<option value="${s}" ${s === f.size ? "selected" : ""}>${s}</option>`).join("")}</select>`,
    `<button type="button" class="tbtn" data-act="style" data-prop="weight" data-val="${f.weight >= 700 ? 400 : 700}" aria-label="Bold" ${pressed(f.weight >= 700)}><b>B</b></button>`,
    t("weight", `${ic("chev")}`, "More weights"),

    ...["left","center","right"].map(a => `<button type="button" class="tbtn" data-act="style" data-prop="align" data-val="${a}" aria-label="Align ${a}" ${pressed(f.align === a)}>${ic(a)}</button>`),
    `<span class="sep brk"></span>`,
  ] : [];
  // Position: the single-pointer path for move and resize (WCAG 2.5.7), beside the drag.
  parts.push(t("fill", `${ic("bucket")}${fillDot}`, "Fill"), t("border", `${ic("square")}<span class="num">${f.border}</span>`, "Border"), t("pos", `${ic("move")}Position`, "Position and size"), `<span class="sep"></span>`, `<button type="button" class="tbtn" data-act="edittext">${ic("pencil")}${TEXT_KINDS.has(e.kind) ? "Edit text" : "Edit slide"}</button>`);
  return parts.join("");
}

/* ---------- page ---------- */
const app = document.getElementById("app"), layer = document.getElementById("layer");
let scale = 1;

  return `<div class="ebar" role="toolbar" aria-label="Slide editing">
    <button type="button" class="btn" data-act="pop" data-val="add" aria-expanded="${S.pop === "add"}" id="addbtn">${ic("plus")}Add element</button>
    <button type="button" class="btn" data-act="pop" data-val="bg" aria-expanded="${S.pop === "bg"}" id="bgbtn"><span class="swatch-dot" style="background:${bg}"></span>Background</button>
    <span class="sp"></span>
    <button type="button" class="btn" data-act="undo" ${last ? "" : "disabled"} aria-label="${last ? `Undo: ${last.label}` : "Undo, nothing to undo"}">${ic("undo")}Undo${last ? `<span class="undo-l">· ${esc(last.label)}</span>` : ""}</button>
  </div>`;
}
function alertHtml() {
  return S.refusal ? `<div class="alert" role="alert">${ic("alert")}<p><b>Not changed.</b> ${esc(S.refusal)}</p><button type="button" class="ghost x" data-act="dismiss" aria-label="Dismiss">${ic("x")}</button></div>` : "";
}
function hintHtml() {
  if (!S.sel) return `<p class="hint">${phone() ? "Tap an element to select it." : "Click an element to select it. Tab reaches each element too."}</p>`;
  if (!dragOK()) return `<p class="hint">${S.v === "B" ? "Move and size with the fields or the arrows in the sheet." : "Tap Style to move, size or style it."}</p>`;
  const or = S.v === "A" ? `, or ${phone() ? "tap" : "use"} Position` : "";
  return `<p class="hint">${phone() ? `Drag to move, drag a corner to resize${or}. Snaps to 8.` : `Drag to move. Drag a handle to resize${or}. <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> move 8, with <kbd>Shift</kbd> 1. <kbd>Esc</kbd> deselects.`}</p>`;
}

function render() {
  const focusKey = keyOf(document.activeElement);
  const showInsp = S.v === "B" && S.sel && !phone();
  app.className = `page v-${S.v} ${dragOK() ? "" : "nodrag"}`;
  app.innerHTML = `${head()}<div class="body">${rail()}<div class="mainc">${ebar()}${alertHtml()}<div class="work"><div class="stagecol"><div class="stage" id="stage"></div></div>${showInsp ? `<aside class="insp" aria-label="Format">${inspector()}</aside>` : ""}</div>${hintHtml()}</div></div>`;
  fillStage();
  fillLayer();
  document.querySelectorAll(".mcanvas").forEach(c => { c.style.transform = `scale(${c.parentElement.clientWidth / W})`; });
  if (focusKey) { const t = [...document.querySelectorAll("button,select,input")].find(n => keyOf(n) === focusKey); if (t) t.focus({ preventScroll: true }); }
  document.querySelector("#sw .name").textContent = `${S.v}: ${VARIANTS[S.v]}`;
  document.querySelectorAll("#sw [data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S.v));
  history.replaceState(null, "", `?${new URLSearchParams({ variant: S.v, state: S.state })}`);
}
function keyOf(n) { if (!n || n === document.body || n.closest("#sw")) return null; return [n.id, n.dataset.act, n.dataset.prop, n.dataset.val, n.dataset.id, n.dataset.field, n.dataset.hex, n.dataset.sel].join("|"); }

function inspector() {
  const e = el(S.sel);
  return `<div class="top"><h2>${KIND_NAME[e.kind]}</h2><button type="button" class="ghost" data-act="deselect" aria-label="Close Format">${ic("x")}</button></div>${posFields(e)}<hr>${fullControls(e)}`;
}

function fillStage() {
  const st = document.getElementById("stage");
  const w = st.clientWidth - 2; scale = w / W;
  const e = S.sel && el(S.sel);
  let ov = "";
  S.slide.elements.forEach(x => {
    const b = x.box;
    ov += `<button type="button" class="hit" data-id="${x.id}" aria-pressed="${S.sel === x.id}" aria-label="${esc(elName(x))}" style="left:${b.x * scale}px;top:${b.y * scale}px;width:${b.w * scale}px;height:${b.h * scale}px"></button>`;
  });
  if (S.drag) {
    const g = S.drag.start;
    ov += `<div class="gridlines" style="background-size:${40 * scale}px ${40 * scale}px"></div><div class="ghostbox" style="left:${g.x * scale}px;top:${g.y * scale}px;width:${g.w * scale}px;height:${g.h * scale}px"></div>`;
  }
  if (e) {
    const b = e.box, L = b.x * scale, T = b.y * scale, Wd = b.w * scale, Ht = b.h * scale;
    ov += `<div class="frame" style="left:${L}px;top:${T}px;width:${Wd}px;height:${Ht}px"></div>`;
    if (dragOK()) {
      const pts = { nw:[0,0], n:[.5,0], ne:[1,0], e:[1,.5], se:[1,1], s:[.5,1], sw:[0,1], w:[0,.5] };
      ov += Object.entries(pts).map(([k, [px, py]]) => `<span class="h ${k}" data-h="${k}" aria-hidden="true" style="left:${L + px * Wd}px;top:${T + py * Ht}px"></span>`).join("");
    }
    if (S.drag) {
      const m = MIN(e.kind), atMin = S.drag.type === "resize" && (b.w === m.w || b.h === m.h);
      ov += `<div class="readout num" style="left:${L}px;top:${T}px">${S.drag.type === "move" ? `x ${b.x}&nbsp; y ${b.y}` : `w ${b.w}&nbsp; h ${b.h}`}${atMin ? `<em>Minimum ${b.h === m.h ? "height" : "width"}</em>` : ""}</div>`;
    } else if (S.hint && !phone()) {
      ov += `<div class="readout num" style="left:${L}px;top:${T}px">x ${b.x}&nbsp; y ${b.y}</div>`;
    }
    if (S.v === "A" && !phone() && !S.drag) {
      const below = T < 56;
      ov += `<div class="tb" id="tb" role="toolbar" aria-label="${KIND_NAME[e.kind]} style" style="left:${Math.max(0, L)}px;top:${below ? T + Ht + 8 : T - 48}px">${toolbarA(e)}</div>`;
    }
    if (S.v === "C" && !S.drag) {
      const below = T < 40;
      ov += `<button type="button" class="chip ${below ? "below" : ""}" id="chip" data-act="pop" data-val="style" aria-expanded="${S.pop === "style"}" style="left:${L}px;top:${below ? T + Ht : T}px"><span class="k">${KIND_NAME[e.kind]} ·</span> Style ${ic("chev")}</button>`;
    }
  }
  st.innerHTML = `<div class="clip" style="height:${H * scale}px"><div class="canvas" role="group" aria-roledescription="slide" aria-label="Slide 2: Collections, third quarter" style="transform:scale(${scale})">${slideHtml(S.slide, true)}</div></div><div class="overlay">${ov}</div>`;
  // Keep the floating toolbar inside the stage when the selection sits near the right edge.
  const tb = document.getElementById("tb");
  if (tb && tb.offsetLeft + tb.offsetWidth > st.clientWidth) tb.style.left = `${Math.max(0, st.clientWidth - tb.offsetWidth)}px`;
}

function fillLayer() {
  const e = S.sel && el(S.sel);
  let out = "";
  const pop = (id, title, inner, anchor, sheet) => ({ id, title, inner, anchor, sheet });
  let p = null;
  if (S.pop === "add") {
    const kinds = [["text","type"],["bullets","list"],["figure","hash"],["chart","bar"],["table","table"],["image","image"]];
    p = pop("addpop", "Add element", `<ul class="menu">${kinds.map(([k, i]) => { const r = addBlocked(k); return `<li><button type="button" class="mi" data-act="add" data-val="${k}" ${r ? "disabled" : ""}>${ic(i)}<span>${KIND_NAME[k]}${r ? `<small>${r}</small>` : ""}</span></button></li>`; }).join("")}</ul>`, "addbtn");
  } else if (S.pop === "bg") {
    const bg = S.slide.background;
    p = pop("bgpop", "Slide background", `<div class="grp">${swatches("background", bg || "", true).replace(/data-act="style" data-prop="background"/g, 'data-act="bg"').replace('aria-label="No background"', 'aria-label="Theme background"')}${hexInput("background", bg)}<p class="note">Every text without a fill is checked against the new color.</p></div>`, "bgbtn");
  } else if (e && S.v === "A" && ["color","weight","fill","border"].includes(S.pop)) {
    p = pop("stylepop", { color:"Text color", weight:"Weight", fill:"Fill", border:"Border" }[S.pop], group(S.pop, e), `[data-act=pop][data-val=${S.pop}]`);
  } else if (e && S.v === "A" && S.pop === "pos") {
    p = pop("pospop", "Position and size", `<div class="posrow">${nudgePad()}${steppers(e)}</div>`, "[data-act=pop][data-val=pos]");
  } else if (e && S.v === "C" && S.pop === "style") {
    p = phone() ? pop("cpop", `${KIND_NAME[e.kind]} style`, `${nudgePad()}${steppers(e)}<hr>${fullControls(e)}`, "chip", true)
                : pop("cpop", `${KIND_NAME[e.kind]} style`, fullControls(e), "chip");
  }
  // B on a phone: the sheet is the inspector, shown with the selection
  if (e && S.v === "B" && phone() && !p) {
    out += `<section class="sheet" aria-label="Format ${KIND_NAME[e.kind]}"><div class="grab" aria-hidden="true"></div><div class="top"><h2>${KIND_NAME[e.kind]}</h2><button type="button" class="ghost" data-act="deselect" aria-label="Close Format">${ic("x")}</button></div>${posFields(e)}${nudgePad()}<hr>${fullControls(e)}</section>`;
  }
  // A on a phone: the toolbar docks to the bottom
  if (e && S.v === "A" && phone() && !S.drag) {
    out += `<div class="dock" role="toolbar" aria-label="${KIND_NAME[e.kind]} style">${toolbarA(e).replace(/<span class="sep"><\/span>/g, "")}</div>`;
  }
  if (p) {
    const sheet = phone();
    out += `<section class="pop ${sheet ? "asSheet" : ""}" id="${p.id}" role="dialog" aria-label="${p.title}" ${p.sheet ? 'style="max-height:38vh;overflow:auto"' : ""}><div class="kindrow"><h2>${p.title}</h2><button type="button" class="ghost" data-act="close" aria-label="Close">${ic("x")}</button></div>${p.inner}${S.refusal && sheet ? alertHtml() : ""}</section>`;
  }
  layer.innerHTML = out;
  if (p && !phone()) {
    const a = document.getElementById(p.anchor) || document.querySelector(p.anchor), box = document.getElementById(p.id);
    if (a) { const r = a.getBoundingClientRect(); box.style.position = "absolute"; box.style.top = `${r.bottom + scrollY + 6}px`; box.style.left = `${Math.min(r.left + scrollX, innerWidth - box.offsetWidth - 16)}px`; }
  }
}

/* ---------- toast ---------- */
let tt;
function toast(m, withUndo) {
  const t = document.getElementById("toast");
  t.innerHTML = `<span>${esc(m)}</span>${withUndo ? `<button type="button" data-act="undo">Undo</button>` : ""}`;
  t.classList.add("on"); clearTimeout(tt);
  if (S.sticky !== m) tt = setTimeout(() => t.classList.remove("on"), 2600);
}

/* ---------- drag ---------- */
let drag = null;
function startDrag(ev, id, handle) {
  const e = el(id);
  drag = { id, handle, sx: ev.clientX, sy: ev.clientY, start: { ...e.box }, moved: false };
  S.drag = null;
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp, { once: true });
  window.addEventListener("pointercancel", onUp, { once: true });
}
const snap = v => Math.round(v / SNAP) * SNAP;
function onMove(ev) {
  if (!drag) return;
  const dx = (ev.clientX - drag.sx) / scale, dy = (ev.clientY - drag.sy) / scale;
  if (!drag.moved && Math.hypot(dx, dy) * scale < 3) return;
  drag.moved = true; ev.preventDefault();
  const e = el(drag.id), s = drag.start, m = MIN(e.kind), hd = drag.handle;
  let b;
  if (!hd) b = clampBox(e, { ...s, x: snap(s.x + dx), y: snap(s.y + dy) });
  else {
    let l = s.x, t = s.y, r = s.x + s.w, bt = s.y + s.h;
    if (hd.includes("w")) l = Math.max(0, Math.min(r - m.w, snap(s.x + dx)));
    if (hd.includes("e")) r = Math.min(W, Math.max(l + m.w, snap(r + dx)));
    if (hd.includes("n")) t = Math.max(0, Math.min(bt - m.h, snap(s.y + dy)));
    if (hd.includes("s")) bt = Math.min(H, Math.max(t + m.h, snap(bt + dy)));
    b = { x: l, y: t, w: r - l, h: bt - t };
  }
  e.box = b;
  S.drag = { type: hd ? "resize" : "move", start: s };
  fillStage();
}
function onUp() {
  window.removeEventListener("pointermove", onMove);
  if (!drag) return;
  const e = el(drag.id), changed = JSON.stringify(e.box) !== JSON.stringify(drag.start);
  if (drag.moved && changed) {
    const nb = e.box; e.box = drag.start;
    const before = clone(S.slide); e.box = nb;
    S.undo.push({ label: `${drag.handle ? "Resized" : "Moved"} ${KIND_NAME[e.kind]}`, before }); S.refusal = null;
    toast(S.undo[S.undo.length - 1].label, true);
  }
  drag = null; S.drag = null; render();
}

/* ---------- events ---------- */
document.addEventListener("pointerdown", ev => {
  const h = ev.target.closest("[data-h]");
  if (h && S.sel) { ev.preventDefault(); startDrag(ev, S.sel, h.dataset.h); return; }
  const hit = ev.target.closest(".hit");
  if (hit && ev.button === 0) {
    if (S.sel !== hit.dataset.id) { S.sel = hit.dataset.id; S.pop = null; S.refusal = null; S.hint = false; render(); }
    if (dragOK()) startDrag(ev, hit.dataset.id, null);
  }
});
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act],[data-v]");
  if (t && t.closest("#sw")) { if (t.dataset.v) { S.v = t.dataset.v; S.pop = null; render(); } return; }
  if (!t) {
    if (ev.target.closest(".hit,.pop,.sheet,.dock,.insp,.ebar,#stage,#toast")) return;
    if (S.pop) { S.pop = null; render(); }
    return;
  }
  const a = t.dataset.act, v = t.dataset.val;
  if (a === "toast") toast(t.dataset.msg);
  else if (a === "pop") { S.pop = S.pop === v ? null : v; S.hexErr = null; render(); }
  else if (a === "close") { S.pop = null; render(); }
  else if (a === "style") setStyle(t.dataset.prop, v === "" ? null : t.dataset.prop === "weight" || t.dataset.prop === "border" ? Number(v) : v);
  else if (a === "bg") setBackground(v || null);
  else if (a === "reset") resetStyle();
  else if (a === "undo") undo();
  else if (a === "dismiss") { S.refusal = null; render(); }
  else if (a === "deselect") { S.sel = null; S.pop = null; render(); }
  else if (a === "add") addElement(v);
  else if (a === "edittext") toast("Opens the Edit slide sheet");
  else if (a === "nudge") { const [dx, dy] = v.split(",").map(Number); nudge(dx, dy, SNAP); }
  else if (a === "rs") { const [d, s] = v.split(","); resizeStep(d, Number(s)); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "stsel") { applyState(t.value); return; }
  if (t.dataset.sel === "size") setStyle("size", Number(t.value));
  else if (t.dataset.field) setField(t.dataset.field, t.value);
  else if (t.dataset.hex) {
    const raw = t.value.trim(), ok = /^#?[0-9a-f]{6}$/i.test(raw);
    if (!raw) return;
    if (!ok) { S.hexErr = t.dataset.hex; render(); return; }
    const hex = ("#" + raw.replace("#", "")).toUpperCase(); S.hexErr = null;
    if (t.dataset.hex === "background") setBackground(hex); else setStyle(t.dataset.hex, hex);
  }
});
document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z" && !ev.target.matches("input")) { ev.preventDefault(); undo(); return; }
  if (ev.key === "Escape") { if (S.pop) S.pop = null; else S.sel = null; S.hint = false; render(); return; }
  if (ev.target.matches("input,select,textarea") || ev.target.closest("#sw,.pop,.insp,.sheet,.dock")) return;
  const dir = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] }[ev.key];
  if (dir && S.sel) { ev.preventDefault(); nudge(dir[0], dir[1], ev.shiftKey ? 1 : SNAP); const h = document.querySelector(`.hit[data-id="${S.sel}"]`); if (h) h.focus({ preventScroll: true }); }
});
let wasPhone = phone();
new ResizeObserver(() => { if (phone() !== wasPhone) { wasPhone = phone(); render(); } else if (!drag) { fillStage(); fillLayer(); document.querySelectorAll(".mcanvas").forEach(c => { c.style.transform = `scale(${c.parentElement.clientWidth / W})`; }); } }).observe(document.body);

/* ---------- named states for review and captures ---------- */
function applyState(name) {
  S.state = name; S.slide = baseSlide(); S.sel = null; S.pop = null; S.drag = null; S.refusal = null; S.undo = []; S.hexErr = null; S.hint = false; S.sticky = null;
  document.getElementById("toast").classList.remove("on");
  const text = el("text"), chart = el("chart");
  switch (name) {
    case "selected-text": S.sel = "text"; break;
    case "selected-visual": S.sel = "chart"; break;
    case "moving": S.sel = "text"; S.drag = { type:"move", start:{ ...text.box } }; text.box = { ...text.box, x:96, y:160 }; break;
    case "resizing": S.sel = "chart"; S.drag = { type:"resize", start:{ ...chart.box } }; chart.box = { x:384, y:136, w:296, h:96 }; break;
    case "nudge": S.sel = "text"; S.undo.push({ label:"Moved Text", before: baseSlide() }); text.box = { ...text.box, x:48 }; S.hint = true; if (S.v === "A") S.pop = "pos"; break;
    case "add-element": S.pop = "add"; break;
    case "background": S.pop = "bg"; break;
    case "refused": S.sel = "text"; S.pop = S.v === "A" ? "color" : S.v === "C" ? "style" : null; S.refusal = contrastFail({ ...text, style:{ color:"#F3F4F6" } }, S.slide); break;
    case "undo": S.sel = "text"; S.undo.push({ label:"Moved Text", before: baseSlide() }); text.box = { ...text.box, x:40, y:184 }; S.sticky = "Moved Text"; break;
  }
  render();
  if (name === "undo") toast("Moved Text", true);
}
document.getElementById("stsel").innerHTML = STATES.map(s => `<option value="${s}" ${s === S.state ? "selected" : ""}>${s}</option>`).join("");
applyState(S.state);
</script>
</body>
</html>
