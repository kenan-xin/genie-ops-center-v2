<!DOCTYPE html>
<!-- PROTOTYPE, throwaway. Three variants of the invoice record page (INV-2026-09-03), switchable via ?variant=A|B|C, &width=desktop|phone, &state=default|no-pdf|paid|pdf-error.
     Question (owner, 2026-11-03): "when I open the PDF, the user should be able to see the PDF preview in the page itself without having to open it". Redesign the page and adapt it for phones.
     A: split view, record left, sticky document pane right. B: record first, a document card that expands inline to a full-width viewer. C: document desk, the page annotated with its fields, payments and history in a side drawer.
     Also: &nav=rail|open (main menu as the 60px icon rail; C defaults to it), &panel=open (agent panel docked right), &pdf=native|rendered (A and B viewers: the real PDF in an <object>, or the drawn page; C's desk always uses the drawn page,
     because pinned annotations need a text layer, as pdf.js would give the app), &chrome=0 hides the switcher bar.
     The drawn page stands in for the app's own PDF renderer: field highlights show on it. Where the browser cannot show a PDF in <object> (headless, Android), the drawn page is the <object>'s fallback.
     Keys: Left and Right cycle variants (not while typing), Escape closes a menu, editor, viewer or sheet.
     World: the Ask prototype (ask-chat.prototype.html, variant B) and the agent panel (chat-bubble.prototype.html, variant B): same tokens, flush shell, lucide icons (ISC), light theme.
     Data: the fictional demo pack, reporting date 27 Oct 2026; figures from the current page capture. In-memory state only, no network requests.
     Placeholders: [upload time] (when the invoice was created from the document is not in the capture); the paid state's third payment is an [example payment] with a [date]. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE: Invoice record, three variants</title>
<style>
  /* Token layer copied from the Ask prototype (tokens.md names). Only --primary is a tenant color. */
  :root{
    --background:#ffffff;--foreground:#111827;--card:#ffffff;--muted:#f9fafb;--muted-foreground:#4b5563;
    --border:#e5e7eb;--input:#6b7280;--primary:#2563eb;--primary-foreground:#ffffff;--ring:var(--primary);
    --tile:#f3f4f6;--body-2:#374151;--quiet:#6b7280;
    --ok:#047857;--ok-bg:#ecfdf5;--dang:#b91c1c;--dang-bg:#fef2f2;--warn:#92400e;--warn-bg:#fffbeb;
    --sel-bg:#eff6ff;--sel-line:#2563eb;--sel-fg:#1d4ed8;
    --hl:#fde68a;--hl-line:#d97706;
    --desk:#eceef2;
    --font-sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --text-xs:max(12px,.8rem);--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;--text-xl:1.25rem;--text-2xl:1.5rem;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  html{font-size:15px;scrollbar-color:#d1d5db transparent}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);font-size:var(--text-base);line-height:1.5;color:var(--foreground);background:#fff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:#dbeafe;color:#1e3a8a}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
  a{color:inherit;text-underline-offset:3px}
  h1,h2,h3,p,dl,dd,ol,ul{margin:0}
  ol,ul{padding:0;list-style:none}
  [hidden]{display:none!important}
  .num{font-variant-numeric:tabular-nums}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* Stage: the app fills the window on desktop; ?width=phone frames it at 390 x 844 on a wide window */
  #stage{height:100vh;display:grid;place-items:center}
  body.chrome #stage{height:calc(100vh - 60px);align-items:start}
  body.framed #stage{align-items:center}
  body.framed{background:#e5e7eb}
  #app{position:relative;overflow:hidden;width:100%;height:100%;display:flex;background:#fff;--navw:240px}
  #app.nav-rail{--navw:60px}
  #app.framed{width:390px;height:min(844px,calc(100% - 24px));border-radius:28px;box-shadow:0 0 0 1px #d1d5db,0 24px 48px -16px rgb(17 24 39 / .35)}

  /* Buttons (incumbent sizes) */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--input);border-radius:8px;background:#fff;color:#1f2937;font:inherit;font-size:var(--text-sm);font-weight:600;white-space:nowrap;cursor:pointer;text-decoration:none;transition:background-color .15s var(--ease)}
  .btn:hover{background:var(--muted)}
  .btn.pri{border-color:var(--primary);background:var(--primary);color:#fff} .btn.pri:hover{background:#1d4ed8}
  .btn.ghost{border-color:transparent;background:none;color:var(--body-2)} .btn.ghost:hover{background:var(--tile)}
  .btn.danger{border-color:var(--dang);background:var(--dang);color:#fff} .btn.danger:hover{background:#991b1b}
  .btn.sm{height:30px;padding:0 10px;font-size:var(--text-xs)}
  .btn .ic{width:15px;height:15px}
  .ib{position:relative;flex:none;width:36px;height:36px;display:grid;place-items:center;padding:0;border:0;border-radius:8px;background:none;color:var(--body-2);cursor:pointer;text-decoration:none;transition:background-color .15s var(--ease)}
  .ib:hover{background:var(--tile);color:var(--foreground)}
  .ib:disabled{color:#c4c9d1;background:none;cursor:default}
  .ib .ic{width:18px;height:18px}
  .ph .ib{width:44px;height:44px}
  .ph .btn{height:44px;padding:0 16px;font-size:var(--text-base)}
  .ph .btn.sm{height:36px;padding:0 12px;font-size:var(--text-sm)}

  /* Main menu: flush, full height, one border on its right. Collapses to a 60 px icon rail. */
  .mnav{flex:none;width:var(--navw);display:flex;flex-direction:column;min-height:0;padding:10px 10px 0;background:var(--muted);border-right:1px solid var(--border);transition:width .22s var(--ease)}
  .mn-h{display:flex;align-items:center;gap:10px;height:40px;padding-left:4px;margin-bottom:4px}
  .tile{flex:none;width:30px;height:30px;border-radius:8px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:700;font-size:var(--text-sm)}
  .mn-name{flex:1;font-weight:700;letter-spacing:-.01em}
  .mn-cap{margin:14px 10px 4px;font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--quiet);white-space:nowrap}
  .mn-list{display:flex;flex-direction:column;gap:2px}
  .mn-i{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--body-2);font:inherit;font-size:var(--text-sm);font-weight:500;text-decoration:none;text-align:left;cursor:pointer;white-space:nowrap}
  .mn-i:hover{background:var(--tile);color:var(--foreground)}
  .mn-i[aria-current=page]{background:#fff;box-shadow:inset 0 0 0 1px var(--border);color:var(--primary);font-weight:600}
  .mn-i .ic{width:18px;height:18px}
  .mn-sub{margin-left:19px;padding-left:8px;border-left:1px solid var(--border)}
  .mn-user{margin:auto -10px 0;display:flex;align-items:center;gap:10px;width:calc(100% + 20px);min-height:60px;padding:10px 14px;border:0;border-top:1px solid var(--border);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
  .mn-user .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
  .mn-user .who b{font-size:var(--text-sm);font-weight:600}
  .mn-user .who span{font-size:var(--text-xs);color:var(--muted-foreground)}
  .avatar{flex:none;width:32px;height:32px;border-radius:999px;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:var(--text-xs);font-weight:700}
  .nav-rail .mn-h{flex-direction:column;height:auto;gap:6px;padding:0;margin-bottom:6px}
  .nav-rail .mn-name,.nav-rail .mn-i>span,.nav-rail .mn-user .who{display:none}
  .nav-rail .mn-cap{height:1px;width:24px;margin:10px auto;padding:0;background:var(--border);font-size:0;overflow:hidden}
  .nav-rail .mn-list{align-items:center}
  .nav-rail .mn-i{width:40px;height:40px;padding:0;justify-content:center}
  .nav-rail .mn-sub{margin:0;padding:0;border:0}
  .nav-rail .mn-user{justify-content:center;padding:12px 0}

  /* Shell: top bar over the page and the docked agent panel */
  .shell{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .topbar{flex:none;display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 20px;border-bottom:1px solid var(--border);background:#fff}
  .crumb{display:flex;align-items:center;gap:6px;min-width:0;font-size:var(--text-sm);color:var(--muted-foreground)}
  .crumb a{text-decoration:none} .crumb a:hover{color:var(--foreground);text-decoration:underline}
  .crumb b{color:var(--foreground);font-weight:600}
  .crumb .ic{width:14px;height:14px;color:var(--quiet)}
  .tb-sp{flex:1}
  .abtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--foreground);font:inherit;font-size:var(--text-sm);font-weight:600;white-space:nowrap;cursor:pointer}
  .abtn:hover{background:var(--muted)}
  .abtn[aria-expanded=true]{background:var(--sel-bg);border-color:#bfdbfe;color:var(--sel-fg)}
  .adot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .work{flex:1;min-height:0;display:flex;position:relative}
  .page{flex:1;min-width:0;min-height:0;position:relative;display:flex}
  .ph .topbar{padding:0 6px;gap:4px}
  .ph .tb-title{flex:1;min-width:0;font-weight:700;font-size:var(--text-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph .abtn{height:40px}

  /* Agent panel (chat-bubble variant B): 400 wide, one left border; phone is a full-screen sheet */
  .agentp{flex:none;width:400px;display:flex;flex-direction:column;min-height:0;background:#fff;border-left:1px solid var(--border)}
  .ph .agentp{position:absolute;inset:0;z-index:50;width:auto;border-left:0}
  .bh{flex:none;display:flex;align-items:center;gap:2px;height:60px;padding:0 6px 0 16px;border-bottom:1px solid var(--border)}
  .bh-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
  .bh-t h2{font-size:var(--text-base);font-weight:700}
  .ctx{font-size:var(--text-xs);color:var(--muted-foreground)}
  .bs{flex:1;min-height:0;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
  .bs p{font-size:var(--text-sm);color:var(--body-2)}
  .chips{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .chip{display:inline-flex;align-items:center;min-height:32px;padding:4px 12px;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--body-2);font:inherit;font-size:var(--text-sm);text-align:left;cursor:pointer}
  .chip:hover{background:var(--muted);border-color:#d1d5db;color:var(--foreground)}
  .bd{flex:none;padding:8px 12px 12px}
  .composer{display:flex;align-items:flex-end;gap:8px;padding:5px 5px 5px 16px;border:1px solid #cfd4dc;border-radius:24px;background:#fff;box-shadow:0 1px 2px rgb(17 24 39 / .04),0 10px 28px -14px rgb(17 24 39 / .22)}
  .composer:has(textarea:focus){border-color:var(--ring);box-shadow:0 0 0 1px var(--ring),0 10px 28px -14px rgb(17 24 39 / .22)}
  .composer textarea{flex:1;min-width:0;height:38px;padding:8px 0;border:0;outline:0;resize:none;background:none;color:var(--foreground);font:inherit;line-height:22px}
  .composer textarea::placeholder{color:var(--quiet)}
  .send{flex:none;width:38px;height:38px;border:0;border-radius:999px;display:grid;place-items:center;background:var(--primary);color:#fff;cursor:pointer}
  .send .ic{width:18px;height:18px;stroke-width:2.1}

  /* Shared record parts */
  .pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:var(--text-xs);font-weight:700;white-space:nowrap}
  .pill.dang{background:var(--dang-bg);color:var(--dang);box-shadow:inset 0 0 0 1px #fecaca}
  .pill.ok{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px #a7f3d0}
  .pill .ic{width:13px;height:13px;stroke-width:2.2}
  .meta{font-size:var(--text-sm);color:var(--muted-foreground)}
  .h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .h2{font-size:var(--text-base);font-weight:700;letter-spacing:-.01em}
  .sec{display:flex;flex-direction:column;gap:10px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .sec-h .meta{font-size:var(--text-xs)}

  /* Origin tag: the field's provenance, quiet until it is a correction */
  .otag{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-xs);font-weight:600;color:var(--quiet);white-space:nowrap}
  .otag .ic{width:12px;height:12px;stroke-width:2}
  .otag.corrected{color:var(--sel-fg)}
  .otag.entered{color:#5b21b6}

  /* Fields: each row selectable; selecting highlights its source on the page */
  .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 28px}
  .fld{position:relative;display:flex;flex-direction:column;gap:2px;width:calc(100% + 20px);min-width:0;padding:8px 10px;margin:0 -10px;border:0;border-radius:8px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background-color .15s var(--ease)}
  .fld:hover{background:var(--tile)}
  .fld[aria-pressed=true]{background:#fffbeb;box-shadow:inset 0 0 0 1px var(--hl-line)}
  .fld.wide{grid-column:1/-1}
  .fld-l{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:var(--text-xs);font-weight:600;color:var(--muted-foreground)}
  .fld-v{font-size:var(--text-sm);color:var(--foreground);overflow-wrap:anywhere}
  .nodoc .fld{cursor:default} .nodoc .fld:hover{background:none}

  /* Amounts strip */
  .amts{display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap}
  .amt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .amt-l{font-size:var(--text-xs);font-weight:600;color:var(--muted-foreground)}
  .amt-v{font-size:var(--text-xl);font-weight:700;letter-spacing:-.01em}
  .amt.lead .amt-v{font-size:2.1rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
  .amt.lead.overdue .amt-v{color:var(--dang)}
  .amt-n{font-size:var(--text-xs);color:var(--muted-foreground)}
  .amt-n.dang{color:var(--dang);font-weight:600}

  /* Payment composition bar: each linked payment, then what is still outstanding */
  .pbar{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden;background:var(--tile)}
  .pbar i{display:block;flex:var(--f) 1 0;min-width:4px}
  .p0{background:#2563eb} .p1{background:#60a5fa} .p2{background:#1e40af}
  .rest{background:repeating-linear-gradient(135deg,#fca5a5 0 3px,#fee2e2 3px 6px)}
  .pkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:var(--text-xs);color:var(--muted-foreground)}
  .pkey span{display:inline-flex;align-items:center;gap:6px}
  .pkey i{width:10px;height:10px;border-radius:3px}
  .pkey b{color:var(--foreground);font-weight:600}

  /* Payments */
  table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
  thead th{padding:8px 12px;background:var(--muted);border-block:1px solid var(--border);color:var(--muted-foreground);font-size:var(--text-xs);font-weight:600;text-align:left;white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  .r{text-align:right}
  .ref{font-weight:600;color:var(--sel-fg);text-decoration:none;overflow-wrap:anywhere} .ref:hover{text-decoration:underline}
  .how{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--body-2)}
  .auto{display:inline-flex;align-items:center;gap:4px}
  .auto .ic{width:13px;height:13px;color:var(--primary)}
  .acts{position:relative;width:44px;text-align:right}
  .menu{position:absolute;z-index:30;top:calc(100% - 4px);right:6px;min-width:180px;padding:6px;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 2px 4px rgb(17 24 39 / .06),0 16px 36px -12px rgb(17 24 39 / .28);text-align:left}
  .menu button{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--foreground);font:inherit;font-size:var(--text-sm);cursor:pointer}
  .menu button:hover{background:var(--tile)}
  .menu button.dang{color:var(--dang)}
  .rowedit td{background:var(--sel-bg)}
  .rowedit.rm td{background:var(--dang-bg)}
  .inl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .inl p{font-size:var(--text-sm);color:var(--body-2);flex:1 1 16rem}
  .money{display:inline-flex;align-items:center;height:36px;padding:0 10px;border:1px solid var(--input);border-radius:8px;background:#fff;gap:6px;font-size:var(--text-sm)}
  .money:focus-within{border-color:var(--ring);box-shadow:0 0 0 1px var(--ring)}
  .money span{color:var(--quiet);font-weight:600}
  .money input{width:7.5rem;border:0;outline:0;background:none;font:inherit;font-variant-numeric:tabular-nums}
  .ph .money{height:44px} .ph .money input{font-size:16px}
  .err{font-size:var(--text-xs);font-weight:600;color:var(--dang)}
  .pcards{display:flex;flex-direction:column;border-top:1px solid var(--border)}
  .pcard{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--border)}
  .pcard-t{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
  .pcard-f{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:var(--text-sm);color:var(--body-2)}
  .pcard.edit{padding:12px;margin:0 -12px;border-radius:10px;background:var(--sel-bg)} .pcard.edit.rm{background:var(--dang-bg)}
  .pcard.edit .inl{align-items:flex-start;flex-direction:column}
  .pcard.edit .inl p{flex:none}
  .empty-l{padding:14px 0;font-size:var(--text-sm);color:var(--muted-foreground);border-top:1px solid var(--border)}

  /* History */
  .hist li{display:grid;grid-template-columns:11rem minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--border);font-size:var(--text-sm)}
  .hist li:last-child{border-bottom:1px solid var(--border)}
  .hist time{color:var(--muted-foreground)}
  .hist li.new span{font-weight:600}
  .hist li.new time{color:var(--sel-fg);font-weight:600}
  .ph .hist li{grid-template-columns:1fr;gap:2px}

  /* Correct the total: an inline editor under the amounts, never a modal */
  .fix{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid #bfdbfe;border-radius:12px;background:var(--sel-bg)}
  .fix h3{font-size:var(--text-sm);font-weight:700}
  .fix fieldset{margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:6px}
  .fix legend{margin-bottom:6px;font-size:var(--text-sm);color:var(--body-2)}
  .fix label.opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:var(--text-sm);cursor:pointer}
  .fix label.opt:has(input:disabled){opacity:.55;cursor:default}
  .fix label.opt:has(input:checked){border-color:var(--sel-line);box-shadow:0 0 0 1px var(--sel-line)}
  .fix .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  /* The drawn page: a stand-in for the app's own PDF render (595 x 842 pt, A4), scaled with --s */
  .pgwrap{position:relative;flex:none;width:calc(595px * var(--s,1));height:calc(842px * var(--s,1));background:#fff;box-shadow:0 1px 2px rgb(17 24 39 / .08),0 12px 32px -12px rgb(17 24 39 / .28);border-radius:2px;overflow:hidden}
  .pgwrap object{display:block;width:100%;height:100%;border:0}
  .pg{position:absolute;left:0;top:0;width:595px;height:842px;transform:scale(var(--s,1));transform-origin:0 0;font-family:Helvetica,Arial,sans-serif;color:#1e293b;background:#fff;text-align:left}
  .pg *{position:absolute;margin:0;white-space:nowrap}
  .pg .ban{left:0;top:0;width:595px;height:36px;background:#3557d6;color:#fff;font-size:9.5px;font-weight:700;line-height:36px;padding-left:48px}
  .pg .tt{left:48px;top:60px;font-size:23px;font-weight:700;color:#1f2d3d}
  .pg .co{left:48px;top:104px;font-size:10.5px;font-weight:700}
  .pg .sy{left:48px;top:122px;font-size:8.5px;color:#64748b}
  .pg .src{left:42px;width:511px;border-radius:4px;transition:background-color .2s var(--ease),box-shadow .2s var(--ease);cursor:pointer;z-index:0}
  .pg .src.hl{background:rgb(253 230 138 / .8);box-shadow:0 0 0 2px var(--hl-line)}
  .pg .kv{left:48px;width:499px;height:37px;border-bottom:1px solid #e2e8f0;pointer-events:none}
  .pg .kv .k{left:0;top:13px;font-size:8.5px;color:#64748b}

  /* Viewer chrome shared by A and B */
  .vtools{flex:none;display:flex;align-items:center;gap:4px;height:48px;padding:0 8px 0 14px;border-bottom:1px solid var(--border);background:#fff}
  .vname{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:var(--text-sm);font-weight:600}

  .srcchip{position:sticky;top:0;left:0;z-index:5;align-self:stretch;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:10px;background:#111827;color:#f9fafb;font-size:var(--text-sm);box-shadow:0 8px 24px -10px rgb(17 24 39 / .5)}

  /* Full-screen viewer (desktop): covers the page and panel, Escape closes */
  .fs{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;background:#fff}
  .fs .vbody{padding:28px}

  /* ---------- Variant A: split view ---------- */
  .va{flex:1;min-width:0;display:flex}

  .va-amts{padding:18px 0;border-block:1px solid var(--border)}
  .va-amts .amts{gap:28px;justify-content:space-between}

  .seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--tile)}

  /* Phone shell parts: sticky segmented control, thumb-reach action bar */

  .ph-seg{flex:none;padding:8px 12px;border-bottom:1px solid var(--border);background:#fff}

  .ph .vbody{padding:12px}

  /* ---------- Variant B: record first, document card expands inline ---------- */
  .vb{flex:1;min-width:0;overflow-y:auto}

  .vb-band{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:32px;align-items:center;padding:22px 24px;border-radius:16px;background:var(--muted);box-shadow:inset 0 0 0 1px var(--border)}

  .vb-grid.expanded{grid-template-columns:minmax(0,1fr)}

  .vb-grid.expanded .vb-side .fld.wide{grid-column:span 2}
  .vb-side{display:flex;flex-direction:column;gap:28px}
  .ph .vb-band{grid-template-columns:1fr;gap:16px;padding:16px;border-radius:14px}
  .ph .vb-band .amt.lead .amt-v{font-size:2.1rem}
  .ph .vb-band .amts{display:flex;gap:28px}
  .ph .vb-head .h1{font-size:1.5rem}
  .ph .peek{height:230px;padding-top:16px}
  .ph .peek .go{height:40px}

  /* Full-screen document sheet (phones) */
  .sheet{position:absolute;inset:0;z-index:46;display:flex;flex-direction:column;background:#fff;transform:translateY(100%);visibility:hidden;transition:transform .3s var(--ease),visibility 0s .3s}
  .sheet.on{transform:none;visibility:visible;transition:transform .3s var(--ease)}
  .sh-h{flex:none;display:flex;align-items:center;gap:4px;height:56px;padding:0 6px;border-bottom:1px solid var(--border)}
  .sh-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
  .sh-t b{font-size:var(--text-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sh-t span{font-size:var(--text-xs);color:var(--muted-foreground)}
  .zbar{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}

  /* ---------- Variant C: document desk ---------- */
  .vc{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}

  .vc-id .h1{font-size:1.3rem}
  .vc-band .amts{flex:1;gap:28px;justify-content:flex-end}
  .vc-band .amt.lead .amt-v{font-size:1.7rem}
  .vc-band .amt-v{font-size:var(--text-lg)}
  .vc-body{flex:1;min-height:0;display:flex}
  .desk{flex:1;min-width:0;overflow:auto;background:var(--desk);position:relative;touch-action:pan-x pan-y pinch-zoom}
  .desk-in{position:relative;display:flex;padding:76px 32px 56px;width:max-content;min-width:100%;justify-content:center}
  .annos{position:relative;flex:none;width:260px;margin-left:56px}
  .anno{position:absolute;left:0;width:260px;display:flex;flex-direction:column;gap:1px;padding:7px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:inherit;font:inherit;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgb(17 24 39 / .05);transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}

  .bsheet-b{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:24px;border-top:1px solid var(--border)}

  /* Toast for prototype-only links */
  .toast{position:absolute;z-index:80;top:14px;left:50%;transform:translate(-50%,-8px);max-width:calc(100% - 24px);padding:8px 14px;border-radius:999px;background:#111827;color:#f9fafb;font-size:var(--text-sm);opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);text-align:center}

  /* Review switcher, not part of the design */
  #sw{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:6px;padding:5px;border-radius:999px;background:#0b0f19;color:#f9fafb;font-size:var(--text-xs);box-shadow:0 0 0 1px #374151,0 12px 32px -8px rgb(0 0 0 / .5);white-space:nowrap}

  #sw button[aria-pressed=true]{background:#f9fafb;color:#0b0f19}
  #sw .arr{width:30px;padding:0;display:grid;place-items:center}

  #sw .grp{display:flex;gap:2px}

  @media (max-width:900px){#sw .name{min-width:0} #sw .tag{display:none} #sw{max-width:calc(100vw - 16px);overflow-x:auto}}
</style>

  return `<header class="topbar"><nav class="crumb" aria-label="Breadcrumb"><a href="#" data-act="toast" data-msg="Back to Invoices">Invoices</a>${icon("chevR")}<b aria-current="page">INV-2026-09-03</b></nav><span class="tb-sp"></span>${agent}</header>`;
}
function agentPanel() {
  if (!S.panel) return "";
  return `<section class="agentp" id="agentp" aria-label="Agent"><header class="bh"><div class="bh-t"><h2>Agent</h2><p class="ctx">About: INV-2026-09-03, Harbor Foods</p></div>
    <button type="button" class="ib" data-act="panel" aria-label="Close the agent panel">${icon("x")}</button></header>
    <div class="bs"><p>Ask about this invoice. Answers come from the records you can see.</p><div class="chips">${ASK.map((q) => `<button type="button" class="chip" data-act="toast" data-msg="Asks: ${esc(q)}">${esc(q)}</button>`).join("")}</div></div>
    <div class="bd"><form class="composer"><label class="sr" for="msg">Message the agent</label><textarea id="msg" rows="1" placeholder="Ask about this invoice"></textarea><button type="submit" class="send" aria-label="Send">${icon("arrowUp")}</button></form></div></section>`;
}
const attachLine = () => `<p class="nodoc-line">${icon("fileText")}No document: entered by hand.<button type="button" class="btn sm" data-act="toast" data-msg="Opens the file picker to attach a PDF">${icon("filePlus")}Attach a PDF</button></p>`;

// ---------- Variant A: split view ----------
function variantA() {
  const ph = isPh();
  const head = `<div class="va-head"><div class="va-title"><div class="t"><h1 class="h1 num">INV-2026-09-03</h1>${pill()}</div><p class="meta">Harbor Foods · Balances as of ${AS_OF}, the reporting date.</p>${hasDoc() ? "" : attachLine()}</div>
    ${ph ? "" : `<button type="button" class="btn" data-act="correct">${icon("pen")}Correct the total</button>`}</div>`;
  const hint = S.doc === "ok" ? `<span class="meta">Select a field to find it on the document</span>` : "";
  const rec = `${head}<div class="va-amts">${amounts()}</div>${fixEditor()}
    <section class="sec"><div class="sec-h"><h2 class="h2">Details</h2>${hint}</div>${fields()}</section>${payments()}${historyList()}`;
  if (ph) {
    const docTab = hasDoc() && S.tab === "document";
    const seg = hasDoc() ? `<div class="ph-seg"><div class="seg" role="tablist" aria-label="View"><button type="button" role="tab" aria-selected="${!docTab}" data-act="tab" data-t="details">Details</button><button type="button" role="tab" aria-selected="${docTab}" data-act="tab" data-t="document">${icon("fileText")}Document${S.sel ? '<span class="dotx" aria-hidden="true"></span>' : ""}</button></div></div>` : "";
    const body = docTab
      ? `<div class="ph-scroll" style="display:flex;flex-direction:column">${viewerBody("w", S.doc === "ok" ? `<span class="pinch">${icon("hand")}Pinch to zoom</span>` : "")}</div>`
      : `<div class="ph-scroll"><div class="ph-in">${rec}</div></div>`;
    const bar = docTab
      ? `<div class="abar"><a class="btn" href="${PDF}" download>${icon("download")}Download</a><button type="button" class="btn pri" data-act="tab" data-t="details">Back to details</button></div>`
      : `<div class="abar"><button type="button" class="btn" data-act="correct">${icon("pen")}Correct total</button>${hasDoc() ? `<button type="button" class="btn pri" data-act="tab" data-t="document">${icon("fileText")}Document</button>` : ""}</div>`;
    return `${seg}${body}${bar}`;
  }
  const pane = hasDoc() ? `<aside class="va-doc" aria-label="Document">${vtools(`<button type="button" class="ib" data-act="fs" aria-label="Open full screen" ${S.doc === "ok" ? "" : "disabled"}>${icon("expand")}</button>`)}${viewerBody("w")}</aside>` : "";
  return `<div class="va"><div class="va-rec"><div class="va-in">${rec}</div></div>${pane}</div>`;
}

// ---------- Variant B: record first, document card expands inline ----------
function variantB() {
  const ph = isPh(), od = status() === "overdue";
  const head = `<div class="vb-head"><div class="t"><h1 class="h1 num">INV-2026-09-03</h1><div class="sub">${pill()}<span class="meta">Harbor Foods · Balances as of ${AS_OF}</span></div></div>
    ${ph ? "" : `<div style="display:flex;gap:8px">${S.doc === "ok" ? `<a class="btn" href="${PDF}" download>${icon("download")}Download PDF</a>` : ""}<button type="button" class="btn" data-act="correct">${icon("pen")}Correct the total</button></div>`}</div>`;
  const band = `<div class="vb-band"><div class="amt lead ${od ? "overdue" : ""}"><span class="amt-l">Outstanding</span><span class="amt-v num">${money(outstanding())}</span><span class="amt-n ${od ? "dang" : ""}">${od ? `Due 17 Sept 2026 · ${DAYS_OVERDUE} days overdue` : "Fully paid · was due 17 Sept 2026"}</span></div>
    <div class="vb-bars"><div class="amts"><div class="amt"><span class="amt-l">Total</span><span class="amt-v num">${money(S.total)}</span>${otag("total")}</div><div class="amt"><span class="amt-l">Paid</span><span class="amt-v num">${money(paid())}</span><span class="amt-n">${S.links.length} payment${S.links.length === 1 ? "" : "s"} linked</span></div></div>${payBar()}</div></div>`;
  const fileHead = (right) => `<div class="dcard-h"><span class="fi">${icon("fileText")}</span><span class="nm"><b>INV-2026-09-03.pdf</b><span>Source document · 1 page</span></span>${right}</div>`;
  let card;
  if (S.doc === "none") card = `<section class="dcard" aria-label="Document"><div class="vbody" style="background:var(--muted)">${docNone()}</div></section>`;
  else if (S.doc === "error") card = `<section class="dcard" aria-label="Document">${fileHead(`<a class="ib" href="${PDF}" download aria-label="Download the PDF">${icon("download")}</a>`)}<div class="vbody">${docError()}</div></section>`;
  else if (S.expanded && !ph) card = `<section class="dcard" aria-label="Document">${vtools(`<button type="button" class="btn sm" data-act="expand" aria-expanded="true">${icon("shrink")}Collapse</button>`)}${viewerBody("w")}</section>`;
  else card = `<section class="dcard" aria-label="Document">${fileHead(ph ? "" : `<button type="button" class="btn sm" data-act="expand" aria-expanded="false">${icon("expand")}Expand</button>`)}
    <button type="button" class="peek" data-act="${ph ? "sheet" : "expand"}" aria-label="Open the document preview">${pageBox(ph ? "peek-ph" : "peek", false)}<span class="go">${icon("expand")}${ph ? "Open the document" : "Expand the preview"}</span></button></section>`;
  const details = `<section class="sec"><div class="sec-h"><h2 class="h2">Details</h2>${S.doc === "ok" && !ph ? `<span class="meta">Select a field to see it on the page</span>` : ""}</div>${fields()}</section>`;
  if (ph) {
    const sheet = S.doc === "ok" ? `<section class="sheet ${S.sheet ? "on" : ""}" aria-label="Document" ${S.sheet ? "" : 'aria-hidden="true" inert'}>
      <header class="sh-h"><button type="button" class="ib" data-act="sheet" aria-label="Back to the invoice">${icon("arrowL")}</button><span class="sh-t"><b>INV-2026-09-03.pdf</b><span>Page 1 of 1</span></span><a class="ib" href="${PDF}" download aria-label="Download the PDF">${icon("download")}</a></header>
      ${S.sheet ? viewerBody("w", `<span class="pinch">${icon("hand")}Pinch to zoom</span>`) : ""}<div class="zbar">${zoomTools()}</div></section>` : "";
    return `<div class="ph-scroll"><div class="ph-in">${head}${band}${fixEditor()}${card}${details}${payments()}${historyList()}</div></div>
      <div class="abar"><button type="button" class="btn" data-act="correct">${icon("pen")}Correct total</button>${S.doc === "ok" ? `<button type="button" class="btn pri" data-act="sheet">${icon("fileText")}Document</button>` : ""}</div>${sheet}`;
  }
  return `<div class="vb"><div class="vb-in">${head}${band}${fixEditor()}<div class="vb-grid ${S.expanded && S.doc === "ok" ? "expanded" : ""}">${card}<div class="vb-side">${details}</div></div>
    ${payments()}${historyList()}</div></div>`;
}

// ---------- Variant C: document desk with pinned fields ----------
function variantC() {
  const ph = isPh();
  const annos = S.doc === "ok" && !ph ? `<div class="annos" id="annos">${FIELD_DEFS.map((f) => fieldBtn(f, "anno")).join("")}</div><svg class="lead-l" id="leads" aria-hidden="true"></svg>` : "";
  const deskPage = S.doc === "ok"
    ? `<div>${pageBox("c", false)}</div>${annos}`
    : `<div style="display:flex;flex-direction:column;gap:20px;width:${ph ? "100%" : "620px"}">${S.doc === "error" ? docError() : docNone()}
      <section class="sec dcard" style="padding:16px 18px"><div class="sec-h"><h2 class="h2">Fields</h2><span class="meta">${S.doc === "error" ? "Read from the document" : "Entered by hand"}</span></div>${fields()}</section></div>`;
  const tools = S.doc === "ok" ? `<div class="desk-tools"><div>${zoomTools()}<span class="vsep"></span><button type="button" class="ib" data-act="fs" aria-label="Open the original PDF full screen">${icon("expand")}</button><a class="ib" href="${PDF}" download aria-label="Download the PDF">${icon("download")}</a>${ph || S.drawer ? "" : `<span class="vsep"></span><button type="button" class="btn sm" data-act="drawer" aria-expanded="false">${icon("panelR")}Payments and history</button>`}</div></div>` : "";
  const desk = `<div class="desk" id="desk">${tools}<div class="desk-in">${deskPage}</div></div>`;
  const side = `${payments(true)}${historyList()}`;
  if (ph) {
    return `<div class="vc" style="flex:1;min-height:0">${desk}${fsViewer(true)}</div><section class="bsheet ${S.peek ? "peek-only" : ""}" aria-label="Invoice record">
      <button type="button" class="grab" data-act="peek" aria-expanded="${!S.peek}"><span class="gt"><b class="num">INV-2026-09-03</b>${pill()}</span>
        <span class="pk"><span class="amt lead ${status() === "overdue" ? "overdue" : ""}"><span class="amt-l">Outstanding · Harbor Foods</span><span class="amt-v num">${money(outstanding())}</span></span><span class="more">${S.peek ? "Details" : "Hide"}${icon(S.peek ? "chevU" : "chevD")}</span></span></button>
      <div class="bsheet-b">${amounts()}${fixEditor()}${S.edit === "total" ? "" : `<button type="button" class="btn" data-act="correct">${icon("pen")}Correct the total</button>`}
        ${S.doc === "ok" ? `<section class="sec"><div class="sec-h"><h2 class="h2">Fields on the page</h2><span class="meta">Tap one to find it</span></div>${fields()}</section>` : ""}${side}</div></section>`;
  }
  const band = `<div class="vc-band"><div class="vc-id"><div class="t"><h1 class="h1 num">INV-2026-09-03</h1>${pill()}</div><p class="meta">Harbor Foods · as of ${AS_OF}</p></div>${amounts()}
    <button type="button" class="btn" data-act="correct">${icon("pen")}Correct the total</button></div>`;
  const drawer = S.drawer || S.doc !== "ok" || S.edit === "total" ? `<aside class="drawer" aria-label="Payments and history"><div class="drawer-h"><b>Payments and history</b>${S.doc === "ok" ? `<button type="button" class="ib" data-act="drawer" aria-label="Hide payments and history">${icon("x")}</button>` : ""}</div><div class="drawer-b">${fixEditor()}${side}</div></aside>` : "";
  return `<div class="vc">${band}<div class="vc-body">${desk}${drawer}</div></div>`;
}

// Full-screen viewer: the original PDF (or its drawn fallback), covering the page and panel
function fsViewer(inPhone) {
  if (!S.fs || (isPh() && !inPhone)) return "";
  return `<section class="fs" role="dialog" aria-modal="true" aria-label="INV-2026-09-03.pdf, full screen">${vtools(`<button type="button" class="btn sm" data-act="fs">${icon("shrink")}Exit full screen</button>`)}<div class="vbody">${srcChip()}${pageBox("fs")}</div></section>`;
}

// ---------- Render ----------
const app = document.getElementById("app");
function render() {
  const ph = isPh(), framed = ph && innerWidth > 480;
  const keepScroll = [...app.querySelectorAll(".va-rec,.vb,.ph-scroll,.desk,.drawer-b,.bsheet-b")].map((n) => [n.className, n.scrollTop, n.scrollLeft]);
  document.body.classList.toggle("framed", framed);
  document.body.classList.toggle("chrome", S.chrome);
  app.className = `v-${S.v} ${ph ? "ph" : "dt"} ${framed ? "framed" : ""} ${navRail() ? "nav-rail" : ""}`;
  const page = { A: variantA, B: variantB, C: variantC }[S.v]();
  app.innerHTML = `${ph ? "" : mainNav()}<div class="shell">${topbar()}<div class="work"><main class="page" aria-label="Invoice INV-2026-09-03">${page}</main>${agentPanel()}${ph ? "" : fsViewer()}</div></div><div class="toast" role="status"></div>`;
  if (!S.reset) keepScroll.forEach(([c, t, l]) => { const n = app.getElementsByClassName(c.split(" ")[0])[0]; if (n && n.className === c) { n.scrollTop = t; n.scrollLeft = l; } });
  S.reset = false;
  fit(); syncSwitcher(); syncUrl();
  if (S.focus) { app.querySelector(S.focus)?.focus(); S.focus = null; }
  if (S.scrollTo) { app.querySelector(S.scrollTo)?.scrollIntoView({ block: "center" }); S.scrollTo = null; }
}
// Size every page box: fit its container's width, times the zoom; C fits the desk beside the pinned fields.
function fit() {
  app.querySelectorAll(".pgwrap").forEach((w) => {
    const mode = w.dataset.fit, host = w.closest(".vbody,.desk,.peek") || w.parentElement;
    let s;
    if (mode === "peek") s = Math.min(0.78, (host.clientWidth - 64) / 595);
    else if (mode === "peek-ph") s = Math.min(0.5, (host.clientWidth - 48) / 595);
    else if (mode === "c") {
      const room = host.clientWidth - (isPh() ? 24 : 64 + 316);
      s = Math.max(0.45, Math.min(isPh() ? 1 : 1.2, room / 595)) * S.zoom / 100;
    } else {
      const pad = isPh() ? 24 : mode === "fs" ? 56 : 40;
      s = Math.max(0.3, (host.clientWidth - pad) / 595);
      if (mode === "fs") s = Math.min(s, (host.clientHeight - 56) / 842);
      s *= S.zoom / 100;
    }
    w.style.setProperty("--s", s.toFixed(4));
  });
  placeAnnos();
}
// C: pin each field card beside its line, pushing down on collision, and draw the leader lines.
function placeAnnos() {
  const box = document.getElementById("annos"), svg = document.getElementById("leads");
  if (!box || !svg) return;
  const pg = app.querySelector(".desk .pgwrap"), s = parseFloat(pg.style.getPropertyValue("--s"));
  const host = box.parentElement;
  const items = [...box.children].map((el) => { const f = FIELD_DEFS.find((d) => d.k === el.dataset.k); return { el, f, cy: (f.y + f.h / 2) * s }; }).sort((a, b) => a.cy - b.cy);
  let bottom = -Infinity;
  items.forEach((it) => { it.h = it.el.offsetHeight; it.top = Math.max(it.cy - it.h / 2, bottom + 8); it.el.style.top = `${it.top}px`; bottom = it.top + it.h; });
  box.style.height = `${Math.max(bottom, 842 * s)}px`;
  const ox = pg.offsetLeft, oy = pg.offsetTop, x0 = ox + pg.offsetWidth, bx = box.offsetLeft, by = box.offsetTop;
  svg.setAttribute("width", host.scrollWidth); svg.setAttribute("height", host.scrollHeight);
  svg.innerHTML = items.map((it) => {
    const on = S.sel === it.f.k ? "on" : "", ya = oy + it.cy, yb = by + it.top + it.h / 2, xs = x0 - 8, xm = x0 + 18;
    return `<path class="${on}" d="M${xs} ${ya} H${xm} L${bx - 14} ${yb} H${bx}"/><circle class="${on}" cx="${xs}" cy="${ya}" r="2.5"/>`;
  }).join("");
}

// ---------- Actions ----------
let toastT;
function toast(msg) {
  const t = app.querySelector(".toast"); if (!t) return;
  t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600);
}
function addHist(s) { S.hist.forEach((h) => (h.fresh = false)); S.hist.push({ t: now(), s, fresh: true }); }
function unlink(id, msg) {
  const l = S.links.find((x) => x.id === id);
  S.links = S.links.filter((x) => x.id !== id);
  addHist(`Payment ${l.ref} unlinked. ${money(l.cents)} returns to the payment as unallocated.`);
  return msg(l);
}
const ACT = {
  nav: () => { S.nav = navRail() ? "open" : "rail"; },
  panel: () => { S.panel = !S.panel; },
  sel: (d) => {
    S.sel = S.sel === d.k ? null : d.k;
    if (!S.sel) return;
    if (isPh() && S.v === "A") S.tab = "document";
    if (isPh() && S.v === "B") S.sheet = true;
    if (isPh() && S.v === "C") { S.peek = true; S.scrollTo = ".desk .src.hl"; }
    if (!isPh() && S.v === "B") S.expanded = true;
  },
  tab: (d) => { S.tab = d.t; S.reset = true; },
  zin: () => { S.zoom = Math.min(250, S.zoom + 25); },
  zout: () => { S.zoom = Math.max(50, S.zoom - 25); },
  zfit: () => { S.zoom = 100; },
  fs: () => { S.fs = !S.fs; S.zoom = 100; },
  expand: () => { S.expanded = !S.expanded; S.zoom = 100; },
  sheet: () => { S.sheet = !S.sheet; S.zoom = 100; },
  peek: () => { S.peek = !S.peek; },
  drawer: () => { S.drawer = !S.drawer; },
  retry: () => { S.doc = "ok"; S.toastMsg = "The preview loaded"; },
  correct: () => { endEdit(); S.edit = "total"; S.menu = null; if (isPh() && S.v === "C") S.peek = false; if (isPh() && S.v === "A") S.tab = "details"; S.focus = "#fix-in"; },
  cancel: () => { endEdit(); },
  menu: (d) => { S.menu = S.menu === d.id ? null : d.id; },
  change: (d) => { endEdit(); S.menu = null; S.edit = `link:${d.id}`; S.focus = "#lf-in"; },
  remove: (d) => { endEdit(); S.menu = null; S.edit = `rm:${d.id}`; },
  "confirm-rm": (d) => { S.toastMsg = unlink(d.id, (l) => `Link removed. ${money(l.cents)} returns to ${l.ref} as unallocated.`); endEdit(); },
  undo: (d) => { S.toastMsg = unlink(d.id, (l) => `Automatic link undone. ${money(l.cents)} returns to ${l.ref}.`); },
  toast: (d) => { S.toastMsg = d.msg; return "norender"; },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || !app.contains(el)) { if (S.menu && !e.target.closest(".menu")) { S.menu = null; render(); } return; }
  if (el.tagName === "A") e.preventDefault();
  const act = el.dataset.act;
  if (!["menu", "change", "remove"].includes(act)) S.menu = null;
  const r = ACT[act]?.(el.dataset);
  if (r !== "norender") render();
  if (S.toastMsg) { toast(S.toastMsg); S.toastMsg = null; }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "fix-in") { S.fixVal = e.target.value; S.err = ""; const pos = e.target.selectionStart; render(); const i = document.getElementById("fix-in"); i.focus(); i.setSelectionRange(pos, pos); }
  if (e.target.id === "lf-in") S.linkVal = e.target.value;
});
document.addEventListener("change", (e) => { if (e.target.name === "reduce") S.reduce = e.target.value; });
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "fix") {
    const n = Math.round(parseFloat(S.fixVal ?? plain(S.total)) * 100);
    if (!Number.isFinite(n) || n <= 0) { S.err = "Enter the total as an amount above zero, such as 7200.00."; return render(); }
    if (n === S.total) { endEdit(); return render(); }
    const over = n < paid() ? paid() - n : 0;
    if (over) {
      const l = S.links.find((x) => x.id === S.reduce);
      if (!l) { S.err = "Choose the link to reduce."; return render(); }
      const before = l.cents; l.cents -= over;
      addHist(`Link to payment ${l.ref} changed from ${money(before)} to ${money(l.cents)}.`);
    }
    addHist(`Total corrected from ${money(S.total)} to ${money(n)}.`);
    S.total = n; S.origin.total = "corrected"; endEdit(); render(); toast(`Total corrected to ${money(n)}`); return;
  }
  if (e.target.id === "lf") {
    const l = S.links.find((x) => x.id === e.target.dataset.id);
    const n = Math.round(parseFloat(S.linkVal ?? plain(l.cents)) * 100), max = S.total - paid() + l.cents;
    if (!Number.isFinite(n) || n <= 0 || n > max) { S.err = `Enter an amount from 0.01 to ${plain(max)}.`; render(); return; }
    if (n !== l.cents) addHist(`Link to payment ${l.ref} changed from ${money(l.cents)} to ${money(n)}.`);
    l.cents = n; endEdit(); render(); toast(`Link set to ${money(n)}`); return;
  }
  toast("Sends the question to the agent");
});
const typing = (t) => t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (S.menu) S.menu = null; else if (S.edit) endEdit(); else if (S.fs) S.fs = false; else if (S.sheet) S.sheet = false; else if (S.expanded) S.expanded = false; else if (S.sel) S.sel = null; else return;
    return render();
  }
  if (typing(e.target) || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") cycle(e.key === "ArrowRight" ? 1 : -1);
});
function cycle(d) { const ks = Object.keys(VARIANTS); S.v = ks[(ks.indexOf(S.v) + d + ks.length) % ks.length]; seed(); S.reset = true; render(); }
let rz; addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(render); });

// ---------- Switcher ----------
const sw = document.getElementById("sw");
sw.querySelector('[data-sw="prev"]').innerHTML = icon("chevL");
sw.querySelector('[data-sw="next"]').innerHTML = icon("chevR");
sw.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.sw) return cycle(b.dataset.sw === "next" ? 1 : -1);
  if (b.dataset.w) S.w = b.dataset.w;
  if (b.dataset.s) S.state = b.dataset.s;
  seed(); S.reset = true; render();
});
function syncSwitcher() {
  sw.hidden = !S.chrome;
  sw.querySelector(".name").innerHTML = `<b>${S.v}</b>${VARIANTS[S.v]}`;
  sw.querySelectorAll("[data-w]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.w === S.w));
  sw.querySelectorAll("[data-s]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.s === S.state));
}
render();
</script>
</body>
