<!DOCTYPE html>
<!-- PROTOTYPE, throwaway. Three variants of the Invoices, Payments and Documents filter header, switchable via ?variant=A|B|C and ?screen=payments|invoices|documents&width=desktop|phone.
     Extra: &open=date|cust|filters|sheet opens a popover or the phone sheet. &chrome=0 hides the switcher (for captures).
     World: the Section 7 redesign prototype (section-7-redesign.prototype.html): same tokens, type, shell and page pattern.
     Data: fictional demo rows, reporting date 3 Nov 2026. The header figures are static demo values. Icons: lucide (ISC), inlined. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE: list filter header, three variants</title>
<style>
  /* Token layer copied from the Section 7 redesign prototype */
  :root{
    --background:#ffffff;--foreground:#111827;--card:#ffffff;--muted:#f9fafb;--muted-foreground:#4b5563;
    --border:#e5e7eb;--input:#6b7280;--primary:#2563eb;--primary-foreground:#ffffff;--ring:var(--primary);
    --tile:#f3f4f6;--body-2:#374151;--placeholder:#6b7280;
    --ok:#047857;--ok-bg:#ecfdf5;--warn:#92400e;--warn-bg:#fffbeb;--dang:#b91c1c;--dang-bg:#fef2f2;
    --sel-bg:#eff6ff;--sel-line:#2563eb;--sel-fg:#1d4ed8;
    --font-sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --text-xs:max(12px,.8rem);--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;--text-xl:1.25rem;--text-2xl:1.5rem;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  html{font-size:15px;scrollbar-color:#d1d5db transparent}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);font-size:var(--text-base);line-height:1.5;color:var(--foreground);background:var(--background);-webkit-font-smoothing:antialiased}
  ::selection{background:#dbeafe;color:#1e3a8a}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted-foreground)}
  .sm{font-size:var(--text-sm)} .xs{font-size:var(--text-xs)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .ic.lg{width:20px;height:20px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* Shell and page header (redesign parts 1 and 2) */
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;min-width:1180px}
  .side{position:sticky;top:0;height:100vh;background:var(--muted);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px}
  .tenant{display:flex;align-items:center;gap:10px;padding:6px 8px 4px;font-size:var(--text-sm);font-weight:600}
  .tile{width:28px;height:28px;border-radius:8px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:700;font-size:var(--text-sm)}
  .navcap{font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);margin:18px 10px 6px}
  .navrow{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--body-2);font:inherit;font-size:var(--text-sm);font-weight:500;text-align:left;cursor:pointer}
  .navrow:hover{background:var(--tile)}
  .navrow[aria-current=page]{background:#fff;box-shadow:inset 0 0 0 1px var(--border);color:var(--primary);font-weight:600}
  .who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid var(--border);font-size:var(--text-sm)}
  .avatar{width:32px;height:32px;border-radius:999px;background:var(--tile);color:var(--body-2);display:grid;place-items:center;font-size:var(--text-xs);font-weight:600}
  .main{min-width:0;padding:24px 32px 112px}
  .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
  .found{display:block;max-width:20rem;overflow:hidden;text-overflow:ellipsis}
  .ph h1{margin:0;font-size:var(--text-xl);font-weight:700;line-height:1.3;letter-spacing:-.01em}
  .ph .meta{margin:4px 0 0;font-size:var(--text-sm);color:var(--muted-foreground)}
  /* Figure strip: one bordered row of equal columns. Every figure is caption, value, sub-line on three shared rows (subgrid),
     so captions share a top, values share a baseline (the lead's larger value included) and sub-lines share a row. */
  .strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,auto);row-gap:4px;margin-bottom:24px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
  .fig{grid-row:span 3;display:grid;grid-template-rows:subgrid;min-width:0;padding:14px 20px 16px}
  .fig+.fig{border-left:1px solid var(--border)}
  .fig .cap{font-size:var(--text-xs);font-weight:600;color:var(--muted-foreground);line-height:1.4}
  .fig .val{align-self:baseline;font-size:var(--text-lg);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap}
  .fig .sub{font-size:var(--text-xs);color:var(--muted-foreground);line-height:1.4}
  .fig.lead .val{font-size:var(--text-2xl);font-weight:700;letter-spacing:-.015em}

  /* Buttons and pills (redesign) */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--input);border-radius:8px;background:#fff;color:#1f2937;font:inherit;font-size:var(--text-sm);font-weight:600;white-space:nowrap;cursor:pointer;transition:background-color .15s var(--ease)}
  .btn:hover{background:var(--muted)}
  .btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)} .btn.pri:hover{opacity:.94}
  .btn.ghost{border-color:transparent;background:none;color:var(--body-2)} .btn.ghost:hover{background:var(--muted)}
  .btn.small{height:32px;padding:0 10px}
  .btn.icon{width:40px;padding:0} .btn.icon.small{width:32px}
  .btn[aria-disabled=true]{opacity:.45;cursor:default} .btn[aria-disabled=true]:hover{background:none}
  .count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:var(--text-xs);font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
  .pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--tile);color:var(--body-2);font-size:var(--text-xs);font-weight:600;white-space:nowrap}
  .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.dang{background:var(--dang-bg);color:var(--dang)}

  /* Filter controls: one height, one baseline. Placeholder: gray, regular. A set value: blue tint, semibold. */
  .search{position:relative;height:40px;min-width:12rem}
  .search .ic{position:absolute;left:12px;top:12px;color:var(--muted-foreground);pointer-events:none}
  .search input{width:100%;height:100%;padding:0 12px 0 36px;border:1px solid var(--input);border-radius:8px;background:#fff;color:var(--foreground);font:inherit;font-size:var(--text-sm);font-weight:500}
  .search input::placeholder{color:var(--placeholder);font-weight:400;opacity:1}
  .search input:focus{outline:2px solid var(--ring);outline-offset:1px}
  .search.small{height:32px} .search.small .ic{top:8px}
  .ctl{display:inline-flex;align-items:center;gap:8px;height:40px;min-width:0;padding:0 10px 0 12px;border:1px solid var(--input);border-radius:8px;background:#fff;color:var(--foreground);font:inherit;font-size:var(--text-sm);white-space:nowrap;cursor:pointer;transition:background-color .15s var(--ease)}
  .ctl:hover{background:var(--muted)}
  .ctl .ic{color:var(--muted-foreground)}
  .ctl .phd{color:var(--placeholder);font-weight:400}
  .ctl .v{font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .ctl .chev{margin-left:auto}
  .ctl.set{border-color:var(--sel-line);background:var(--sel-bg);color:var(--sel-fg)} .ctl.set .ic{color:var(--sel-fg)} .ctl.set:hover{background:#dbeafe}
  .ctl[aria-expanded=true]{outline:2px solid var(--ring);outline-offset:1px}
  .ctl.small{height:32px}
  .ctl.block{display:flex;width:100%;height:44px}
  .seg{display:inline-flex;height:40px;padding:3px;gap:2px;border:1px solid var(--input);border-radius:8px;background:#fff}
  .seg button{height:32px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--body-2);font:inherit;font-size:var(--text-sm);font-weight:500;white-space:nowrap;cursor:pointer}
  .seg button:hover{background:var(--muted)}
  .seg button[aria-pressed=true]{background:var(--tile);color:var(--foreground);font-weight:600;box-shadow:inset 0 0 0 1px var(--border)}
  .seg.block{display:flex;width:100%;height:44px} .seg.block button{flex:1;height:36px;padding:0 6px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border:1px solid var(--border);border-radius:999px;background:#fff;font:inherit;font-size:var(--text-xs);color:var(--foreground);white-space:nowrap;cursor:pointer}
  .chip:hover{background:var(--muted);border-color:#d1d5db}
  .chip .k{color:var(--muted-foreground);font-weight:500} .chip b{font-weight:600}
  .chip .ic{width:14px;height:14px;color:var(--muted-foreground)}

  /* Popovers: customer list, date range calendar, Filters panel */
  .pw{position:relative;display:inline-flex;min-width:0}
  .pw.end .pop{left:auto;right:0}
  .pop{position:absolute;top:calc(100% + 6px);left:0;z-index:35;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 16px 36px -14px rgb(17 24 39 / .3),0 2px 6px -2px rgb(17 24 39 / .08)}
  .custpop{width:15rem;padding:6px}
  .custpop .search{height:36px;margin-bottom:4px} .custpop .search .ic{top:10px}
  .opts{list-style:none;margin:0;padding:0}
  .opt{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--foreground);font:inherit;font-size:var(--text-sm);text-align:left;cursor:pointer}
  .opt:hover{background:var(--muted)}
  .opt .ic{margin-left:auto;color:var(--primary);visibility:hidden} .opt[aria-selected=true] .ic{visibility:visible} .opt[aria-selected=true]{font-weight:600}
  .opt.none{color:var(--muted-foreground)}
  .calpop{display:grid;grid-template-columns:auto auto}
  .presets{display:flex;flex-direction:column;gap:2px;min-width:9.5rem;padding:12px 8px;border-right:1px solid var(--border)}
  .presets .pt{margin:0 8px 6px;font-size:var(--text-xs);font-weight:600;color:var(--muted-foreground)}
  .pre{height:32px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--body-2);font:inherit;font-size:var(--text-sm);text-align:left;white-space:nowrap;cursor:pointer}
  .pre:hover{background:var(--muted)} .pre[aria-pressed=true]{background:var(--sel-bg);color:var(--sel-fg);font-weight:600}
  .prechips{display:flex;flex-wrap:wrap;gap:6px}
  .prechips .pre{height:32px;border:1px solid var(--border);border-radius:999px;font-size:var(--text-xs);font-weight:500}
  .prechips .pre[aria-pressed=true]{border-color:var(--sel-line)}
  .months{display:flex;gap:20px;padding:12px 16px 8px}
  .mhead{position:relative;display:flex;align-items:center;justify-content:center;height:32px;margin-bottom:4px;font-size:var(--text-sm);font-weight:600}
  .mhead .btn{position:absolute;top:0;width:32px;height:32px;border-color:var(--border)} .mhead .prev{left:0} .mhead .next{right:0}
  .wk,.days{display:grid;grid-template-columns:repeat(7,36px)}
  .wk span{height:28px;display:grid;place-items:center;font-size:var(--text-xs);font-weight:500;color:var(--muted-foreground)}
  .day{height:36px;padding:0;border:0;background:none;color:var(--foreground);font:inherit;font-size:var(--text-sm);font-variant-numeric:tabular-nums;cursor:pointer}
  .day span{display:grid;place-items:center;width:36px;height:36px;margin:auto;border-radius:8px}
  .day:hover span{background:var(--tile)}
  .day.in{background:var(--sel-bg)} .day.in span{color:var(--sel-fg)}
  .day.start{background:linear-gradient(90deg,transparent 50%,var(--sel-bg) 50%)}
  .day.end{background:linear-gradient(90deg,var(--sel-bg) 50%,transparent 50%)}
  .day.start.end{background:none}
  .day.start span,.day.end span{background:var(--primary)!important;color:#fff;font-weight:600}
  .day.today span{box-shadow:inset 0 0 0 1px var(--input)}
  .calfoot{display:flex;align-items:center;gap:8px;padding:10px 12px 12px 16px;border-top:1px solid var(--border)}
  .calfoot .what{flex:1;font-size:var(--text-sm);color:var(--muted-foreground)} .calfoot .what b{color:var(--foreground);font-weight:600}

  /* Table card */
  .card{border:1px solid var(--border);border-radius:12px;background:var(--card)}
  table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
  thead th{height:40px;padding:0 16px;background:var(--muted);border-bottom:1px solid var(--border);color:var(--muted-foreground);font-size:var(--text-xs);font-weight:600;text-align:left;white-space:nowrap}
  .card>table thead th:first-child{border-top-left-radius:11px} .card>table thead th:last-child{border-top-right-radius:11px}
  .sort{display:inline-flex;align-items:center;gap:4px;height:28px;margin:0 -6px;padding:0 6px;border:0;border-radius:6px;background:none;color:inherit;font:inherit;cursor:pointer}
  .sort:hover{background:var(--tile);color:var(--foreground)}
  .sort .ic{width:14px;height:14px;opacity:0}
  .sort:hover .ic,.sort:focus-visible .ic{opacity:.6}
  th[aria-sort] .sort{color:var(--foreground)} th[aria-sort] .sort .ic{opacity:1;color:var(--primary)}
  th.r .sort{flex-direction:row-reverse}
  td{height:48px;padding:0 16px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
  tbody tr{position:relative} tbody tr:hover{background:var(--muted)}
  .r{text-align:right}
  .rowlink{padding:0;border:0;background:none;color:var(--foreground);font:inherit;font-weight:600;cursor:pointer}
  .rowlink::after{content:"";position:absolute;inset:0}
  .rowlink:hover{text-decoration:underline;text-underline-offset:3px}
  .cfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 10px 8px 16px;font-size:var(--text-sm);color:var(--muted-foreground)}
  .empty{padding:40px 24px;text-align:center;border-bottom:1px solid var(--border)} .empty p{margin:0 0 4px} .empty .btn{margin-top:12px}

  /* Variant A: one aligned toolbar row, active filters as chips under it */
  .va-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .va-bar .search{flex:1 1 13rem;max-width:20rem}
  .va-bar .cust{width:12rem} .va-bar .date{width:15.5rem}
  .va-bar .clr{margin-left:auto}
  .va-active{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
  .va-active .lbl{font-size:var(--text-sm);color:var(--muted-foreground);margin-right:2px}
  .hdr{margin-bottom:12px}

  /* Variant B: search plus one Filters panel, active chips inline */
  .vb-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .vb-row .search{flex:0 1 24rem}
  .vb-row .sep{width:1px;height:24px;background:var(--border);margin:0 4px}
  .bp-grid{display:grid;grid-template-columns:14rem 252px;gap:24px;padding:16px 20px 12px}
  .bp-col{display:flex;flex-direction:column;gap:20px;min-width:0}
  .bp-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}
  .fld{display:flex;flex-direction:column;gap:8px;min-width:0}
  .fld>.lbl{font-size:var(--text-sm);font-weight:600;color:var(--foreground)}
  .fld .inline{border:1px solid var(--border);border-radius:8px;padding:4px}
  .slist{display:flex;flex-direction:column;gap:2px}
  .srad{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--body-2);font:inherit;font-size:var(--text-sm);text-align:left;cursor:pointer}
  .srad:hover{background:var(--muted)}
  .srad .dot{width:16px;height:16px;flex:none;border:1.5px solid var(--input);border-radius:999px;display:grid;place-items:center}
  .srad[aria-checked=true]{color:var(--foreground);font-weight:600}
  .srad[aria-checked=true] .dot{border-color:var(--primary)} .srad[aria-checked=true] .dot::after{content:"";width:8px;height:8px;border-radius:999px;background:var(--primary)}
  .srad .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted-foreground);font-weight:500}

  /* Variant C: status tabs on the card edge, compact bar inside the card header */
  .tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
  .tab{position:relative;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 12px;border:0;background:none;color:var(--body-2);font:inherit;font-size:var(--text-sm);font-weight:500;white-space:nowrap;cursor:pointer}
  .tab:hover{color:var(--foreground)}
  .tab .n{min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--tile);color:var(--body-2);font-size:var(--text-xs);font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
  .tab .n.dang{background:var(--dang-bg);color:var(--dang)} .tab .n.warn{background:var(--warn-bg);color:var(--warn)}
  .tab[aria-selected=true]{color:var(--foreground);font-weight:600}
  .tab[aria-selected=true]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--primary)}
  .cbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
  .cbar .search{flex:0 1 17rem;min-width:10rem}
  .cbar .cust{width:11rem} .cbar .date{width:14.5rem}
  .cbar .clr{margin-left:auto}
  .card.c table thead th{border-radius:0}

  /* Phone: a 390 x 844 frame, filters folded into one Filters button that opens a sheet */
  body.phone{background:#e5e7eb;display:grid;place-items:center;min-height:100vh;padding:24px 0 96px}
  .frame{position:relative;width:390px;height:844px;overflow:hidden;border-radius:28px;background:#fff;box-shadow:0 0 0 10px #111827}
  @media (max-width:480px){body.phone{padding:0;display:block} .frame{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
  .scroller{height:100%;overflow-y:auto}
  .m-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;height:56px;padding:0 12px 0 4px;background:#fff;border-bottom:1px solid var(--border)}
  .m-top .btn{width:44px;height:44px;border:0}
  .m-top .btn.up{width:auto;height:44px;margin-left:auto;padding:0 14px;border:1px solid var(--primary)}
  .m-top h1{margin:0;font-size:var(--text-lg);font-weight:700;letter-spacing:-.01em}
  .m-body{padding:12px 16px 120px}
  .m-body .meta{margin:0 0 12px;font-size:var(--text-sm);color:var(--muted-foreground)}
  /* Phone: a 2 x 2 grid of the same three-row figures; the lead stays first and slightly larger */
  .strip.m{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px}
  .strip.m .fig{padding:12px 14px 14px}
  .strip.m .fig:nth-child(odd){border-left:0}
  .strip.m .fig:nth-child(n+3){border-top:1px solid var(--border)}
  .strip.m .fig .val{font-size:var(--text-base)}
  .strip.m .fig.lead .val{font-size:var(--text-lg)}
  .m-row{display:flex;gap:8px} .m-row .search{flex:1;min-width:0;height:44px} .m-row .search .ic{top:14px} .m-row .btn{height:44px}
  .m-search{height:44px} .m-search .ic{top:14px}
  .rail{display:flex;align-items:center;gap:8px;margin:8px -16px 0;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
  .rail .btn{height:36px;flex:none}
  .m-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .m-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 8px;font-size:var(--text-sm);color:var(--muted-foreground)}
  .m-sort{display:inline-flex;align-items:center;gap:4px;height:36px;margin-right:-8px;padding:0 8px;border:0;border-radius:6px;background:none;color:var(--foreground);font:inherit;font-size:var(--text-sm);font-weight:600;cursor:pointer}
  .m-sort .ic{width:14px;height:14px}
  ul.cards{list-style:none;margin:0;padding:0}
  ul.cards>li+li{border-top:1px solid var(--border)}
  .cardrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
  .cr-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .cr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:var(--text-sm)}
  .cr-top>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

const icon = (n, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const pill = (tone, text) => `<span class="pill ${tone}">${text}</span>`;

// ---------- Demo data: the first 6 rows of each list ----------
const CUSTOMERS = ["ABC Trading", "Apex Digital", "Harbor Foods", "Lumi Design", "Meridian Labs", "Orchid Retail"];
// The list picker of each screen: [row field, label, placeholder, options, icon, plural]
const PICK_CUST = ["cust", "Customer", "All customers", CUSTOMERS, "building", "customers"];

const DOC_PILL = { reading: ["", "Reading"], unread: ["dang", "Could not read"], input: ["warn", "Needs your input"], linked: ["ok", "Linked automatically"], split: ["warn", "Confirm the split"], dup: ["warn", "Possible duplicate"], dupnone: ["", "Duplicate (nothing added)"], nomatch: ["warn", "No matching invoice"], ref: ["", "Kept as a reference"], saved: ["ok", "Saved"] };

const rowlink = (r) => `<button type="button" class="rowlink">${r.id}</button>`;
const DATA = {

      ["alloc", "Allocated", (r) => money(r.alloc), "r num"], ["st", "Status", (r) => pill(...PAY_PILL[r.st])], ["upd", "Updated", (r) => `<span class="muted">${stamp(r.upd)}</span>`, "num"],
    ],

    rows: [

      { id: "PAY-2026-034", cust: "Harbor Foods", date: "2026-10-31", ref: "HF-SEP-FINAL-PART", amount: 5200, alloc: 5200, st: "linked", upd: "2026-11-02T16:40" },

      { id: "PAY-2026-032", cust: "ABC Trading", date: "2026-10-24", ref: "TXN-PAY-2026-032", amount: 6500, alloc: 6500, st: "linked", upd: "2026-10-30T09:20" },
      { id: "PAY-2026-031", cust: "Lumi Design", date: "2026-10-16", ref: "LD-OCT-RETAINER", amount: 5450, alloc: 5450, st: "linked", upd: "2026-10-28T14:55" },
      { id: "PAY-2026-030", cust: "Harbor Foods", date: "2026-10-10", ref: "HF-SEP-PART-1", amount: 2000, alloc: 2000, st: "linked", upd: "2026-10-27T10:30" },
    ],
  },
  invoices: {
    title: "Invoices", meta: "Balances as of 3 Nov 2026, the reporting date.", nav: "invoices", pick: PICK_CUST,
    one: "invoice", many: "invoices", dateLabel: "Invoice date", searchLabel: "Search invoice or customer",
    statuses: [["all", "All", 36], ["open", "Open", 1], ["overdue", "Overdue", 4, "dang"], ["paid", "Paid", 29], ["nodue", "No due date", 2, "warn"]],
    match: 36,
    strip: [["Outstanding", "SGD 34,700.00", "In 7 invoices", true], ["Overdue", "SGD 20,850.00", "In 4 invoices"], ["Invoiced", "SGD 247,900.00", "All invoice dates"], ["Invoices", "36", "29 paid"]],

      ["due", "Due date", (r) => (r.due ? day(r.due) : '<span class="muted">None</span>'), "num"], ["total", "Total", (r) => money(r.total), "r num"],
      ["out", "Outstanding", (r) => money(r.out), "r num"], ["st", "Status", invPill], ["upd", "Updated", (r) => `<span class="muted">${stamp(r.upd)}</span>`, "num"],

      { id: "INV-2026-10-01", cust: "ABC Trading", date: "2026-10-01", due: "2026-10-15", total: 6500, out: 0, st: "paid", upd: "2026-10-30T09:20" },
      { id: "INV-2026-10-05", cust: "Lumi Design", date: "2026-10-05", due: "2026-10-19", total: 5450, out: 0, st: "paid", upd: "2026-10-28T14:55" },

    ],

      { id: "abc-remit-1024.pdf", type: "Payment advice", found: "Same as abc-remittance.pdf, 24 Oct", cust: "ABC Trading", ref: "TXN-PAY-2026-032", date: "2026-11-01", st: "dup", grp: "needs", upd: "2026-11-01T10:45" },

};
const PRESETS = [["This month", "2026-11-01", "2026-11-30"], ["Last month", "2026-10-01", "2026-10-31"], ["Last 30 days", "2026-10-05", "2026-11-03"], ["This quarter", "2026-10-01", "2026-12-31"], ["Year to date", "2026-01-01", "2026-11-03"]];

// ---------- State ----------
const P = new URLSearchParams(location.search);

if (S.open === "sheet" && S.width !== "phone") S.open = null;

const nSet = () => { const f = F(); return (f.status !== defStatus()) + !!f.cust + !!f.range.from; };
function rows() {
  const d = D(), f = F(), q = f.q.trim().toLowerCase();

  const { key, dir } = S.sort, sgn = dir === "asc" ? 1 : -1;
  return out.sort((a, b) => sgn * (a[key] == null ? -1 : b[key] == null ? 1 : a[key] < b[key] ? -1 : a[key] > b[key] ? 1 : 0));
}

}

const filtersBtn = (cls = "") => { const n = nSet(); return `<button type="button" class="btn ${cls}" data-open="${S.width === "phone" ? "sheet" : "filters"}" aria-haspopup="dialog" aria-expanded="${S.open === "filters" || S.open === "sheet"}">${icon("sliders")}Filters${n ? `<span class="count" aria-label="${n} set">${n}</span>` : ""}</button>`; };

// The list picker (customer, or document type). pop: a floating list (desktop), else an inline list (sheet, Filters panel).
function custCtl(cls = "", pop = true) {
  const [, label, all, opts, ic, plural] = D().pick;
  const v = F().cust, openKey = pop ? "open" : "sub", isOpen = pop ? S.open === "cust" : S.sub === "cust";
  const trig = `<button type="button" class="ctl cust ${v ? "set" : ""} ${cls}" data-${openKey}="cust" aria-haspopup="listbox" aria-expanded="${isOpen}" aria-label="${label}: ${esc(v || all)}">${icon(ic)}${v ? `<span class="v">${esc(v)}</span>` : `<span class="phd">${all}</span>`}${icon("chevD", "chev")}</button>`;
  if (!isOpen) return pop ? `<div class="pw">${trig}</div>` : trig;
  const q = S.custQ.toLowerCase();
  const list = `<ul class="opts" role="listbox" aria-label="${label}"><li><button type="button" class="opt none" role="option" data-cust="" aria-selected="${!v}">${all}${icon("check")}</button></li>${opts.filter((c) => c.toLowerCase().includes(q)).map((c) => `<li><button type="button" class="opt" role="option" data-cust="${c}" aria-selected="${v === c}">${c}${icon("check")}</button></li>`).join("")}</ul>`;
  return pop ? `<div class="pw">${trig}<div class="pop custpop"><div class="search">${icon("search")}<input type="search" data-k="cq" value="${esc(S.custQ)}" placeholder="Search ${plural}" aria-label="Search ${plural}"></div>${list}</div></div>`
    : `${trig}<div class="inline">${list}</div>`;
}
function dateCtl(d, cls = "", pop = true) {
  const r = F().range, openKey = pop ? "open" : "sub", isOpen = pop ? S.open === "date" : S.sub === "date";
  const trig = `<button type="button" class="ctl date ${r.from ? "set" : ""} ${cls}" data-${openKey}="date" aria-haspopup="dialog" aria-expanded="${isOpen}" aria-label="${d.dateLabel}: ${r.from ? rangeText(r) : "any"}">${icon("calendar")}${r.from ? `<span class="v num">${rangeText(r)}</span>` : `<span class="phd">Any ${d.dateLabel.toLowerCase()}</span>`}${icon("chevD", "chev")}</button>`;
  if (!pop) return trig;
  return `<div class="pw ${S.variant === "A" ? "end" : ""}">${trig}${isOpen ? calPop(d) : ""}</div>`;
}
function month(y, m, nav) {
  const r = F().range, first = (new Date(Date.UTC(y, m, 1)).getUTCDay() + 6) % 7, n = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  let cells = "<span></span>".repeat(first);
  for (let dd = 1; dd <= n; dd++) {
    const s = iso(y, m, dd), to = r.to || r.from;
    const cls = [s === r.from && "start", s === to && "end", r.from && s > r.from && s < to && "in", s === TODAY && "today"].filter(Boolean).join(" ");
    cells += `<button type="button" class="day ${cls}" data-day="${s}" aria-label="${dd} ${MONTH[m]} ${y}" aria-pressed="${!!(r.from && s >= r.from && s <= to)}"${s === TODAY ? ' aria-current="date"' : ""}><span>${dd}</span></button>`;
  }
  const prev = nav.includes("p") ? `<button type="button" class="btn icon small prev" data-cal="-1" aria-label="Previous month">${icon("chevL")}</button>` : "";
  const next = nav.includes("n") ? `<button type="button" class="btn icon small next" data-cal="1" aria-label="Next month">${icon("chevR")}</button>` : "";
  return `<div class="month"><div class="mhead">${prev}<span>${MONTH[m]} ${y}</span>${next}</div><div class="wk" aria-hidden="true"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div><div class="days">${cells}</div></div>`;
}
const ym = (k) => { const t = S.cal.y * 12 + S.cal.m + k; return [Math.floor(t / 12), t % 12]; };
const presetBtns = () => PRESETS.map(([l, a, b], i) => `<button type="button" class="pre" data-preset="${i}" aria-pressed="${F().range.from === a && F().range.to === b}">${l}</button>`).join("");
const rangeLine = (d) => { const r = F().range; return r.from ? `<b class="num">${rangeText(r)}</b>${r.to ? ` · ${days(r)} days` : " · pick the end date"}` : `Any ${d.dateLabel.toLowerCase()}`; };
function calPop(d) {
  return `<div class="pop calpop" role="dialog" aria-label="${d.dateLabel} range"><div class="presets"><div class="pt">Quick ranges</div>${presetBtns()}</div>
    <div><div class="months">${month(...ym(0), "p")}${month(...ym(1), "n")}</div>
    <div class="calfoot"><span class="what">${rangeLine(d)}</span><button type="button" class="btn ghost small" data-clear="range">Clear</button><button type="button" class="btn pri small" data-close>Done</button></div></div></div>`;
}
function chips(d) {
  const f = F(), out = [];
  if (f.status !== defStatus()) out.push(["status", "Status", d.statuses.find(([v]) => v === f.status)[1]]);
  if (f.cust) out.push(["cust", d.pick[1], f.cust]);
  if (f.range.from) out.push(["range", d.dateLabel, rangeText(f.range)]);
  return out.map(([k, label, v]) => `<button type="button" class="chip" data-clear="${k}" aria-label="Remove the filter ${label} ${esc(v)}"><span class="k">${label}</span><b class="num">${esc(v)}</b>${icon("x")}</button>`).join("");
}
function table(d, list) {
  const head = d.cols.map(([k, h, , cls = ""]) => {
    const on = S.sort.key === k, aria = on ? ` aria-sort="${S.sort.dir === "asc" ? "ascending" : "descending"}"` : "";
    return `<th scope="col" class="${cls.includes("r") ? "r" : ""}"${aria}><button type="button" class="sort" data-sort="${k}">${h}${icon(on ? (S.sort.dir === "asc" ? "arrowUp" : "arrowDown") : "upDown")}</button></th>`;
  }).join("");
  const sortName = d.cols.find(([k]) => k === S.sort.key)[1];
  if (!list.length) return `<table><thead><tr>${head}</tr></thead></table>${empty(d)}`;
  return `<table><caption class="sr">${d.title}, sorted by ${sortName}</caption><thead><tr>${head}</tr></thead><tbody>${list.map((r) => `<tr>${d.cols.map(([, , cell, cls = ""]) => `<td class="${cls}">${cell(r)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
const empty = (d) => `<div class="empty"><p><b>No ${d.one} matches these filters.</b></p><p class="muted sm">Change a filter, or clear them all.</p><button type="button" class="btn" data-clear="all">Clear filters</button></div>`;
const shownText = (d, list) => list.length === d.rows.length ? `Showing ${list.length} of ${d.match} ${d.many}` : `${list.length} ${list.length === 1 ? d.one : d.many}`;
const cfoot = (d, list) => `<div class="cfoot"><span class="num">${shownText(d, list)}</span>${list.length === d.rows.length ? '<button type="button" class="btn ghost small">Show more</button>' : ""}</div>`;
function cards(d, list) {
  if (!list.length) return empty(d);
  return `<ul class="cards" aria-label="${d.title}">${list.map((r) => { const [p, l1, l2] = d.card(r); return `<li><button type="button" class="cardrow"><span class="cr-main"><span class="cr-top"><span>${r.id}</span>${p}</span><span class="cr-sub">${l1}</span><span class="cr-sub num">${l2}</span><span class="cr-upd num">Updated ${stamp(r.upd)}</span></span>${icon("chevR", "cr-chev")}</button></li>`; }).join("")}</ul>`;
}
const sortLine = (d, list) => { const name = d.cols.find(([k]) => k === S.sort.key)[1], desc = S.sort.dir === "desc";
  return `<span class="num">${shownText(d, list)}</span><button type="button" class="m-sort" data-sort="${S.sort.key}" aria-label="Sort: ${name}, ${desc ? "newest first" : "oldest first"}">${icon(desc ? "arrowDown" : "arrowUp")}${name}, ${desc ? "newest" : "oldest"}</button>`; };

// The fields of the Filters sheet (phone) and the Filters panel (variant B desktop). One set of labels, all above.
function fields(d, ctx) {
  const statusPart = S.variant === "A" ? seg(d, "block") : statusList(d);
  const cal = ctx === "panel" || S.sub === "date" ? `<div class="${ctx === "panel" ? "" : "inline"}">${month(...ym(1), "pn")}</div>` : "";
  const datePart = `<div class="fld"><span class="lbl">${d.dateLabel}</span>${S.variant === "B" ? `<div class="prechips">${presetBtns()}</div>` : ""}${ctx === "panel" ? `<div class="sm muted">${rangeLine(d)}</div>` : dateCtl(d, "block", false)}${cal}</div>`;
  const statusFld = `<div class="fld"><span class="lbl">Status</span>${statusPart}</div>`;
  const custFld = `<div class="fld"><span class="lbl">${d.pick[1]}</span>${custCtl("block", false)}</div>`;
  if (ctx === "panel") return `<div class="bp-grid"><div class="bp-col">${statusFld}${custFld}</div><div class="bp-col">${datePart}</div></div>`;
  return statusFld + custFld + datePart;
}
function sheet(d) {
  const n = rows().length;
  return `<div class="sheet-scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h"><div class="grab" aria-hidden="true"></div>
    <div class="sheet-h"><h2 id="sheet-h">Filters</h2><button type="button" class="btn icon ghost" data-close aria-label="Close the filters">${icon("x", "lg")}</button></div>
    <div class="sheet-b">${fields(d, "sheet")}</div>
    <div class="sheet-f"><button type="button" class="btn" data-clear="all" ${nSet() ? "" : 'aria-disabled="true"'}>Clear all</button><button type="button" class="btn pri" data-close>Show ${n} ${n === 1 ? d.one : d.many}</button></div></div>`;
}

// ---------- The three variants ----------
const clearBtn = (label, cls = "") => `<button type="button" class="btn ghost ${cls} clr" data-clear="all" ${nSet() ? "" : 'aria-disabled="true"'}>${label}</button>`;
const VARIANTS = {
  A: {
    name: "One toolbar row",
    desktop: (d, list) => `<div class="hdr"><div class="va-bar">${searchBox(d)}${seg(d)}${custCtl()}${dateCtl(d)}${clearBtn("Clear filters")}</div>
      ${nSet() ? `<div class="va-active"><span class="lbl">Filtered by</span>${chips(d)}</div>` : ""}</div>
      <div class="card">${table(d, list)}${cfoot(d, list)}</div>`,
    phone: (d, list) => `<div class="m-row">${searchBox(d, "", "Search")}${filtersBtn()}</div>${nSet() ? `<div class="m-chips">${chips(d)}</div>` : ""}
      <div class="m-meta">${sortLine(d, list)}</div><div class="card">${cards(d, list)}</div>`,
  },
  B: {
    name: "Search and one Filters panel",
    desktop: (d, list) => `<div class="hdr"><div class="vb-row">${searchBox(d)}<div class="pw">${filtersBtn()}${S.open === "filters" ? `<div class="pop bpanel" role="dialog" aria-label="Filters">${fields(d, "panel")}<div class="bp-foot"><button type="button" class="btn ghost small" data-clear="all">Clear all</button><button type="button" class="btn pri small" data-close>Done</button></div></div>` : ""}</div>
      ${nSet() ? `<span class="sep" aria-hidden="true"></span>${chips(d)}${clearBtn("Clear all", "small")}` : ""}</div></div>
      <div class="card">${table(d, list)}${cfoot(d, list)}</div>`,
    phone: (d, list) => `${searchBox(d, "m-search")}<div class="rail">${filtersBtn()}${chips(d)}</div>
      <div class="m-meta">${sortLine(d, list)}</div><div class="card">${cards(d, list)}</div>`,
  },
  C: {
    name: "Status tabs on the table",
    desktop: (d, list) => `<div class="card c">${tabs(d)}<div class="cbar">${searchBox(d, "small", d.searchPh || d.searchLabel)}${custCtl("small")}${dateCtl(d, "small")}${clearBtn("Clear filters", "small")}</div>${table(d, list)}${cfoot(d, list)}</div>`,
    phone: (d, list) => { const st = d.statuses.find(([v]) => v === F().status);
      return `<div class="card"><div class="c-mhead"><h2>${st[0] === "all" ? `All ${d.many}` : st[1]} <span class="num">${st[2]}</span></h2>${filtersBtn("small")}</div>
      <div class="c-msearch">${searchBox(d, "m-search")}</div><div class="m-meta c-mmeta">${sortLine(d, list)}</div><div style="border-top:1px solid var(--border)">${cards(d, list)}</div></div>`; },
  },
};

// ---------- Page ----------
function switcher() {
  const v = S.variant;
  return `<div id="sw" role="toolbar" aria-label="Prototype switcher"><button type="button" class="arr" data-step="-1" aria-label="Previous variant">${icon("chevL")}</button>
    <span class="name" aria-live="polite"><b>${v}</b>(${VARIANTS[v].name})</span><button type="button" class="arr" data-step="1" aria-label="Next variant">${icon("chevR")}</button>
    <span class="tg" role="group" aria-label="Screen"><button type="button" data-screen="payments" aria-pressed="${S.screen === "payments"}">Payments</button><button type="button" data-screen="invoices" aria-pressed="${S.screen === "invoices"}">Invoices</button><button type="button" data-screen="documents" aria-pressed="${S.screen === "documents"}">Documents</button></span>
    <span class="tg" role="group" aria-label="Width"><button type="button" data-width="desktop" aria-pressed="${S.width === "desktop"}">Desktop</button><button type="button" data-width="phone" aria-pressed="${S.width === "phone"}">Phone</button></span></div>`;
}
const root = document.getElementById("root");
function render() {
  const a = document.activeElement, k = a?.dataset?.k, pos = k ? a.selectionStart : 0;
  const d = D(), list = rows(), V = VARIANTS[S.variant];
  document.body.classList.toggle("phone", S.width === "phone");
  document.title = `PROTOTYPE: ${d.title} filters, variant ${S.variant}`;
  const html = S.width === "phone"
    ? `<div class="frame"><div class="scroller"><div class="m-top"><button type="button" class="btn icon ghost" aria-label="Open the menu">${icon("menu", "lg")}</button><h1>${d.title}</h1>${d.action ? `<button type="button" class="btn pri up">${icon("upload")}${d.action}</button>` : ""}</div>
        <div class="m-body"><p class="meta">${d.meta}</p>${strip(d, "m")}${V.phone(d, list)}</div></div>${S.open === "sheet" ? sheet(d) : ""}</div>`
    : `<div class="shell">${sidebar(d.nav)}<main class="main"><header class="ph"><div><h1>${d.title}</h1><p class="meta">${d.meta}</p></div>${d.action ? `<button type="button" class="btn pri">${icon("upload")}${d.action}</button>` : ""}</header>${strip(d)}${V.desktop(d, list)}</main></div>`;
  root.innerHTML = html + (S.chrome ? switcher() : "");
  if (k) { const el = root.querySelector(`[data-k="${k}"]`); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
  const u = new URLSearchParams(location.search);
  u.set("variant", S.variant); u.set("screen", S.screen); u.set("width", S.width); u.delete("open");
  history.replaceState(null, "", "?" + u.toString());
}

// ---------- Events ----------
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (S.open && S.open !== "sheet" && !e.target.closest(".pop,[data-open]")) { S.open = null; S.sub = null; if (!t) return render(); }
  if (!t) return;
  const ds = t.dataset, f = F();
  if (ds.step) S.variant = VKEYS[(VKEYS.indexOf(S.variant) + +ds.step + 3) % 3];
  else if (ds.screen) { S.screen = ds.screen; S.open = null; S.sub = null; }
  else if (ds.width) { S.width = ds.width; S.open = null; S.sub = null; }
  else if (ds.open) { S.open = S.open === ds.open ? null : ds.open; S.sub = null; S.custQ = ""; }
  else if (ds.sub) S.sub = S.sub === ds.sub ? null : ds.sub;
  else if ("close" in ds) { S.open = null; S.sub = null; }
  else if (ds.status) f.status = ds.status;
  else if ("cust" in ds) { f.cust = ds.cust; if (S.open === "cust") S.open = null; S.sub = null; S.custQ = ""; }
  else if (ds.day) { const r = f.range, x = ds.day; f.range = !r.from || r.to ? { from: x } : x < r.from ? { from: x, to: r.from } : { from: r.from, to: x }; }
  else if (ds.preset) { const [, a, b] = PRESETS[+ds.preset]; f.range = { from: a, to: b }; }
  else if (ds.cal) { const t2 = S.cal.y * 12 + S.cal.m + +ds.cal; S.cal = { y: Math.floor(t2 / 12), m: t2 % 12 }; }
  else if (ds.clear) {
    if (t.getAttribute("aria-disabled") === "true") return;
    if (ds.clear === "all" || ds.clear === "status") f.status = defStatus();
    if (ds.clear === "all" || ds.clear === "cust") f.cust = "";
    if (ds.clear === "all" || ds.clear === "range") f.range = {};
    if (ds.clear === "all") f.q = "";
  }
  else if (ds.sort) S.sort = S.sort.key === ds.sort ? { key: ds.sort, dir: S.sort.dir === "desc" ? "asc" : "desc" } : { key: ds.sort, dir: "desc" };
  else return;
  render();
});
document.addEventListener("input", (e) => {
  const k = e.target.dataset?.k; if (!k) return;
  if (k === "q") F().q = e.target.value; else S.custQ = e.target.value;
  render();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.open) { S.open = null; S.sub = null; return render(); }
  const tag = document.activeElement?.tagName;
  if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !["INPUT", "TEXTAREA", "SELECT"].includes(tag) && !document.activeElement?.isContentEditable) {
    S.variant = VKEYS[(VKEYS.indexOf(S.variant) + (e.key === "ArrowRight" ? 1 : 2)) % 3]; render();
  }
});
render();
</script>
</body>
</html>
