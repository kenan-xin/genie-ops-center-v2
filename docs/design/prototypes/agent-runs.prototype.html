<!DOCTYPE html>
<!-- PROTOTYPE, throwaway. Question: where does a person see their background agent runs (DEC-57)?
     Three variants on the real shell, switched by ?variant=A|B|C and the bottom bar.
     A: sidebar row + popover. B: floating dock. C: a Runs page.
     D: no run list; the Ask chat history is the list, a working chat shows a spinner, and the
     Ask nav row carries the same spinner on every page (owner idea, 2026-11-13).
     E: D grouped by agent (Ask, Slides, Dashboards), like Codex groups by project; a Slides or
     Dashboards chat opens on its record page with the agent panel, so its context is the page.
     State is in memory. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Background runs, prototype</title>
<style>
  :root {
    --primary: #2563eb; --primary-fg: #fff; --info-tint: #eff6ff;
    --page: #fff; --panel: #f9fafb; --tile: #f3f4f6; --hairline: #e5e7eb;
    --control-border: #d1d5db; --input: #6b7280; --muted: #6b7280;
    --secondary: #4b5563; --idle: #374151; --control-fg: #1f2937; --heading: #111827;
    --success: #047857; --success-tint: #ecfdf5; --danger-text: #b91c1c; --danger-tint: #fef2f2;
    --warning: #92400e; --warning-tint: #fffbeb;
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: var(--font); color: var(--heading); background: var(--tile); font-size: 14px; }
  ::selection { background: #bfdbfe; }
  /* A thin, quiet scrollbar like the Codex sidebar: no track, a gray thumb that darkens on hover. */
  /* Chromium uses the standard properties when set and then ignores the ::-webkit rules, which
     keeps its arrow buttons; so the standard pair applies only where ::-webkit is unknown (Firefox). */
  @supports not selector(::-webkit-scrollbar) { * { scrollbar-width: thin; scrollbar-color: var(--control-border) transparent; } }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--control-border); border-radius: 9999px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  *::-webkit-scrollbar-button { display: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #111827; color: #e5e7eb; font-size: 12px; flex-wrap: wrap; }
  .bar b { color: #fff; }
  .seg { display: inline-flex; background: #1f2937; border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; color: #d1d5db; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: #fff; color: #111827; }
  .bar .sp { flex: 1; }
  .stage { height: calc(100% - 44px); overflow: hidden; display: grid; place-items: start center; padding: 10px; }

  .app { background: var(--page); border: 1px solid var(--hairline); border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 220px 1fr; width: 1240px; height: 700px; box-shadow: 0 8px 24px rgba(17,24,39,.08); position: relative; }
  .app.phone { grid-template-columns: 1fr; width: 390px; height: 780px; }
  .side { background: var(--panel); border-right: 1px solid var(--hairline); padding: 14px 8px 10px; display: flex; flex-direction: column; gap: 2px; position: relative; }
  .phone .side { display: none; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 14px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--primary); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; }
  .brand small { display: block; color: var(--muted); font-size: 12px; }
  .cat { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); padding: 10px 12px 6px; text-transform: uppercase; }
  .nav { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 8px; color: var(--idle); border: 1px solid transparent; background: none; width: 100%; text-align: left; }
  .nav:hover { background: var(--tile); }
  .nav.on { background: var(--page); color: var(--primary); border-color: var(--hairline); font-weight: 600; }
  .nav .count { margin-left: auto; }
  .grow { flex: 1; }
  .user { display: flex; align-items: center; gap: 10px; padding: 10px 8px 0; border-top: 1px solid var(--hairline); margin-top: 8px; }
  .av { width: 32px; height: 32px; border-radius: 50%; background: var(--tile); display: grid; place-items: center; font-weight: 600; font-size: 12px; color: var(--idle); }
  .user small { display: block; color: var(--muted); font-size: 12px; }

  .count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 9999px; background: var(--primary); color: var(--primary-fg); font-size: 12px; font-weight: 600; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
  .count.done { background: var(--success-tint); color: var(--success); }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: none; }
  .live.on { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .topbar { display: none; height: 54px; border-bottom: 1px solid var(--hairline); align-items: center; gap: 10px; padding: 0 10px; }
  .phone .topbar { display: flex; }
  .topbar .title { flex: 1; font-weight: 600; font-size: 16px; }
  .icon-btn { width: 44px; height: 44px; border: 0; background: none; border-radius: 8px; display: grid; place-items: center; color: var(--idle); position: relative; }
  .icon-btn:hover { background: var(--tile); }
  .icon-btn .count { position: absolute; top: 4px; right: 2px; height: 18px; min-width: 18px; font-size: 12px; padding: 0 5px; }
  .content { flex: 1; overflow: auto; padding: 20px 28px; }
  .phone .content { padding: 14px 16px; }
  .crumb { color: var(--secondary); font-size: 14px; }
  h1 { font-size: 20px; letter-spacing: -.025em; margin: 2px 0 4px; }
  .sub { color: var(--secondary); font-size: 14px; margin: 0 0 18px; }
  .ghost-rows div { height: 44px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 12px; color: var(--idle); }
  .ghost-rows span { color: var(--secondary); margin-left: auto; font-size: 14px; }

  /* A run row, shared by all variants */
  .run { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; padding: 12px 14px; border-bottom: 1px solid var(--hairline); align-items: start; }
  .run:last-child { border-bottom: 0; }
  .run .ic { width: 28px; height: 28px; border-radius: 8px; background: var(--tile); display: grid; place-items: center; color: var(--idle); grid-row: span 2; }
  .run a { color: var(--heading); font-weight: 600; text-decoration: none; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run .right .pill { display: none; }
  .run .meta .pill { margin-right: 6px; vertical-align: 1px; }
  .run a:hover { color: var(--primary); text-decoration: underline; text-underline-offset: 3px; }
  .run .meta { grid-column: 2 / 4; color: var(--secondary); font-size: 12px; line-height: 1.45; }
  .run .step { color: var(--idle); }
  .run .who { color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 9999px; padding: 2px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.working { background: var(--info-tint); color: #1d4ed8; }
  .pill.working .dot { animation: pulse 1.2s ease-in-out infinite; }
  .pill.finished { background: var(--success-tint); color: var(--success); }
  .pill.stopped { background: var(--tile); color: var(--idle); }
  .pill.failed { background: var(--danger-tint); color: var(--danger-text); }
  .pill.timeout { background: var(--warning-tint); color: var(--warning); }
  .stop { border: 1px solid var(--control-border); background: var(--page); color: var(--control-fg); border-radius: 8px; height: 32px; padding: 0 10px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .stop:hover { background: var(--panel); }
  .phone .stop { height: 40px; }
  .run .right { display: flex; align-items: center; gap: 8px; }
  .group-h { padding: 10px 14px 6px; font-size: 12px; font-weight: 600; color: var(--secondary); display: flex; justify-content: space-between; }
  .empty { padding: 28px 16px; text-align: center; color: var(--secondary); }

  /* Variant A: sidebar row + popover */
  .pop { position: absolute; left: 228px; bottom: 64px; width: 400px; max-height: 520px; overflow: auto; background: var(--page); border: 1px solid var(--hairline); border-radius: 12px; box-shadow: 0 12px 32px rgba(17,24,39,.16); z-index: 5; animation: rise .22s var(--ease); }
  .pop-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--hairline); position: sticky; top: 0; background: var(--page); }
  .pop-h b { font-size: 16px; }
  .pop-h small { color: var(--muted); font-size: 12px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .scrim { position: absolute; inset: 0; background: rgba(17,24,39,.32); z-index: 4; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 78%; overflow: auto; background: var(--page); border-radius: 12px 12px 0 0; z-index: 5; animation: rise .26s var(--ease); }
  .grab { width: 36px; height: 4px; border-radius: 9999px; background: var(--control-border); margin: 8px auto 2px; }

  /* Variant B: floating dock */
  .dock { position: absolute; right: 18px; bottom: 18px; z-index: 5; }
  .dock-pill { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 12px; border-radius: 9999px; background: var(--heading); color: #fff; border: 0; box-shadow: 0 8px 20px rgba(17,24,39,.22); font-weight: 600; }
  .dock-pill .live { background: #93c5fd; }
  .dock-pill .fin { color: #6ee7b7; font-weight: 600; }
  .dock-card { width: 380px; max-height: 480px; overflow: auto; background: var(--page); border: 1px solid var(--hairline); border-radius: 12px; box-shadow: 0 16px 40px rgba(17,24,39,.2); animation: rise .22s var(--ease); }
  .phone .dock { right: 12px; left: 12px; bottom: 12px; }
  .phone .dock-pill { margin-left: auto; }
  .phone .dock-card { width: 100%; }
  .dock-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }

  /* Variant C: a Runs page */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin-bottom: 4px; }
  .tab { border: 0; background: none; padding: 10px 12px; font-weight: 600; color: var(--secondary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--heading); border-bottom-color: var(--heading); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--secondary); padding: 10px 12px; border-bottom: 1px solid var(--hairline); background: var(--panel); }
  td { padding: 12px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  td a { color: var(--heading); font-weight: 600; text-decoration: none; }
  td .meta { color: var(--secondary); font-size: 12px; margin-top: 2px; }
  td.num { color: var(--secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl { border: 1px solid var(--hairline); border-radius: 12px; overflow: hidden; }
  .phone .tbl { border: 0; }
  .phone table, .phone thead { display: none; }
  .cards { display: none; }
  .phone .cards { display: block; border: 1px solid var(--hairline); border-radius: 12px; }
  .note { margin-top: 14px; color: var(--secondary); font-size: 12px; display: flex; gap: 8px; align-items: flex-start; }

  /* Variant D: the chat history is the run list */
  .spin { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid #bfdbfe; border-top-color: var(--primary); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fresh-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: none; }
  .ask { display: grid; grid-template-columns: 272px 1fr; height: 100%; min-height: 0; }
  .phone .ask { grid-template-columns: 1fr; }
  .hist { border-right: 1px solid var(--hairline); display: flex; flex-direction: column; min-height: 0; padding: 14px 0 0; }
  .phone .hist { border-right: 0; }
  .hist-h { display: flex; align-items: center; justify-content: space-between; padding: 0 14px 10px; }
  .hist-h b { font-size: 16px; }
  .newchat { border: 1px solid var(--control-border); background: var(--page); border-radius: 8px; height: 32px; padding: 0 10px; font-weight: 600; font-size: 14px; }
  .search { margin: 0 12px 4px; height: 36px; border: 1px solid var(--input); border-radius: 8px; padding: 0 10px; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .hist nav { overflow: auto; padding: 0 12px 12px; }
  .hist h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0; padding: 14px 10px 6px; }
  .chat { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--idle); border: 1px solid transparent; background: none; width: 100%; text-align: left; }
  .phone .chat { height: 44px; }
  .chat:hover { background: var(--panel); }
  .chat.cur { background: var(--panel); border-color: var(--hairline); color: var(--heading); font-weight: 600; }
  .chat .t { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat .kind { color: var(--muted); display: inline-flex; }
  .chat.unseen .t { color: var(--heading); font-weight: 600; }
  .conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .phone .conv.open { display: flex; height: 100%; }
  .phone .conv:not(.open) { display: none; }
  .back { border: 0; background: none; color: var(--idle); display: inline-flex; align-items: center; gap: 4px; font-weight: 600; padding: 0; height: 44px; }
  .conv-h { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--hairline); }
  .conv-h .t { flex: 1; font-weight: 600; font-size: 16px; }
  .conv-h .rec { color: var(--primary); font-weight: 600; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .msgs { flex: 1; overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .you { align-self: flex-end; max-width: 70%; background: var(--panel); border-radius: 12px; padding: 10px 12px; line-height: 1.5; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; color: var(--secondary); }
  .steps li { display: flex; gap: 8px; align-items: center; }
  .steps li.now { color: var(--heading); font-weight: 600; }
  .ok { color: var(--success); }
  .composer { border-top: 1px solid var(--hairline); padding: 12px 20px; }
  .composer div { border: 1px solid var(--input); border-radius: 8px; padding: 10px 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .nav .spin { margin-left: auto; }
  /* A group header is a row like Codex's project row: same height and text size as a chat, the
     agent's icon in a fixed 16 px slot, and the chats indented so their text starts under the name. */
  .agent-h { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; margin-top: 6px; padding: 0 10px; border: 0; border-radius: 8px; background: none; font-size: 14px; font-weight: 600; color: var(--heading); text-align: left; }
  .agent-h:first-child { margin-top: 2px; }
  .agent-h:hover { background: var(--panel); }
  .agent-h > svg.i { color: var(--idle); }
  .agent-h .spin { margin-left: auto; }
  .agent-h .chev { margin-left: auto; display: inline-flex; color: var(--muted); opacity: 0; transition: opacity .15s, transform .15s; }
  .agent-h .spin + .chev { margin-left: 6px; }
  .agent-h:hover .chev, .agent-h:focus-visible .chev, .agent-h[aria-expanded="false"] .chev { opacity: 1; }
  .agent-h[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  .phone .agent-h { height: 40px; }
  .phone .agent-h .chev { opacity: 1; }
  .group .chat { height: 32px; padding-left: 34px; }
  .phone .group .chat { height: 44px; }
  .more { display: block; width: 100%; height: 32px; padding: 0 10px 0 34px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 14px; text-align: left; }
  .more:hover { background: var(--panel); color: var(--idle); }
  .recents-h { border-top: 1px solid var(--hairline); margin-top: 10px !important; padding-top: 14px !important; }
  .bars { margin-top: 14px; border: 1px solid var(--hairline); border-radius: 12px; padding: 18px; display: grid; gap: 10px; }
  .bars div { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; font-size: 14px; color: var(--idle); }
  .bars i { display: block; height: 14px; border-radius: 6px; background: var(--primary); }
  .rec-meta { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .deckpage { display: grid; grid-template-columns: 1fr 340px; height: 100%; min-height: 0; }
  .phone .deckpage { grid-template-columns: 1fr; position: relative; }
  .phone .deckpage .content { padding-bottom: calc(52% + 16px); }
  .deckpage .canvas { aspect-ratio: 16/9; border: 1px solid var(--hairline); border-radius: 12px; padding: 7%; margin-top: 14px; }
  .deckpage .canvas h2 { margin: 0; font-size: 20px; letter-spacing: -.025em; }
  .deckpage .canvas hr { border: 0; height: 3px; background: var(--primary); margin: 12px 0; }
  .panel { border-left: 1px solid var(--hairline); display: flex; flex-direction: column; min-height: 0; }
  .phone .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 52%; border-left: 0; border-top: 1px solid var(--hairline); border-radius: 12px 12px 0 0; background: var(--page); box-shadow: 0 -8px 24px rgba(17,24,39,.12); }
  .panel-h { padding: 10px 14px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 8px; }
  .panel-h small { display: block; color: var(--muted); font-size: 12px; }
  .panel .msgs { padding: 14px; }
  .ctx { align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--secondary); background: var(--panel); border: 1px solid var(--hairline); border-radius: 9999px; padding: 2px 8px; }
  .legend { margin: 10px 12px 0; padding: 10px 12px; border-radius: 8px; background: var(--info-tint); color: #1e3a8a; font-size: 12px; line-height: 1.45; }

  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .pop, .sheet, .dock-card { animation: none; } .live.on, .pill.working .dot { animation: none; } }
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Prototype controls">
  <b>Background runs</b>
  <div class="seg" id="variant">
    <button data-v="A">A Sidebar</button><button data-v="B">B Dock</button><button data-v="C">C Runs page</button><button data-v="D">D Chat history</button><button data-v="E">E By agent</button>
  </div>
  <div class="seg" id="role"><button data-r="member">Member</button><button data-r="admin">Administrator</button></div>
  <div class="seg" id="open"><button data-o="closed">Closed</button><button data-o="open">Open</button></div>
  <span class="sp"></span>
  <div class="seg" id="size"><button data-s="desktop">Desktop</button><button data-s="phone">Phone</button></div>
</div>
<div class="stage"><div class="app" id="app"></div></div>

<script>
const P = {
  runs: '<path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="10"/>',
  deck: '<path d="M2 3h20M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3M7 21l5-5 5 5"/>',
  chart: '<path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/>',
  doc: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  ask: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  inv: '<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M12 6v12M15 9h-4.5a1.5 1.5 0 0 0 0 3h3a1.5 1.5 0 0 1 0 3H9"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
  close: '<path d="M18 6 6 18M6 6l12 12"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  spark: '<path d="M9.94 14.06 4 20M12 3v4M12 17v4M3 12h4M17 12h4"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  ok: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  send: '<path d="m5 12 7-7 7 7M12 19V5"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

const MINE = [
  { id: 1, kind: 'deck', title: 'October collections update', status: 'working', step: 'Drafting slide 4: Next steps for November', time: 'Started 6 min ago' },
  { id: 2, kind: 'chart', title: 'Overdue invoices by customer', status: 'working', step: 'Reading 1,240 invoices', time: 'Started 2 min ago' },
  { id: 3, kind: 'deck', title: 'Q3 board summary', status: 'finished', step: '9 slides drafted', time: 'Finished 14 min ago', fresh: true },
  { id: 4, kind: 'chart', title: 'Payments forecast', status: 'timeout', step: 'Reached the 2-hour limit after 6 charts', time: 'Ended 3 h ago' },
  { id: 5, kind: 'deck', title: 'Supplier onboarding', status: 'stopped', step: 'Stopped by you, 3 slides kept', time: 'Ended yesterday, 16:40' },
];
const OTHERS = [
  { id: 11, kind: 'deck', title: 'Vendor risk review', status: 'working', owner: 'Priya Nair', step: '', time: 'Started 1 h 52 min ago' },
  { id: 12, kind: 'chart', title: 'Cash position', status: 'failed', owner: 'Daniel Okafor', step: '', time: 'Ended 40 min ago' },
];
const LABEL = { working: 'Working', finished: 'Finished', stopped: 'Stopped', failed: 'Did not finish', timeout: 'Time limit' };

const q = new URLSearchParams(location.search);
const state = { onAsk: true, cur: 6, phoneOpen: false, recordChat: null, expanded: {}, all: {}, v: q.get('variant') || 'A', role: 'member', open: true, size: 'desktop', mine: MINE.map(r => ({ ...r })), others: OTHERS.map(r => ({ ...r })), seen: false, tab: 'mine' };
const app = document.getElementById('app');

const active = () => state.mine.filter(r => r.status === 'working').length;
const fresh = () => state.seen ? 0 : state.mine.filter(r => r.fresh).length;

function row(r, admin) {
  // An administrator sees the record, status, owner and time, never the step text (DEC-57 item 10).
  const stepText = admin ? '' : `<span class="step">${r.step}</span><br>`;
  // The pill sits first on the meta line, so the title gets the full width.
  const who = r.owner ? `<span class="who">${r.owner}</span> &middot; ` : '';
  const stop = r.status === 'working' ? `<button class="stop" data-stop="${r.id}" aria-label="Stop ${r.title}">${ic('stop')}Stop</button>` : '';
  return `<div class="run"><span class="ic">${ic(r.kind)}</span>
    <div><a href="#">${r.title}</a></div>
    <div class="right"><span class="pill ${r.status}"><span class="dot"></span>${LABEL[r.status]}</span>${stop}</div>
    <div class="meta"><span class="pill ${r.status}"><span class="dot"></span>${LABEL[r.status]}</span>${stepText}${who}${r.time}</div></div>`;
}

function list(admin) {
  const rows = state.mine;
  const on = rows.filter(r => r.status === 'working'), off = rows.filter(r => r.status !== 'working');
  let html = '';
  html += `<div class="group-h"><span>Working (${on.length})</span><span>Up to 3 at once</span></div>` + (on.length ? on.map(r => row(r)).join('') : '<div class="empty">No run is working.</div>');
  html += `<div class="group-h"><span>Ended in the last 24 hours</span></div>` + off.map(r => row(r)).join('');
  if (admin) html += `<div class="group-h"><span>Everyone else</span><span>${ic('lock')} Messages hidden</span></div>` + state.others.map(r => row(r, true)).join('');
  return html;
}

function side(extraNav) {
  const n = active(), f = fresh();
  const runRow = state.v === 'A'
    ? `<button class="nav ${state.open ? 'on' : ''}" id="runs-btn" aria-expanded="${state.open}" aria-haspopup="dialog">${n ? '<span class="live on"></span>' : ic('runs')}Runs${f ? `<span class="count done" style="margin-left:auto">${f} finished</span>` : ''}${n ? `<span class="count" ${f ? 'style="margin-left:6px"' : ''}>${n}</span>` : ''}</button>`
    : '';
  return `<nav class="side" aria-label="Workspace">
    <div class="brand"><div class="logo">G</div><div><b>Genie</b><small>Workspace</small></div></div>
    <div class="cat">Workspace</div>
    <div class="nav ${'DE'.includes(state.v) && state.onAsk && !state.recordChat ? 'on' : ''}" ${'DE'.includes(state.v) ? 'id="ask-nav" role="button" tabindex="0"' : ''} ${'DE'.includes(state.v) && active() ? `aria-label="Ask, ${active()} working"` : ''}>${ic('ask')}Ask${'DE'.includes(state.v) && active() ? '<span class="spin" aria-hidden="true"></span>' : ''}</div>
    <div class="nav">${ic('doc')}Documents</div>
    <div class="nav">${ic('inv')}Invoices</div>
    <div class="nav ${state.v === 'C' || ('DE'.includes(state.v) && state.onAsk && !state.recordChat) || state.recordChat?.kind === 'chart' ? '' : 'on'}" ${'DE'.includes(state.v) ? 'id="slides-nav" role="button" tabindex="0"' : ''}>${ic('deck')}Slides</div>
    ${extraNav || ''}
    <div class="grow"></div>
    ${runRow}
    <div class="user"><div class="av">AL</div><div><b>Alex Lim</b><small>${state.role === 'admin' ? 'Tenant administrator' : 'Workspace member'}</small></div></div>
  </nav>`;
}

function topbar(title) {
  const n = active(), f = fresh();
  const btn = state.v === 'A' ? `<button class="icon-btn" id="runs-btn" aria-label="Runs, ${n} working">${ic('runs')}${n ? `<span class="count">${n}</span>` : ''}</button>` : '';
  // D on a phone: the navigation is in a drawer, so the menu button carries the spinner.
  const menuSpin = 'DE'.includes(state.v) && n ? '<span class="live on" style="position:absolute;top:9px;right:9px;box-shadow:0 0 0 2px var(--page)" aria-hidden="true"></span>' : '';
  return `<div class="topbar"><button class="icon-btn" aria-label="Open navigation${'DE'.includes(state.v) && n ? `, ${n} chats working` : ''}">${ic('menu')}${menuSpin}</button><span class="title">${title}</span>${btn}<button class="icon-btn" aria-label="Agent">${ic('spark')}</button></div>`;
}

const PAGE = `<div class="crumb">Workspace</div><h1>Slides</h1><p class="sub">Your own decks of slides. Only you can open them.</p>
  <div class="ghost-rows"><div>${ic('deck')}Collections review<span>2 slides</span></div><div>${ic('deck')}Q3 board summary<span>9 slides</span></div><div>${ic('deck')}Supplier onboarding<span>3 slides</span></div><div>${ic('deck')}October collections update<span>3 slides, drafting</span></div></div>`;

function variantA() {
  const phone = state.size === 'phone';
  const admin = state.role === 'admin';
  const head = `<div class="pop-h"><div><b>Runs</b><br><small>${admin ? 'Yours, then everyone in this deployment' : 'Your agent work in the background'}</small></div><button class="icon-btn" id="close" aria-label="Close">${ic('close')}</button></div>`;
  const panel = !state.open ? '' : phone
    ? `<div class="scrim" id="close-scrim"></div><div class="sheet" role="dialog" aria-label="Runs"><div class="grab"></div>${head}${list(admin)}</div>`
    : `<div class="pop" role="dialog" aria-label="Runs">${head}${list(admin)}</div>`;
  return side() + `<div class="main">${topbar('Slides')}<div class="content">${PAGE}</div></div>` + panel;
}

function variantB() {
  const admin = state.role === 'admin';
  const n = active(), f = fresh();
  const pill = `<button class="dock-pill" id="runs-btn" aria-expanded="${state.open}">${n ? '<span class="live on"></span>' : ''}${n} working${f ? ` <span class="fin">&middot; ${f} finished</span>` : ''}${ic('chev')}</button>`;
  const card = state.open ? `<div class="dock-card" role="dialog" aria-label="Runs"><div class="pop-h"><div><b>Runs</b><br><small>${admin ? 'Yours, then everyone in this deployment' : 'Your agent work in the background'}</small></div><button class="icon-btn" id="close" aria-label="Close">${ic('close')}</button></div>${list(admin)}</div>` : '';
  return side() + `<div class="main">${topbar('Slides')}<div class="content">${PAGE}</div><div class="dock"><div class="dock-wrap">${card}${pill}</div></div></div>`;
}

function variantC() {
  const admin = state.role === 'admin';
  const n = active(), f = fresh();
  const nav = `<div class="cat">You</div><button class="nav on" id="runs-btn">${n ? '<span class="live on"></span>' : ic('runs')}Runs${n ? `<span class="count">${n}</span>` : ''}</button>`;
  const rowsOf = (rows, adminView) => rows.map(r => `<tr><td><a href="#">${r.title}</a><div class="meta">${adminView ? '' : r.step}</div></td>${admin ? `<td>${r.owner || 'You'}</td>` : ''}<td><span class="pill ${r.status}"><span class="dot"></span>${LABEL[r.status]}</span></td><td class="num">${r.time}</td><td>${r.status === 'working' ? `<button class="stop" data-stop="${r.id}">${ic('stop')}Stop</button>` : ''}</td></tr>`).join('');
  const showOthers = admin && state.tab === 'all';
  const rows = showOthers ? state.others : state.mine;
  const tabs = admin ? `<div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="mine" aria-selected="${state.tab === 'mine'}">Mine</button><button class="tab" role="tab" data-tab="all" aria-selected="${state.tab === 'all'}">Everyone</button></div>` : '';
  const page = `<div class="crumb">You</div><h1>Runs</h1><p class="sub">Agent work that goes on in the background. Ended runs stay here for 24 hours.</p>${tabs}
    <div class="tbl"><table><thead><tr><th>Record</th>${admin ? '<th>Person</th>' : ''}<th>Status</th><th>Time</th><th></th></tr></thead><tbody>${rowsOf(rows, showOthers)}</tbody></table>
    <div class="cards">${rows.map(r => row(r, showOthers)).join('')}</div></div>
    ${showOthers ? `<p class="note">${ic('lock')}<span>You see the record, the person and the status. What they asked the agent stays private. Stopping a run writes an audit entry.</span></p>` : ''}`;
  return side(nav) + `<div class="main">${topbar('Runs')}<div class="content">${page}</div></div>`;
}

// Ask's chat history, with surface chats listed beside Ask chats. Each chat knows its run state.
const CHATS = [
  { id: 1, kind: 'deck', title: 'October collections update', group: 'Today', run: 'working' },
  { id: 2, kind: 'chart', title: 'Overdue invoices by customer', group: 'Today', run: 'working' },
  { id: 3, kind: 'deck', title: 'Q3 board summary', group: 'Today', run: 'finished', unseen: true },
  { id: 6, kind: 'ask', title: 'Who owes us the most this quarter?', group: 'Today' },
  { id: 4, kind: 'chart', title: 'Payments forecast', group: 'Earlier', run: 'timeout' },
  { id: 5, kind: 'deck', title: 'Supplier onboarding', group: 'Earlier' },
  { id: 7, kind: 'ask', title: 'Summarize the October payment runs', group: 'Earlier' },
  { id: 8, kind: 'deck', title: 'Collections review', group: 'Earlier' },
  { id: 9, kind: 'deck', title: 'Vendor scorecard', group: 'Earlier' },
  { id: 10, kind: 'ask', title: 'Which invoices are overdue?', group: 'Earlier' },
];

function chatRow(c, everyIcon) {
  const mark = c.run === 'working' ? '<span class="spin" role="img" aria-label="Working"></span>'
    : c.unseen ? '<span class="fresh-dot" role="img" aria-label="Finished, not opened yet"></span>' : '';
  // In Recents every row carries its agent's icon, Ask included, so the rows line up and read apart.
  const kind = c.kind === 'ask' && !everyIcon ? '' : `<span class="kind" title="${{ ask: 'Ask', deck: 'Slides', chart: 'Dashboards' }[c.kind]}">${ic(c.kind)}</span>`;
  return `<button class="chat ${c.id === state.cur ? 'cur' : ''} ${c.unseen ? 'unseen' : ''}" data-chat="${c.id}">${kind}<span class="t">${c.title}</span>${mark}</button>`;
}

function variantD() {
  const phone = state.size === 'phone';
  if (!state.onAsk) {
    return side() + `<div class="main">${topbar('Slides')}<div class="content">${PAGE}
      <p class="legend">The spinner on <b>Ask</b> in the menu means a chat of yours is working. Open Ask to see which one.</p></div></div>`;
  }
  const groups = ['Today', 'Earlier'].map(g => `<h3>${g}</h3>` + CHATS.filter(c => c.group === g).map(chatRow).join('')).join('');
  const c = CHATS.find(x => x.id === state.cur) || CHATS[0];
  const working = c.run === 'working';
  // On a phone the history and the chat share the screen: a tap opens the chat, Back returns.
  const conv = `<section class="conv ${phone && state.phoneOpen ? 'open' : ''}" aria-label="Conversation">
    <div class="conv-h">${phone ? `<button class="back" id="back" aria-label="Back to chats">${ic('back')}</button>` : ''}<span class="t">${c.title}</span>${c.kind === 'ask' ? '' : `<a class="rec" href="#">${ic(c.kind)}Open ${c.kind === 'deck' ? 'deck' : 'dashboard'}</a>`}
      ${working ? `<button class="stop" data-stopchat="${c.id}">${ic('stop')}Stop</button>` : ''}</div>
    <div class="msgs"><div class="you">A short update for the finance team on October collections.</div>
      <ul class="steps"><li><span class="ok">${ic('ok')}</span>Read the payments and invoices of October</li><li><span class="ok">${ic('ok')}</span>Named the deck</li>
      ${working ? '<li class="now"><span class="spin"></span>Drafting slide 4: Next steps for November</li>' : `<li><span class="ok">${ic('ok')}</span>${c.run === 'stopped' ? 'Stopped, work kept' : 'Drafted 4 slides'}</li>`}</ul></div>
    <div class="composer"><div><span>${working ? 'You can type while the agent works' : 'Ask for a change'}</span>${ic('send')}</div></div></section>`;
  const hist = `<aside class="hist" aria-label="Chat history"><div class="hist-h"><b>Chats</b><button class="newchat">New chat</button></div>
    <div class="search">${ic('search')}Search chats</div><nav aria-label="Chats">${groups}</nav></aside>`;
  return side() + `<div class="main">${topbar('Ask')}<div class="ask">${phone && state.phoneOpen ? conv : phone ? hist : hist + conv}</div></div>`;
}

// E: the same chats, grouped by the agent that owns them. Ask chats open in Ask; a Slides or a
// Dashboards chat opens on its record page, so its page context is there again.
const AGENTS = [
  { key: 'ask', label: 'Ask', icon: 'ask' },
  { key: 'deck', label: 'Slides', icon: 'deck', record: 'deck' },
  { key: 'chart', label: 'Dashboards', icon: 'chart', record: 'dashboard' },
];
const WHEN = { 1: '6 min', 2: '2 min', 3: '14 min', 6: '1 h', 4: '3 h', 5: 'Yesterday', 7: 'Mon' };

function variantE() {
  if (state.recordChat) return recordPage();
  if (!state.onAsk) {
    return side() + `<div class="main">${topbar('Slides')}<div class="content">${PAGE}
      <p class="legend">The spinner on <b>Ask</b> means a chat of yours is working. Ask lists your chats by agent.</p></div></div>`;
  }
  const phone = state.size === 'phone';
  // Inside an agent's group the agent is known, so a row drops its icon. A folded group keeps a
  // spinner when one of its chats works, so a run is never hidden by folding.
  const plain = c => chatRow(c).replace(/<span class="kind"[^>]*>.*?<\/svg><\/span>/, '');
  const sections = AGENTS.map(a => {
    const rows = CHATS.filter(c => c.kind === a.key);
    const open = state.expanded[a.key] !== false;
    const shown = state.all[a.key] ? rows : rows.slice(0, 3);
    const working = rows.some(c => c.run === 'working');
    // No count: the rows show it when open, and a folded group needs only "is anything working".
    const spin = !open && working ? '<span class="spin" role="img" aria-label="A chat is working"></span>' : '';
    return `<button class="agent-h" data-agent="${a.key}" aria-expanded="${open}" aria-controls="g-${a.key}">${ic(a.icon)}${a.label}${spin}<span class="chev">${ic('chev')}</span></button>`
      + (open ? `<div class="group" id="g-${a.key}" role="group" aria-label="${a.label} chats">${shown.map(plain).join('')}${rows.length > 3 && !state.all[a.key] ? `<button class="more" data-more="${a.key}">Show more</button>` : ''}</div>` : '');
  }).join('');
  // Recents sits at the bottom, as in Codex: the newest chats of every agent, each with its
  // agent's icon so a Slides chat reads apart from an Ask chat.
  const recents = `<h3 class="recents-h">Recents</h3>` + CHATS.slice(0, 6).map(c => chatRow(c, true)).join('');
  const c = CHATS.find(x => x.id === state.cur && x.kind === 'ask') || CHATS.find(x => x.kind === 'ask');
  const conv = `<section class="conv" aria-label="Conversation"><div class="conv-h"><span class="t">${c.title}</span></div>
    <div class="msgs"><div class="you">${c.title}</div><div style="color:var(--idle);line-height:1.55">Northwind Traders owes the most this quarter: SGD 48,900 across 6 invoices.</div></div>
    <div class="composer"><div><span>Ask a question</span>${ic('send')}</div></div></section>`;
  const hist = `<aside class="hist" aria-label="Chat history"><div class="hist-h"><b>Chats</b><button class="newchat">New chat</button></div>
    <div class="search">${ic('search')}Search chats</div><nav aria-label="Chats">${sections}${recents}</nav></aside>`;
  return side() + `<div class="main">${topbar('Ask')}<div class="ask">${hist}${phone ? '' : conv}</div></div>`;
}

function recordPage() {
  const c = state.recordChat;
  const a = AGENTS.find(x => x.key === c.kind);
  const working = c.run === 'working';
  const deck = a.key === 'deck';
  // The chip names only what the page really holds: the record, and the part the person selected.
  const ctx = deck ? `This deck${working ? '' : ', slide 1 selected'}` : 'This dashboard, no filter set';
  const first = deck ? 'A short update for the finance team on October collections.' : 'Show overdue invoices by customer, largest first.';
  const steps = deck
    ? `<li><span class="ok">${ic('ok')}</span>Read the payments and invoices of October</li>${working ? '<li class="now"><span class="spin"></span>Drafting slide 4</li>' : `<li><span class="ok">${ic('ok')}</span>Drafted 4 slides</li>`}`
    : `<li><span class="ok">${ic('ok')}</span>Read 1,240 invoices</li>${working ? '<li class="now"><span class="spin"></span>Building the customer chart</li>' : `<li><span class="ok">${ic('ok')}</span>Added 2 charts</li>`}`;
  const panel = `<aside class="panel" aria-label="${a.label} agent"><div class="panel-h"><span class="live ${working ? 'on' : ''}"></span><div style="flex:1;min-width:0"><b>${a.label} agent</b><small>${c.title}</small></div>${working ? `<button class="stop" data-stopchat="${c.id}">${ic('stop')}Stop</button>` : ''}</div>
    <div class="msgs"><span class="ctx">${ic(a.icon)}${ctx}</span><div class="you">${first}</div><ul class="steps">${steps}</ul></div>
    <div class="composer"><div><span>Ask for a change to this ${a.record}</span>${ic('send')}</div></div></aside>`;
  const body = deck
    ? `<div class="canvas"><h2>October collections are up on September.</h2><hr><p style="color:var(--idle)">SGD 195,200 collected, 8% more than September.</p></div>`
    : `<div class="bars" role="img" aria-label="Overdue amount by customer">${[92, 74, 51, 38, 22].map((v, i) => `<div><span>${['Northwind', 'Halcyon', 'Mercer & Co', 'Avalon', 'Brightway'][i]}</span><i style="width:${v}%"></i></div>`).join('')}</div>`;
  // The back link names where it goes: the chats of Ask, which is where the person came from.
  const page = `<div class="content"><div class="crumb"><button class="back" id="back-ask">${ic('back')}Back to chats</button></div><h1>${c.title}</h1><p class="sub">${working ? (deck ? 'Drafting slide 4' : 'Building a chart') : (deck ? '4 slides' : '2 charts')}</p>${body}</div>`;
  return side() + `<div class="main">${topbar(a.label)}<div class="deckpage">${page}${panel}</div></div>`;
}

function fit() {
  const phone = state.size === 'phone';
  const w = phone ? 390 : 1240, h = phone ? 780 : 700;
  app.style.zoom = Math.min(1, (innerWidth - 20) / w, (innerHeight - 64) / h);
}
addEventListener('resize', fit);

function render() {
  app.className = 'app' + (state.size === 'phone' ? ' phone' : '');
  fit();
  app.innerHTML = state.v === 'A' ? variantA() : state.v === 'B' ? variantB() : state.v === 'C' ? variantC() : state.v === 'D' ? variantD() : variantE();
  for (const [id, key, val] of [['variant', 'v', state.v], ['role', 'r', state.role], ['open', 'o', state.open ? 'open' : 'closed'], ['size', 's', state.size]])
    document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset[key] === val)));
  document.getElementById('open').style.display = 'CDE'.includes(state.v) ? 'none' : '';
  document.getElementById('role').style.display = 'DE'.includes(state.v) ? 'none' : '';
  history.replaceState(null, '', '?variant=' + state.v);
}

document.addEventListener('click', e => {
  const nav = e.target.closest('#ask-nav, #slides-nav');
  if (nav) { state.onAsk = nav.id === 'ask-nav'; state.recordChat = null; render(); return; }
  const ag = e.target.closest('[data-agent]');
  if (ag) { state.expanded[ag.dataset.agent] = ag.getAttribute('aria-expanded') !== 'true'; render(); return; }
  const more = e.target.closest('[data-more]');
  if (more) { state.all[more.dataset.more] = true; render(); return; }
  if (e.target.closest('#back-ask')) { state.recordChat = null; state.onAsk = true; render(); return; }
  const chat = e.target.closest('[data-chat]');
  // E: a Slides or Dashboards chat opens on its record page; an Ask chat opens in Ask.
  if (chat && state.v === 'E') { const c = CHATS.find(x => x.id === +chat.dataset.chat); c.unseen = false; if (c.kind === 'ask') state.cur = c.id; else state.recordChat = c; render(); return; }
  if (chat && state.v === 'D') { state.cur = +chat.dataset.chat; }
  // Opening the chat is what marks it read, on every size.
  if (chat) { state.cur = +chat.dataset.chat; state.phoneOpen = true; const c = CHATS.find(x => x.id === state.cur); c.unseen = false; render(); return; }
  if (e.target.closest('#back')) { state.phoneOpen = false; render(); return; }
  const sc = e.target.closest('[data-stopchat]');
  if (sc) { const c = CHATS.find(x => x.id === +sc.dataset.stopchat); c.run = 'stopped'; state.mine.find(r => r.id === c.id && (r.status = 'stopped')); render(); return; }
  const t = e.target.closest('button, #close-scrim');
  if (!t) return;
  if (t.dataset.v) { state.v = t.dataset.v; state.open = true; }
  else if (t.dataset.r) state.role = t.dataset.r;
  else if (t.dataset.o) state.open = t.dataset.o === 'open';
  else if (t.dataset.s) state.size = t.dataset.s;
  else if (t.dataset.tab) state.tab = t.dataset.tab;
  else if (t.dataset.stop) {
    const id = +t.dataset.stop;
    const r = state.mine.find(x => x.id === id) || state.others.find(x => x.id === id);
    Object.assign(r, { status: 'stopped', step: r.owner ? '' : 'Stopped by you, work kept', time: 'Ended just now' });
  }
  else if (t.id === 'runs-btn') { state.open = state.v === 'C' ? true : !state.open; state.seen = true; }
  else if (t.id === 'close' || t.id === 'close-scrim') state.open = false;
  else return;
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.open && state.v !== 'C') { state.open = false; render(); } });
render();
</script>
</body>
</html>
