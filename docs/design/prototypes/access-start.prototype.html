 return `<ul class="stack" aria-label="Assignments">${rows.map(r=>`<li${r.key===o.newKey?' class="new"':''}><div class="top"><span class="rt"><a class="nm" href="#">${r.role}</a><span class="sub">${modOf(r)}</span></span>${r.paused?'<span class="pill warn">Paused</span>':''}${pick?`<button class="ib sm" aria-label="Open ${r.to.name}" data-go="${r.to.id==='riley'?'filtered':'filled'}">${ic('chevR')}</button>`:''}</div><dl><dt>Assigned to</dt><dd>${r.to.name}${r.to.type==='group'?` <span class="mu">· ${r.to.kind}</span>`:''}</dd><dt>Scope</dt><dd>${r.scope}</dd>${showVia(o)?`<dt>Assigned via</dt><dd>${viaHtml(r)}</dd>`:''}<dt>Assigned</dt><dd class="tnum">${r.date} ${by(r)}</dd>${r.paused?`<dt>Paused</dt><dd>${r.paused}</dd>`:''}</dl></li>`).join('')}</ul>`;
}
const skelCards=()=>`<ul class="stack" aria-busy="true" aria-label="Assignments">${Array.from({length:4},(_,i)=>`<li><i class="bone" style="width:${58+i%2*16}%"></i><i class="bone s2" style="width:34%"></i>${Array.from({length:4},()=>`<i class="bone" style="width:${66-i*6}%;margin-top:10px"></i>`).join('')}</li>`).join('')}</ul>`;
function listPhone(o){
 const f=o.filters||{};
 const chips=[f.who&&['Person or group',f.who],f.module&&['Module',f.module],f.role&&['Role',f.role]].filter(Boolean);
 const head=`<div class="mbar"><div class="r1"><h2>Assignments${o.count?` <span class="cnt tnum">${o.count}</span>`:''}</h2><button class="btn sec">${ic('sliders')}Filters${chips.length?` <span class="cp tnum" aria-label="${chips.length} set">${chips.length}</span>`:''}</button></div>${search('Search by role or name',f.search)}${chips.length?`<div class="chips">${chips.map(([l,x])=>`<span class="chip"><span class="l">${l}:</span> ${x}<button class="x" aria-label="Remove the ${l} filter">${ic('x')}</button></span>`).join('')}<button class="btn link" data-go="filled">Clear filters</button></div>`:''}${o.reach?`<p class="reach" role="status">${o.reach}</p>`:''}${o.nomatch?'':`<div class="r3"><span class="tnum"${o.loading?' role="status"':''}>${o.loading?'Loading assignments':o.range}</span><button class="btn ghost sm" aria-label="Sort: Assigned, newest first">${ic('down')}Assigned, newest</button></div>`}</div>`;
 const body=o.loading?skelCards():o.nomatch?noMatch():cardsHtml(o.rows,o)+(o.single?'':pager('',o.last));
 return `<section class="card list" aria-label="Assignments">${head}${body}</section>`;
}
function accessScreen(o){
 const b=S.v==='b',t=o.tab||'overview';
 if(phone()){
  const bar=appbar('Access');
  const body=`<p class="pdesc">Who has which role, and on which records.</p>${helpBtn()}${b?tabsHtml(t):''}${t==='grants'?grantsList():listPhone(o)}`;
  return ph(bar,body,`<div class="bbar"><button class="btn pri" data-go="add-access">${ic('plus')}Add assignment</button></div>`,o.over||'');
 }
 const main=`<header class="phead"><div><h1>Access</h1><p>Who has which role, and on which records.</p></div><div class="acts"><button class="btn pri" data-go="add-access">${ic('plus')}Add assignment</button></div></header>${b?tabsHtml(t):''}<div class="content">${t==='grants'?grantsList():listDesk(o)}</div>`;
 return desk('access',main,o.over||'');
}

/* the assignments of one person or group, as the picked person-access prototype draws them */
function rolesList(rows,o={}){
 if(!rows.length)return '';
 if(phone()||o.stack)return `<ul class="stack box" aria-label="Assigned roles">${rows.map(r=>`<li${r.key===o.newKey?' class="new"':''}><div class="top"><a class="nm" href="#">${r.role}</a>${r.paused?'<span class="pill warn">Paused</span>':''}</div><dl><dt>Scope</dt><dd>${r.scope}</dd>${o.noVia?'':`<dt>Assigned via</dt><dd>${viaHtml(r)}</dd>`}<dt>Assigned</dt><dd class="tnum">${r.date} ${by(r)}</dd>${r.paused?`<dt>Paused</dt><dd>${r.paused}</dd>`:''}</dl></li>`).join('')}</ul>`;
 return `<table class="stbl"><caption class="sr">Assigned roles</caption><thead><tr><th scope="col">Role</th><th scope="col">Scope</th>${o.noVia?'':'<th scope="col">Assigned via</th>'}</tr></thead><tbody>${rows.map(r=>`<tr${r.key===o.newKey?' class="new"':''}><td><a class="nm" href="#">${r.role}</a>${pz(r)}<span class="sub tnum">Assigned ${r.date} ${by(r)}</span></td><td class="nw">${r.scope}</td>${o.noVia?'':`<td>${viaHtml(r)}</td>`}</tr>`).join('')}</tbody></table>`;
}
/* who the role goes to, for a module: the "Assigned to" row of role-detail.prototype.html, plus the role */
const toList=(rows,o={})=>`<ul class="hl" aria-label="Assigned to">${rows.map(r=>`<li${r.key===o.newKey?' class="new"':''}>${av(r.to)}<div class="hw"><div class="n"><a class="nm" href="#">${r.to.name}</a>${r.scope==='All records'?'':`<span class="pill">${r.scope}</span>`}${r.paused?'<span class="pill warn">Paused</span>':''}</div><div class="rl">${r.role}${r.custom?' <span class="mu">· Custom role</span>':''}</div><span class="sub">${kind(r.to)}</span><span class="sub tnum">Assigned ${r.date} ${by(r)}</span></div></li>`).join('')}</ul>`;

/* the add controls: Assign to, Role, Scope */
const whoOpt=(s,chosen,multi)=>{const me=s.id==='priya';return `<div class="opt" role="option" aria-selected="${chosen.has(s.id)}"${me?' aria-disabled="true"':''}${!multi&&s.id==='riley'?' data-go="filtered"':''}>${av(s)}<span class="wn"><span class="on">${s.name}${me?' (you)':''}</span><span class="sub">${me?'Only another administrator can change your own access.':s.type==='group'?kind(s):s.email}</span></span>${chosen.has(s.id)?ic('check','ck'):''}</div>`};
/* a list box holds only option groups; the caption is the visible name of its group */
const optGroup=(t,opts,pill)=>`<div role="group" aria-label="${t}${pill?', '+pill:''}"><div class="cap" aria-hidden="true">${t}${pill?`<span class="pill">${pill}</span>`:''}</div>${opts}</div>`;
const whoOptions=(chosen=new Set(),multi)=>`<div role="listbox" aria-label="People and groups"${multi?' aria-multiselectable="true"':''}>${optGroup('Groups',['coll','fin','admins','it','sales'].map(k=>whoOpt(GR[k],chosen,multi)).join(''))}${optGroup('People',['ada','alex','jamie','priya','riley'].map(k=>whoOpt(PE[k],chosen,multi)).join(''))}</div><p class="more tnum">Showing 10 of 317. Type to search.</p>`;
function whoControl(w){
 /* variant a adds for one person or group at a time */
 if(w.single){const s=w.chosen[0];return `<button class="select" aria-haspopup="listbox" aria-expanded="false"><span class="rec">${ic(s.type==='group'?'users':'user')}<span><span class="sr">Assign to </span>${s.name}</span></span>${ic('chevD')}</button>`;}
 const chosen=new Set(w.chosen.map(s=>s.id));
 return `<div class="multi${w.open?' open':''}">${w.chosen.map(s=>`<span class="tag">${s.type==='group'?ic('users'):''}${s.name}<button class="x" aria-label="Remove ${s.name}">${ic('x')}</button></span>`).join('')}<input class="mi" type="text" aria-label="Assign to" placeholder="${w.chosen.length?'Add more':'Search people and groups'}"></div>${w.open?`<div class="pop tall">${whoOptions(chosen,1)}</div>`:''}`;
}
function rolePop(o){
 const already=o.already||[],through=o.through||{};
 const opt=(n,x={})=>{const dis=x.dis||already.includes(n),hint=x.dis?'':already.includes(n)?'Already assigned':through[n]?`Assigned via ${through[n]}`:'';
  /* act marks the keyboard highlight; aria-selected marks only the chosen role */
  return `<div class="opt${n===o.active?' act':''}" role="option" aria-selected="${n===o.role}"${dis?' aria-disabled="true"':''}><span class="wn"><span class="on">${n}${DEF.includes(n)&&!x.dis?' <span class="mu">(default)</span>':''}${x.custom?' <span class="pill">Custom role</span>':''}</span>${hint?`<span class="sub">${hint}</span>`:''}</span></div>`};
 return `<div class="pop"><div class="ps">${search('Search roles')}</div><div role="listbox" aria-label="Roles">${optGroup('Core',['Tenant administrator','Auditor','Ask user'].map(n=>opt(n)).join(''))}${optGroup('Invoices and Payments',['Invoices and Payments viewer','Invoices and Payments editor','Invoices and Payments user'].map(n=>opt(n)).join('')+opt('Invoice approver',{custom:1}))}${optGroup('Slides',['Slides editor','Slides viewer','Slides user'].map(n=>opt(n)).join(''))}${optGroup('Analytics',['Analytics editor','Analytics viewer','Analytics user'].map(n=>opt(n,{dis:1})).join(''),'Module off')}</div></div>`;
}
const roleControl=o=>`<button class="select${o.role?'':' ph'}" aria-haspopup="listbox" aria-expanded="${!!o.roleOpen}"${o.error?' aria-invalid="true" aria-describedby="add-error"':''}><span>${o.role||'Choose a role'}</span>${ic('chevD')}</button>${o.roleOpen?rolePop(o):''}`;
let RID=0;
function scopeField(o){
 if(o.scope!=='all'&&o.scope!=='one')return `<div class="ro"><span class="flabel">Scope</span><span>All records</span></div>`;
 const n='scope'+(RID++);
 return `<fieldset class="field"><legend class="flabel">Scope</legend><label class="radio"><input type="radio" name="${n}"${o.scope==='all'?' checked':''}>All records</label><label class="radio"><input type="radio" name="${n}"${o.scope==='one'?' checked':''}>One record</label>${o.scope==='one'?`<button class="select"><span class="rec">${ic('file')}<span><span class="sr">Record </span><b>${o.record}</b> · Northwind Traders</span></span>${ic('chevD')}</button>`:''}</fieldset>`;
}
const errorBlock=()=>`<div class="alert" role="alert" id="add-error">${ic('alert','i20')}<span><b>The assignment was not added.</b>The Slides module is off. Switch it on in <a href="#">Modules</a>, or choose a role of another module.</span></div>`;
const fixedWho=s=>`<div class="ro"><span class="flabel">Assign to</span><span class="fixed">${av(s)}<span><b>${s.name}</b><span class="sub">${kind(s)}</span></span></span></div>`;
const go=x=>x?` data-go="${x}"`:'';
const field=(label,control,help)=>`<div class="field"><span class="flabel">${label}</span>${control}${help?`<p class="help">${help}</p>`:''}</div>`;
/* variant a: the editor opens inside the list it adds to */
function editor(o){
 return `<div class="ed" role="group" aria-label="New assignment"><p class="ed-t">New assignment</p>${o.whoField?field('Assign to',whoControl(o.whoField)):''}${field('Role',roleControl(o))}${scopeField(o)}${o.error?errorBlock():''}${phone()?'':`<div class="eb"><button class="btn pri"${go(o.next)}>Add</button><button class="btn ghost"${go(o.cancel)}>Cancel</button></div>`}</div>`;
}
/* on a phone, Cancel and Add of an open editor take the sticky bottom bar (DESIGN.md) */
const edBar=o=>`<div class="shf"><button class="btn sec"${go(o.cancel)}>Cancel</button><button class="btn pri"${go(o.next)}>Add</button></div>`;
/* variant b: one form, in a panel or in place of the sheet content */
function form(o){
 const n=o.count||1;
 return `<div class="fh${o.back?' bk':''}">${o.back?`<button class="ib" aria-label="Back to ${o.back}"${go(o.cancel)}>${ic('back','i20')}</button>`:''}<h2>Add assignment</h2><button class="ib" aria-label="Close"${go(o.cancel)}>${ic('x','i20')}</button></div><div class="fb">${o.error?errorBlock():''}${o.who?fixedWho(o.who):field('Assign to',whoControl(o.whoField),o.whoHelp||'Pick one or more people or groups.')}${field('Role',roleControl(o))}${scopeField(o)}${n>1?`<p class="sum">Adds ${n} assignments, one for each person and group.</p>`:''}</div><div class="ff"><button class="btn sec"${go(o.cancel)}>Cancel</button><button class="btn pri"${go(o.next)}>${n>1?`Add ${n} assignments`:'Add assignment'}</button></div>`;
}
/* variant a: the pane beside the table, a full sheet on a phone */
function pane(o){
 let inner;
 if(o.choose){
  inner=`<div class="ph"><h2>Add assignment</h2><button class="ib" aria-label="Close" data-go="filled">${ic('x','i20')}</button></div><div class="pb"><p class="help">Choose who gets the role.</p>${search('Search people and groups')}<div class="list-who">${whoOptions()}</div></div>`;
 } else {
  const s=o.subject,rows=o.rows;
  inner=`<div class="ph">${av(s,'l')}<div class="pn"><b>${s.name}</b><span class="sub">${s.type==='group'?kind(s):s.email}</span></div><button class="ib" aria-label="Close" data-go="filled">${ic('x','i20')}</button></div><div class="pb"><div class="sech"><h3>Assigned roles (${rows.length})</h3>${o.editor?'':`<button class="btn sec">${ic('plus')}Add assignment</button>`}</div>${o.editor?editor(o.editor):''}${rolesList(rows,{stack:1})}</div>${phone()&&o.editor?edBar(o.editor):`<div class="pf"><p class="help">Grants changes several modules at once.</p><a class="lk ar" href="#" data-go="grants">Open in Grants ${ic('arrow')}</a></div>`}`;
 }
 if(phone())return `<div class="sheet" role="dialog" aria-modal="true" aria-label="${o.choose?'Add assignment':o.subject.name}">${inner}</div>`;
 return `<aside class="pane" aria-label="${o.choose?'Add assignment':o.subject.name}">${inner}</aside>`;
}

/* object sheets: a person, a group, a module */
function addSheet(label,o,inner){
 if(S.v==='b'&&o.form)return sheetWrap(form(o.form),'Add assignment');
 return sheetWrap(inner,label);
}
function personSheet(o){
 const p=o.p,rows=o.rows,b=S.v==='b';
 const add=rows.length&&!o.editor?`<button class="btn sec" data-go="add-person">${ic('plus')}Add assignment</button>`:'';
 const empty=`<div class="emp box"><span class="et">${ic('key','i20')}</span><h3>No roles assigned</h3><p>${p.name} sees no modules until a role is assigned.</p><button class="btn pri" data-go="add-person">${ic('plus')}Add assignment</button></div>`;
 const inner=`<div class="shh">${av(p,'l')}<div class="nm2"><b>${p.name} <span class="pill${o.pending?'':' ok'}">${o.pending?'Pending':'Active'}</span></b><span class="em">${p.email}</span></div><button class="ib" aria-label="Close">${ic('x','i20')}</button></div><div class="tabs sh" role="tablist"><button class="tab" role="tab" aria-selected="false">Profile</button><button class="tab" role="tab" aria-selected="false">Groups <span class="c">${o.pending?0:1}</span></button><button class="tab" role="tab" aria-selected="true">Roles <span class="c">${rows.length}</span></button><button class="tab" role="tab" aria-selected="false">Sessions <span class="c">${o.pending?0:1}</span></button></div><div class="shb"><div class="sech"><h2>Assigned roles (${rows.length})</h2>${add}</div><button class="hbtn" aria-expanded="false">${ic('help')}How access adds up</button>${o.editor?editor(o.editor):''}${rows.length?rolesList(rows,{newKey:o.newKey})+`<a class="lk ar" href="#" data-go="filtered">Manage in Access ${ic('arrow')}</a>`:empty}</div>${phone()&&o.editor?edBar(o.editor):'<div class="shf"><button class="btn sec">Suspend</button><button class="btn dz">Deactivate</button></div>'}`;
 return addSheet(p.name,o,inner);
}
function groupSheet(o){
 const g=o.g,rows=o.rows;
 const inner=`<div class="shh">${av(g,'l')}<div class="nm2"><b>${g.name}</b><span class="em">${kind(g)}</span></div><button class="ib" aria-label="Close">${ic('x','i20')}</button></div><div class="tabs sh" role="tablist"><button class="tab" role="tab" aria-selected="false">Members <span class="c">${g.members}</span></button><button class="tab" role="tab" aria-selected="true">Roles <span class="c">${rows.length}</span></button></div><div class="shb"><div class="sech"><h2>Assigned roles (${rows.length})</h2>${o.editor?'':`<button class="btn sec" data-go="add-group">${ic('plus')}Add assignment</button>`}</div><p class="help">Every member of the group has these roles.</p>${o.editor?editor(o.editor):''}${rolesList(rows,{newKey:o.newKey,noVia:1})}<a class="lk ar" href="#" data-go="filled">Manage in Access ${ic('arrow')}</a></div>${phone()&&o.editor?edBar(o.editor):''}`;
 return addSheet(g.name,o,inner);
}
function moduleSheet(o){
 const rows=o.rows;
 const inner=`<div class="shh"><span class="av l g" aria-hidden="true">${ic('blocks')}</span><div class="nm2"><b>Invoices and Payments <span class="pill ok">Module on</span></b><span class="em wrap">Invoices, payments and their documents.</span></div><button class="ib" aria-label="Close">${ic('x','i20')}</button></div><div class="shb"><div class="sech"><h2>Assigned to (${rows.length})</h2>${o.editor?'':`<button class="btn sec" data-go="add-module">${ic('plus')}Add assignment</button>`}</div>${o.editor?editor(o.editor):''}${toList(rows,{newKey:o.newKey})}<a class="lk ar" href="#" data-go="filled">Manage in Access ${ic('arrow')}</a></div>${phone()&&o.editor?edBar(o.editor):''}`;
 return addSheet('Invoices and Payments',o,inner);

/* the pages behind a sheet on desktop */
function bgPage(kind){
 const T={people:['People','Everyone who can sign in to this tenant.','Add person',['Person','Status','Groups','Roles'],['riley','jamie','mina','noah','omar','priya','sam','tess'].map(k=>[`<span class="who">${av(PE[k])}<span class="wn"><b>${PE[k].name}</b><span class="sub">${PE[k].email}</span></span></span>`,k==='noah'?'<span class="pill">Pending</span>':k==='omar'?'<span class="pill warn">Suspended</span>':'<span class="pill ok">Active</span>',k==='riley'?'Finance team':'',k==='noah'?'0':'2'])],groups:['Groups','Directory groups from the identity provider, and groups made here.','Add group',['Group','Members','Roles'],['coll','contr','fin','admins','it','sales'].map(k=>[`<span class="who">${av(GR[k])}<span class="wn"><b>${GR[k].name}</b><span class="sub">${GR[k].kind}</span></span></span>`,GR[k].members,'2'])],modules:['Modules','The modules of this deployment, and who can open them.','',['Module','Status','Assigned to'],[['Analytics','<span class="pill">Module off</span>','IT Operations, Finance team, Riley Chen'],['Invoices and Payments','<span class="pill ok">Module on</span>','Finance team, Collections, Sales +3'],['Slides','<span class="pill ok">Module on</span>','Sales, Contractors, Omar Said +4']].map(r=>[`<b>${r[0]}</b>`,r[1],r[2]])]}[kind];
 return `<header class="phead"><div><h1>${T[0]}</h1><p>${T[1]}</p></div><div class="acts">${T[2]?`<button class="btn pri">${ic('plus')}${T[2]}</button>`:''}</div></header><div class="content"><section class="card list" aria-label="${T[0]}"><div class="fbar">${search('Search')}</div><div class="tscroll"><table class="t"><thead><tr>${T[3].map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${T[4].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section></div>`;
}
function sheetScreen(page,sheet,t){

/* Grants */
function grantsList(){
 const rows=[['coll','Collections',2],['contr','Contractors',1,'Archived'],['fin','Finance team',4],['admins','Genie Administrators',1],['it','IT Operations',3],['sales','Sales',3]].map(([k,n,c,x])=>({s:GR[k],c,x})).concat(['ada','alex','jamie','jordan','leila','lin'].map(k=>({s:PE[k],c:k==='jordan'?0:1})));
 const cnt=c=>c===0?'None':String(c);
 const intro=`<div class="ghd"><h2>Groups and people</h2><p>Open one to change several of its modules at once.</p></div>`;
 if(phone())return `<section class="card list" aria-label="Groups and people">${intro}<div class="mbar" style="border-bottom:1px solid var(--hair)">${search('Search groups and people')}<div class="r3"><span class="tnum">1–25 of 317</span><span>Groups, then people</span></div></div><ul class="stack">${rows.map(r=>`<li><div class="top"><span class="who">${av(r.s)}<span class="wn"><a class="nm" href="#">${r.s.name}</a><span class="sub">${r.s.type==='group'?kind(r.s):r.s.email}</span></span></span>${r.x?`<span class="pill">${r.x}</span>`:''}<button class="ib sm" aria-label="Open ${r.s.name} in Grants">${ic('chevR')}</button></div><dl><dt>Assigned roles</dt><dd>${cnt(r.c)}</dd></dl></li>`).join('')}</ul>${pager('')}</section>`;
 return `<section class="card list" aria-label="Groups and people">${intro}<div class="fbar" style="padding-top:12px">${search('Search groups and people')}${fc('Show','','Groups and people')}</div><div class="tcol"><div class="tscroll"><table class="t"><caption class="sr">Groups and people, groups first</caption><thead><tr><th scope="col">Group or person</th><th scope="col">Assigned roles</th><th scope="col"><span class="sr">Open</span></th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="who">${av(r.s)}<span class="wn"><a class="nm" href="#">${r.s.name}</a> ${r.x?`<span class="pill">${r.x}</span>`:''}<span class="sub">${r.s.type==='group'?kind(r.s):r.s.email}</span></span></span></td><td class="tnum">${cnt(r.c)}</td><td class="go"><button class="ib sm" aria-label="Open ${r.s.name} in Grants">${ic('chevR')}</button></td></tr>`).join('')}</tbody></table></div>${pager('1–25 of 317')}</div></section>`;
}
function grantsTransfer(){
 const sel=v=>`<button class="select">${v}${ic('chevD')}</button>`;
 /* a row is a label, so the whole row is the touch area of its checkbox. On a phone the role choice sits on a second line of the row, at full width (Access spec). */
 const row=(name,detail,o={})=>`<label class="trow"><input type="checkbox" aria-label="${name}"><span class="grow"><span>${name}</span><span class="sub">${detail}</span>${o.paused?pz(o):''}${o.choice&&phone()?`<span style="display:block;margin-top:8px">${o.choice}</span>`:''}</span>${o.choice&&!phone()?o.choice:''}</label>`;
 const catalog=`<div class="tp"><header><span>Catalog <span class="mu tnum">(1)</span></span><button class="btn link sm">Add all shown</button></header><div class="capt">Modules</div>${row('Invoices and Payments','Invoices and Payments viewer (default)')}</div>`;
 const granted=`<div class="tp"><header><span>Granted <span class="mu tnum">(2)</span></span><button class="btn link sm">Remove all shown</button></header><div class="capt">Modules</div>${row('Slides','Direct',{choice:sel('Slides user')})}${row('Analytics','Analytics viewer',{paused:'Module off'})}</div>`;
 /* one recipient picker, groups first and then people, so a change of recipient never clears the screen. It opens on the person or group of the pane. */
 const tb=`<div class="gtb"><span class="lab" aria-hidden="true">Grant to</span><button class="select" aria-haspopup="listbox"><span><span class="sr">Grant to </span>Riley Chen <span class="mu">· Person</span></span>${ic('chevD')}</button></div>`;
 const card=`<section class="card list fit" aria-label="Grants for Riley Chen">${tb}<div class="ghd" style="padding-bottom:4px"><h2>Access assignments</h2><p>Riley Chen. Granted means that a role exists, not that the module works today. Roles via Finance team change in the Grants of that group.</p></div><div class="panes">${phone()?granted+catalog:catalog+granted}</div></section>`;
 if(phone())return ph(appbar('Grants',{back:1}),`<p class="pdesc">Change several modules for one group or person at once.</p>${card}`,`<div class="bbar"><button class="btn sec">Cancel</button><button class="btn pri">Save changes</button></div>`);
 return desk('access',`<header class="phead"><div><div class="crumb"><a href="#" data-go="filtered">Access</a>${ic('chevR')}<span>Grants</span></div><h1>Grants</h1><p>Change several modules for one group or person at once.</p></div></header><div class="content">${card}</div>`);
}
function noAccess(){
 const body=`<div class="na"><div class="framed"><span class="et">${ic('lock','i20')}</span><h1>You do not have access to this page</h1><p>Ask your administrator for access.</p><a class="btn sec" href="#">Go to home</a></div></div>`;
 return phone()?ph(appbar('Access'),body):desk('',body,'',{limited:1});
}

/* states */
function screen(){
 const a=S.v==='a',st=S.state;
 const full={rows:ROWS,range:'1–25 of 1,284',count:'1,284'};
 const riley={rows:RILEY,filters:{who:'Riley Chen'},range:'1–6 of 6',count:'6',last:1,single:1,reach:'Riley Chen has 6 roles: 2 direct, 4 via Finance team.'};
 switch(st){
  case 'filled':return accessScreen(full);
  /* a: a row opens its person in the pane. b: the Person or group filter names the person. */
  case 'filtered':{if(!a)return accessScreen(riley);const p=pane({subject:PE.riley,rows:RILEY});return phone()?accessScreen({...full,over:p}):accessScreen({...full,selected:ROWS[9].key,pane:p});}
  case 'add-access':return a?(phone()?accessScreen({...full,over:pane({choose:1})}):accessScreen({...full,pane:pane({choose:1})})):accessScreen({...full,over:sheetWrap(form({whoField:{chosen:[GR.fin,PE.riley],open:1},whoHelp:'Riley Chen is also in Finance team, so the role reaches Riley Chen twice.',count:2,next:'filled',cancel:'filled'}),'Add assignment')});
  /* In a sheet, Back and Cancel return to its list, which this prototype draws only as the result states. */
  case 'add-person':{const ed={role:'',roleOpen:1,active:'Slides editor',already:['Slides user','Analytics viewer'],through:{'Invoice approver':'Finance team','Ask user':'Finance team','Invoices and Payments editor':'Finance team','Analytics user':'Finance team'},next:'added-person'};
   return sheetScreen('people',personSheet({p:PE.riley,rows:RILEY,editor:a?ed:null,form:a?null:{...ed,who:PE.riley,back:'Riley Chen'}}));}
  case 'added-person':return sheetScreen('people',personSheet({p:PE.riley,rows:[NEW_RILEY,...RILEY],newKey:NEW_RILEY.key}),'Assigned Slides editor to Riley Chen.');
  case 'add-group':{const ed={role:'Invoice approver',scope:'all',next:'added-group'};
   return sheetScreen('groups',groupSheet({g:GR.coll,rows:COLL,editor:a?ed:null,form:a?null:{...ed,who:GR.coll,back:'Collections'}}));}
  case 'added-group':return sheetScreen('groups',groupSheet({g:GR.coll,rows:[NEW_COLL,...COLL],newKey:NEW_COLL.key}),'Assigned Invoice approver to Collections.');
  case 'add-module':{const ed={role:'Invoices and Payments viewer',scope:'one',record:'INV-2210',next:'added-module'};
   return sheetScreen('modules',moduleSheet({rows:INV,editor:a?{...ed,whoField:{chosen:[PE.mina],single:1}}:null,form:a?null:{...ed,whoField:{chosen:[PE.mina]},back:'Invoices and Payments'}}));}
  case 'added-module':{const rows=[...INV.slice(0,4),NEW_INV,...INV.slice(4)];return sheetScreen('modules',moduleSheet({rows,newKey:NEW_INV.key}),'Assigned Invoices and Payments viewer to Mina Park.');}
  case 'grants':return a?grantsTransfer():accessScreen({tab:'grants'});
  case 'empty':return sheetScreen('people',personSheet({p:PE.noah,rows:[],pending:1}));
  case 'loading':return accessScreen({loading:1});
  case 'no-match':return accessScreen({rows:[],nomatch:1,filters:{who:'Omar Said',module:'Slides',role:'Slides editor'}});
  case 'refused':{const ed={role:'Slides editor',error:1,next:'added-person',cancel:'filled'};
   if(a){const p=pane({subject:PE.riley,rows:RILEY,editor:ed});return phone()?accessScreen({...full,over:p}):accessScreen({...full,selected:ROWS[9].key,pane:p});}
   return accessScreen({...full,over:sheetWrap(form({...ed,whoField:{chosen:[PE.riley]}}),'Add assignment')});}
  case 'no-access':return noAccess();
 }
}

/* the prototype bar and notes */
const NOTE_A=`<h2>Variant a, side pane</h2><ul><li>One list and no tabs. The name in a row opens that person or group in a pane beside the table, so the list stays in view and keeps its columns. Opening the pane moves focus to its heading, and closing it returns focus to the row. On a phone the pane is a full sheet.</li><li>Add assignment opens inside the list that it adds to: in the pane, in the person and group sheets, and in the module sheet. Nothing opens on top of a sheet. On a phone, Cancel and Add move to the bottom bar while a role is being added.</li><li>Grants opens from the pane with that group or person filled in. It has no tab, so it never opens empty.</li><li>Better at: one place for each person or group, and the fewest steps to add one role.</li></ul>`;
const NOTE_B=`<h2>Variant b, tabs and form</h2><ul><li>Two tabs, Overview and Grants, as today.</li><li>Add assignment opens one form: Assign to (one or more people and groups), Role and Scope. In a person, group or module sheet the form takes the place of the sheet content, and Back returns to the list.</li><li>Add with no role chosen shows the field error "Choose a role." under Role. After Add 2 assignments, the Overview shows both new rows tinted at the top, and a toast names the role and both recipients.</li><li>The Grants tab opens on every group and person, groups first. A row opens its modules.</li><li>Better at: the console pattern of Okta and Microsoft Entra, one role to many people in one step, and a Grants tab that people can find.</li></ul>`;
function renderBar(){
 document.getElementById('ctl').innerHTML=`<span class="t">Access starts filled (prototype)</span><span class="seg">${[['a','a · Side pane'],['b','b · Tabs and form']].map(([k,l])=>`<button data-v="${k}" aria-pressed="${S.v===k}">${l}</button>`).join('')}</span><span class="seg">${[['phone','Phone 390'],['desktop','Desktop 1440']].map(([k,l])=>`<button data-view="${k}" aria-pressed="${S.view===k}">${l}</button>`).join('')}</span><label>State <select id="st">${STATES.map(([k,l])=>`<option value="${k}"${S.state===k?' selected':''}>${l}</option>`).join('')}</select></label>`;
 document.getElementById('notes').innerHTML=`<h2>What this answers</h2><p>Access opens on every assignment, newest first, 25 to a page, with a search and three filters: Person or group, Module and Role. Nothing opens on an empty chooser. A person, a group and a module each list their assignments and have Add assignment. Removal is not part of this prototype. It stays in Grants, with the last-administrator guard and the confirmation that names the roles that go and the paths that stay.</p>${S.v==='a'?NOTE_A+NOTE_B:NOTE_B+NOTE_A}<h2>Server paging and filtering</h2><p>The design assumes server paging and filtering, because a large tenant cannot load a client list. The server sorts and filters the assignments and returns one page of 25 rows with the total. The Person or group filter, the Assign to field and the record field search on the server while you type, and show a first page ("Showing 10 of 317").</p><h2>Words</h2><p>Assigned roles, Assigned to, Assigned via, Direct, Finance team (group), All records or the record id, Assigned &lt;date&gt; by &lt;name&gt;, Paused with its reason, Module on, Module off, Custom role, Manage in Access, How access works, Clear filters, Clear search and filters, Suspend and Deactivate (owner question 3). Tenant administrator stays.</p><h2>Rules kept</h2><ul><li>Assigned via shows only while the Person or group filter is set (G2). Without the filter each row is one assignment, so the column would read Direct on every row. With a person filter the list shows what reaches that person, also the roles of their groups, and a line above the list counts them.</li><li>A role of a module that is off cannot be added. Its roles cannot be picked, and the server refuses one too.</li><li>One record is offered only for a module that owns records, here Invoices and Payments. Every other role covers all records.</li><li>Your own account cannot be picked: only another administrator can change your own access.</li><li>A role that the person has directly cannot be added twice. A role that they have through a group can also be added directly, and the option says so.</li><li>Only a roles manager sees Add assignment. A people manager sees View only on the person sheet, as person-access.prototype.html draws it.</li><li>The new row takes the blue tint of a focused row, and a toast names the role and the person or group.</li><li>Grants never shows an empty chooser. One recipient picker, groups first and then people, replaces the Groups and People switch, so a change of recipient never clears the screen.</li><li>The role list marks the default role and custom roles. Every other role is a built-in role, which the role page names.</li></ul><h2>Open for the owner</h2><ul><li>Add assignment also adds core roles, the Auditor role, one-record roles and custom roles, which Advanced access does today. Advanced access stays in Grants.</li></ul><h2>Try</h2><p>Switch the variant, the width and the state. The buttons inside the frame move between the states.</p>`;
}
function render(){
 RID=0;renderBar();
 document.getElementById('app').innerHTML=screen();
 /* an open list shows its active option, as a list box scrolls to it */
 document.querySelectorAll('.pop').forEach(p=>{const o=p.querySelector('.opt.act,.opt[aria-selected=true]');if(o&&o.offsetTop+o.offsetHeight>p.clientHeight)p.scrollTop=o.offsetTop-Math.round(p.clientHeight/3)});
 /* the row that opened the pane stays in view */
 document.querySelectorAll('.tscroll').forEach(s=>{const r=s.querySelector('tr.sel');if(r)s.scrollTop+=r.getBoundingClientRect().top-s.getBoundingClientRect().top-120});
 /* a new row in a sheet scrolls above the toast */
 const tt=document.querySelector('.toast'),nw=document.querySelector('.shb .new,.pb .new');
 if(tt&&nw){const s=nw.closest('.shb,.pb'),d=nw.getBoundingClientRect().bottom-(tt.getBoundingClientRect().top-12);if(d>0)s.scrollTop+=d}
 const u=new URL(location);u.searchParams.set('v',S.v);u.searchParams.set('view',S.view);u.searchParams.set('state',S.state);history.replaceState(null,'',u);
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-v],[data-view],[data-go]');if(!t)return;e.preventDefault();const d=t.dataset;if(d.v)S.v=d.v;if(d.view)S.view=d.view;if(d.go)S.state=d.go;render()});
document.addEventListener('change',e=>{if(e.target.id==='st'){S.state=e.target.value;render()}});
render();
</script></body></html>
