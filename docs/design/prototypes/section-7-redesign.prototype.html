<!DOCTYPE html>
<!-- PROTOTYPE, throwaway (buv3.20). Question: which one page pattern do all Section 7 screens share?
     Five parts: page header, header strip of figures, content area, fixed action bar, chat panel.
     Screens: ?screen=invoices|payments|invoice|payment|inbox|review-invoice|review-payment|ask|bubble|dashboards|slides|slides-present.
     States: &state=empty (lists, inbox, ask, dashboards), failed (inbox), unallocated (payment), over (review-payment), streaming|error (ask). &id=<invoice or payment number> on a record.
     Chat: the chat button opens the panel on every page but Ask. bubble = the invoice record with the panel open. Dashboards and Slides dock it open from 1280 px.
     &chrome=0 hides the review switcher. &frame=phone shows the screen in a 390 x 844 frame.
     Data: the fictional demo pack, reporting date 27 Oct 2026, seller Genie. In-memory state only, reset on reload.
     Icons: lucide (ISC license), inlined. Chat pattern source (next screens): agent-native by Builder.io, MIT. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE: Section 7 redesign</title>
<style>
  /* Token layer, named as the shadcn variables of tokens.md (light theme). Only --primary and --primary-foreground are tenant colors. */
  :root{
    --background:#ffffff;--foreground:#111827;--card:#ffffff;--muted:#f9fafb;--muted-foreground:#4b5563;
    --border:#e5e7eb;--input:#6b7280;--primary:#2563eb;--primary-foreground:#ffffff;--ring:var(--primary);--destructive:#dc2626;
    --tile:#f3f4f6;--body-2:#374151;
    --ok:#047857;--ok-bg:#ecfdf5;--warn:#92400e;--warn-bg:#fffbeb;--warn-line:#fcd34d;--dang:#b91c1c;--dang-bg:#fef2f2;
    --sel-bg:#eff6ff;--sel-line:#2563eb;--sel-fg:#1d4ed8;
    /* Chart series slots, fixed layer (tokens.md, Chart series colors). Taken in order from slot 1, never cycled, never on text. */
    --chart-1:#2a78d6;--chart-2:#eb6834;--chart-3:#1baf7a;--chart-4:#eda100;--chart-5:#e87ba4;--chart-6:#008300;--chart-7:#6250d6;--chart-8:#e34948;
    --font-sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",monospace;
    --text-xs:max(12px,.8rem);--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;--text-xl:1.25rem;--text-2xl:1.5rem;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  html{font-size:15px;scrollbar-color:#d1d5db transparent}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);font-size:var(--text-base);line-height:1.5;color:var(--foreground);background:var(--background);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:#dbeafe;color:#1e3a8a}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
  h1[tabindex="-1"]:focus{outline:none}
  a{color:inherit;text-underline-offset:3px}
  .num{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted-foreground)}
  .sm{font-size:var(--text-sm)} .xs{font-size:var(--text-xs)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .ic.lg{width:20px;height:20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:no-preference){.spin{animation:spin 1s linear infinite}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* Shell: sidebar 240 px from 1024 px, a top bar and a drawer under it */
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
  .side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--muted);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px}
  .tenant{display:flex;align-items:center;gap:10px;padding:6px 8px 4px;font-size:var(--text-sm);font-weight:600}
  .tile{width:28px;height:28px;border-radius:8px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:700;font-size:var(--text-sm)}
  .navcap{font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);margin:18px 10px 6px}
  .navrow{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--body-2);font:inherit;font-size:var(--text-sm);font-weight:500;text-align:left;cursor:pointer}
  .navrow:hover{background:var(--tile)}
  .navrow[aria-current=page]{background:#fff;box-shadow:inset 0 0 0 1px var(--border);color:var(--primary);font-weight:600}
  .count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:var(--text-xs);font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
  .btn .count{margin-left:2px}
  .who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid var(--border);font-size:var(--text-sm)}
  .avatar{width:32px;height:32px;border-radius:999px;background:var(--tile);color:var(--body-2);display:grid;place-items:center;font-size:var(--text-xs);font-weight:600}
  .scrim{display:none}

  .main{min-width:0;padding:24px 32px 112px}

  /* Part 1: page header */
  .ph{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"crumbs crumbs" "top actions" "meta actions";column-gap:24px;margin-bottom:20px}
  .crumbs{grid-area:crumbs;display:flex;align-items:center;gap:4px;font-size:var(--text-sm);color:var(--muted-foreground);margin-bottom:6px;min-width:0}
  .crumbs a{text-decoration:none;color:var(--muted-foreground)} .crumbs a:hover{color:var(--foreground);text-decoration:underline}
  .crumbs .last{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--body-2)}
  .ph-top{grid-area:top;display:flex;align-items:center;gap:4px;min-width:0}
  .ph h1{margin:0;font-size:var(--text-xl);font-weight:700;line-height:1.3;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ph .meta{grid-area:meta;margin:4px 0 0;font-size:var(--text-sm);color:var(--muted-foreground)}
  .ph-actions{grid-area:actions;align-self:center;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .narrow{display:none!important}

  /* Buttons: sm 32, md 40, lg 44 */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--input);border-radius:8px;background:#fff;color:#1f2937;font:inherit;font-size:var(--text-sm);font-weight:600;white-space:nowrap;text-decoration:none;cursor:pointer;transition:background-color .15s var(--ease),opacity .15s var(--ease)}
  .btn:hover{background:var(--muted)} .btn:active{opacity:.8}
  .btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
  .btn.pri:hover{opacity:.94}
  .btn.ghost{border-color:transparent;background:none;color:var(--body-2)} .btn.ghost:hover{background:var(--muted)}
  .btn.small{height:32px;padding:0 10px;position:relative}
  .btn.small::before{content:"";position:absolute;inset:-6px -2px}
  .btn.icon{width:40px;padding:0}
  .btn[aria-disabled=true]{opacity:.5;cursor:not-allowed} .btn[aria-disabled=true]:hover{background:#fff;opacity:.5} .btn.pri[aria-disabled=true]:hover{background:var(--primary)}

  /* Pills: status tones emerald, red, amber, gray. Label pills stay gray. */
  .pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;background:var(--tile);color:var(--body-2);font-size:var(--text-xs);font-weight:600;white-space:nowrap;vertical-align:middle}
  .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.dang{background:var(--dang-bg);color:var(--dang)}
  .pill .ic{width:12px;height:12px}

  /* Part 2: header strip of figures, no card, a hairline below */
  .strip{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 48px;padding:4px 0 20px;margin-bottom:24px;border-bottom:1px solid var(--border)}
  .fig .cap{font-size:var(--text-xs);font-weight:600;color:var(--muted-foreground);margin-bottom:2px}
  .fig .val{font-size:var(--text-lg);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.4}
  .fig .sub{font-size:var(--text-xs);color:var(--muted-foreground)}
  .fig.lead .val{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:var(--text-2xl);font-weight:700;letter-spacing:-.015em;line-height:1.25}
  .fig.lead .val .pill{letter-spacing:0}

  /* Part 3: content */
  .card{border:1px solid var(--border);border-radius:12px;background:var(--card)}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px 6px}
  .card-h h2,.sec-h{margin:0;font-size:var(--text-lg);font-weight:600}
  .card-b{padding:6px 24px 20px}
  .grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px;align-items:start}
  .stack{display:flex;flex-direction:column;gap:24px}
  dl.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px;margin:0}
  dl.facts dt{font-size:var(--text-xs);font-weight:600;color:var(--muted-foreground)}
  dl.facts dd{margin:2px 0 0;font-size:var(--text-sm)}
  dl.facts .wide{grid-column:1/-1}
  .src{display:block;font-size:var(--text-xs);color:var(--muted-foreground)}

  /* Lists */
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
  .search{position:relative;flex:1 1 12rem;min-width:12rem;max-width:22rem;height:40px;min-height:40px}
  .search .ic{position:absolute;left:12px;top:12px;color:var(--muted-foreground);pointer-events:none}
  .search input{width:100%;height:100%;padding-left:36px}
  input,select{height:40px;padding:0 12px;border:1px solid var(--input);border-radius:8px;background:#fff;color:var(--foreground);font:inherit;font-size:var(--text-sm)}
  input::placeholder{color:#6b7280}
  select{cursor:pointer}
  .fctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .seg{display:inline-flex;height:40px;padding:3px;gap:2px;border:1px solid var(--input);border-radius:8px;background:#fff}
  .seg button{height:32px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--body-2);font:inherit;font-size:var(--text-sm);font-weight:500;white-space:nowrap;cursor:pointer}
  .seg button:hover{background:var(--muted)}
  .seg button[aria-pressed=true]{background:var(--tile);color:var(--foreground);font-weight:600}
  .chips{display:none;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 6px 0 10px;border:1px solid var(--border);border-radius:999px;background:#fff;font:inherit;font-size:var(--text-xs);font-weight:600;color:var(--body-2);cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
  thead th{padding:10px 16px;background:var(--muted);border-bottom:1px solid var(--border);color:var(--muted-foreground);font-size:var(--text-xs);font-weight:600;text-align:left;white-space:nowrap}
  thead th:first-child{border-top-left-radius:11px} thead th:last-child{border-top-right-radius:11px}
  td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.click{position:relative}
  tbody tr.click:hover{background:var(--muted)}
  .r{text-align:right}
  .trunc{max-width:14rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowlink{padding:0;border:0;background:none;color:var(--foreground);font:inherit;font-weight:600;text-align:left;cursor:pointer;border-radius:4px}
  .rowlink::after{content:"";position:absolute;inset:0}
  .rowlink:hover{text-decoration:underline}
  .click .btn{position:relative;z-index:1}
  ul.cards{list-style:none;margin:0;padding:0}
  ul.cards>li+li{border-top:1px solid var(--border)}
  .cardrow{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:14px 16px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
  .cardrow:hover{background:var(--muted)}
  .cr-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .cr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:var(--text-sm)}
  .cr-sub{font-size:var(--text-sm);color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cr-chev{color:var(--muted-foreground)}
  .empty{padding:40px 24px;text-align:center}
  .empty p{margin:0 0 4px}
  .empty .btn{margin-top:12px}
  .list-only-cards{display:none}
  .list-only-table{position:relative;overflow-x:auto}

  /* Inbox groups: one frame, groups split by a band, never a card in a card */
  .ghead{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);background:#fff;border-radius:12px 12px 0 0}
  .group thead th{border-radius:0!important}
  .group+.group .ghead{border-top:1px solid var(--border);border-radius:0}
  .ghead h2{margin:0;font-size:var(--text-base);font-weight:600}
  .ghead .count.grey{background:var(--tile);color:var(--body-2);margin-left:0}
  .ghead .count{margin-left:0}
  .fname{display:inline-flex;align-items:center;gap:8px;font-weight:600;max-width:18rem}
  .fname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fname .ic{color:var(--muted-foreground)}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:200px;padding:24px;border:2px dashed var(--input);border-radius:12px;background:var(--muted);text-align:center}
  .drop .dtile{width:48px;height:48px;border-radius:12px;background:var(--tile);display:grid;place-items:center;color:var(--body-2);margin-bottom:6px}

  /* Review: document left, fields right (variant D) */
  .review{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .viewer{position:sticky;top:24px;overflow:hidden;border:1px solid var(--border);border-radius:12px;background:var(--muted)}
  .viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;height:48px;padding:0 6px 0 16px;border-bottom:1px solid var(--border);background:#fff;font-size:var(--text-sm);color:var(--muted-foreground)}
  .paper{margin:24px;padding:36px 40px;background:#fff;border:1px solid var(--border);font-size:var(--text-sm);line-height:1.75;color:#1f2937}
  .paper .row{display:flex;justify-content:space-between;gap:16px}
  .paper .h{font-size:var(--text-lg);font-weight:700;letter-spacing:.02em}
  .paper .fict{font-size:var(--text-xs);color:var(--muted-foreground);letter-spacing:.04em}
  .paper hr{border:0;border-top:1px solid var(--border);margin:14px 0}
  .paper mark{background:transparent;color:inherit;border-radius:3px;padding:1px 2px;margin:-1px -2px;transition:background-color .2s var(--ease),box-shadow .2s var(--ease)}
  .paper mark.hl{background:var(--sel-bg);box-shadow:0 0 0 2px var(--sel-line)}
  .fields .frow{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 40px;align-items:center;gap:4px 12px;padding:10px 12px 10px 20px;border-bottom:1px solid var(--border)}
  .fields .frow.sel{background:var(--sel-bg)}
  .frow label,.frow .lbl{font-size:var(--text-sm);color:var(--muted-foreground)}
  .frow input{width:100%}
  .frow .note{grid-column:2/4;font-size:var(--text-xs);color:var(--muted-foreground)}
  .affix{position:relative}
  .affix span{position:absolute;left:12px;top:0;line-height:40px;font-size:var(--text-sm);color:var(--muted-foreground)}
  .affix input{padding-left:44px;text-align:right;font-variant-numeric:tabular-nums}
  .check{padding:14px 20px 16px;background:var(--warn-bg);border-bottom:1px solid var(--warn-line)}
  .check .lbl{display:flex;align-items:center;gap:8px;font-size:var(--text-sm);font-weight:600;color:var(--foreground)}
  .check p{margin:4px 0 8px;font-size:var(--text-sm);color:var(--warn)}
  .radio{display:flex;align-items:center;gap:10px;min-height:44px;font-size:var(--text-sm);cursor:pointer}
  .radio input[type=radio],.srow input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--primary)}
  .radio input[type=text]{width:11rem;margin-left:4px}
  .actionbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:#fff}
  .actionbar .reason{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:var(--text-sm);color:var(--muted-foreground)}
  .fields-wrap{display:flex;flex-direction:column;gap:16px}
  .fields{overflow:hidden}
  .fields .actionbar{position:sticky;bottom:0;border-radius:0 0 12px 12px}
  .notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:8px;background:var(--ok-bg);color:#065f46;font-size:var(--text-sm)}
  .notice.dang{background:var(--dang-bg);color:var(--dang)}
  .notice p{margin:0} .notice .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .split-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 20px 8px}
  .srow{display:grid;grid-template-columns:auto minmax(0,1fr) 9rem;align-items:center;gap:12px;padding:10px 12px 10px 20px;border-top:1px solid var(--border)}
  .srow .inv{font-size:var(--text-sm);font-weight:600}
  .srow .inv span{display:block;font-weight:400;color:var(--muted-foreground)}
  .split-sum{display:flex;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--border);font-size:var(--text-sm)}
  .panes{display:none}

  /* The chat button, on every page but Ask (wired by the chat screens) */
  .chatbtn{position:fixed;right:24px;bottom:24px;z-index:26;width:48px;height:48px;border:0;border-radius:999px;background:#111827;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px -4px rgb(17 24 39 / .35)}
  .chatbtn .ic{width:20px;height:20px}
  body.has-bar .chatbtn{bottom:96px}

  /* Part 5: the chat panel. Its own full-height column (agent-native by Builder.io, MIT), never a floating card. */
  .chat-scrim{display:none}
  .chat{display:flex;flex-direction:column;min-width:0;background:#fff;border-left:1px solid var(--border)}
  .chat-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:64px;padding:0 8px 0 20px;border-bottom:1px solid var(--border)}
  .chat-h h2{margin:0;font-size:var(--text-base);font-weight:600;line-height:1.3}
  .chat-h p{margin:0;max-width:18rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-log{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:24px;padding:20px}
  .chat-foot{flex:none;padding:12px 16px 16px;border-top:1px solid var(--border);background:#fff}
  .turn{display:flex;flex-direction:column;gap:12px}
  .me{align-self:flex-end;max-width:85%;margin:0;padding:9px 14px;border-radius:16px 16px 4px 16px;background:var(--tile);color:var(--foreground);white-space:pre-wrap;overflow-wrap:anywhere}
  .agent{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
  .amark{width:24px;height:24px;border:1px solid var(--border);border-radius:7px;background:var(--muted);color:var(--foreground);display:grid;place-items:center}
  .amark .ic{width:14px;height:14px}
  .abody{min-width:0;max-width:70ch;display:flex;flex-direction:column;gap:12px;padding-top:1px}
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:var(--text-sm);color:var(--muted-foreground)}
  .step{display:flex;align-items:center;gap:8px}
  .step.done .ic{color:var(--ok)}
  .answer p{margin:0 0 6px} .answer p:last-child{margin:0} .answer b{font-weight:700}
  .rcard{padding:14px 16px;border:1px solid var(--border);border-radius:12px}
  .rcard .cap{margin-bottom:10px;font-size:var(--text-xs);font-weight:600;color:var(--muted-foreground)}
  .rcard .rfig{font-size:var(--text-2xl);font-weight:700;letter-spacing:-.015em;line-height:1.25;margin-bottom:4px}
  .rlist{list-style:none;margin:0 -8px;padding:0}
  .rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;min-height:44px;padding:8px;border:0;border-radius:8px;background:none;color:inherit;font:inherit;font-size:var(--text-sm);text-align:left;cursor:pointer}
  .rrow:hover{background:var(--muted)}
  .rrow .pill{justify-self:start}
  .srcs{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .schip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:999px;background:var(--muted);color:var(--body-2);font-size:var(--text-xs);font-weight:600}
  .schip .ic{width:13px;height:13px}
  .srcs .btn{margin-left:auto}

// One page frame for every screen. p: { nav, title, crumbs:[[label, go]], back:[label, go], meta, actions, primary, strip, body, bar }
function page(p) {
  const crumbs = p.crumbs ? `<nav class="crumbs" aria-label="Breadcrumb">${p.crumbs.map(([l, g], i) => i < p.crumbs.length - 1 ? `<a href="#" data-go="${g}">${esc(l)}</a>${icon("chevR")}` : `<span class="last" title="${esc(l)}" aria-current="page">${esc(l)}</span>`).join("")}</nav>` : "";
  const lead = p.back ? `<a href="#" class="btn icon ghost narrow" data-go="${p.back[1]}" aria-label="Back to ${p.back[0]}">${icon("chevL", "lg")}</a>` : `<button type="button" class="btn icon ghost narrow" data-act="nav" aria-label="Open the menu" aria-expanded="${S.ui.nav}">${icon("menu", "lg")}</button>`;
  const primary = p.primary ? `<span class="wide-only" style="display:contents">${p.primary}</span>` : "";
  const bar = p.bar || (p.primary ? `<div class="actionbar bar-fixed narrow-only narrow" style="justify-content:flex-end">${p.primary}</div>` : "");
  document.body.classList.toggle("has-bar", !!p.barAlways || (!!bar && innerWidth < 1024));
  const chatOpen = !p.noChat && S.ui.chat;
  return `<div class="shell ${chatOpen ? "docked" : ""}">${sidebar(p.nav)}<main class="main ${p.fill ? "fill" : ""}" id="main">
    <header class="ph">${crumbs}<div class="ph-top">${lead}<h1 tabindex="-1" title="${esc(p.title)}">${esc(p.title)}</h1></div>
      ${p.meta ? `<p class="meta">${p.meta}</p>` : ""}<div class="ph-actions">${p.actions || ""}${primary}</div></header>
    ${p.strip ? `<section class="strip" aria-label="Figures">${p.strip}</section>` : ""}${p.body}</main>${bar}
    ${chatOpen ? chatPanel(p.title) : ""}
    ${p.noChat || chatOpen ? "" : `<button type="button" class="chatbtn" data-act="chat" aria-label="Open the chat" aria-controls="chat" aria-expanded="false">${icon("ask")}</button>`}</div>`;
}
const fig = (cap, val, opts = {}) => `<div class="fig ${opts.lead ? "lead" : ""}"><div class="cap">${cap}</div><div class="val"><span class="num">${val}</span>${opts.pill || ""}</div>${opts.sub ? `<div class="sub">${opts.sub}</div>` : ""}</div>`;

// ---------- Lists ----------
function toolbar(k, statuses, dateLabel, searchLabel) {
  const f = S[k];
  const n = (f.status !== "all") + !!f.customer + !!f.month;
  const seg = `<div class="seg" role="group" aria-label="Status">${statuses.map(([v, l]) => `<button type="button" data-f="${k}.status" data-v="${v}" aria-pressed="${f.status === v}">${l}</button>`).join("")}</div>`;
  const cust = `<select id="${k}-cust" data-f="${k}.customer" aria-label="Customer"><option value="">All customers</option>${CUSTOMERS.map((c) => `<option ${f.customer === c ? "selected" : ""}>${c}</option>`).join("")}</select>`;
  const month = `<select id="${k}-month" data-f="${k}.month" aria-label="${dateLabel}"><option value="">Any ${dateLabel.toLowerCase()}</option>${MONTHS.map(([v, l]) => `<option value="${v}" ${f.month === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  const chips = [];
  if (f.status !== "all") chips.push(["status", statuses.find(([v]) => v === f.status)[1]]);
  if (f.customer) chips.push(["customer", f.customer]);
  if (f.month) chips.push(["month", MONTHS.find(([v]) => v === f.month)[1]]);
  const chipRow = chips.length && !S.ui.filters ? `<div class="chips">${chips.map(([key, l]) => `<button type="button" class="chip" data-clear="${k}.${key}" aria-label="Remove the filter ${esc(l)}">${esc(l)}${icon("x")}</button>`).join("")}</div>` : "";
  return `<div class="toolbar"><div class="search">${icon("search")}<input id="${k}-q" type="search" data-f="${k}.q" value="${esc(f.q)}" placeholder="${searchLabel}" aria-label="${searchLabel}" autocomplete="off"></div>
    <button type="button" class="btn narrow" data-act="filters" aria-expanded="${S.ui.filters}" aria-controls="${k}-fctl">${icon("sliders")}Filters${n ? `<span class="count">${n}</span>` : ""}</button>
    <div class="fctl ${S.ui.filters ? "open" : ""}" id="${k}-fctl">${seg}${cust}${month}</div></div>${chipRow}`;
}
const emptyList = (k, what) => `<div class="empty"><p><b>No ${what} matches these filters.</b></p><p class="muted sm">Change a filter, or clear them all.</p><button type="button" class="btn" data-act="clear" data-k="${k}">Clear filters</button></div>`;

function invoicesScreen() {
  const f = S.inv, q = f.q.trim().toLowerCase();
  const rows = allInvoices().filter((i) => (f.status === "all" || i.st === f.status) && (!f.customer || i.cust === f.customer) && (!f.month || i.date.startsWith(f.month)) && (!q || `${i.id} ${i.cust}`.toLowerCase().includes(q)))
    .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const sum = (fn) => rows.reduce((s, i) => s + fn(i), 0);
  const strip = fig("Outstanding", money(sum((i) => i.out)), { lead: true }) + fig("Overdue", money(sum((i) => (i.st === "overdue" ? i.out : 0)))) + fig("Invoiced", money(sum((i) => i.total))) + fig("Invoices", rows.length);
  const table = `<table><caption class="sr">Invoices, newest first</caption><thead><tr><th scope="col">Invoice</th><th scope="col">Customer</th><th scope="col">Invoice date</th><th scope="col">Due date</th><th scope="col" class="r">Total</th><th scope="col" class="r">Outstanding</th><th scope="col">Status</th></tr></thead><tbody>${rows.map((i) => `<tr class="click"><td><button type="button" class="rowlink" data-go="invoice" data-id="${i.id}">${i.id}</button></td><td class="trunc" title="${esc(i.cust)}">${esc(i.cust)}</td><td class="num">${day(i.date)}</td><td class="num">${i.due ? day(i.due) : '<span class="muted">None</span>'}</td><td class="r num">${money(i.total)}</td><td class="r num">${money(i.out)}</td><td>${invPill(i)}</td></tr>`).join("")}</tbody></table>`;
  const cards = `<ul class="cards" aria-label="Invoices, newest first">${rows.map((i) => `<li><button type="button" class="cardrow" data-go="invoice" data-id="${i.id}"><span class="cr-main"><span class="cr-top"><span>${i.id}</span>${invPill(i)}</span><span class="cr-sub">${esc(i.cust)}</span><span class="cr-sub num">${i.out ? `${money(i.out)} outstanding` : `${money(i.total)} paid`} · ${i.due ? `due ${day(i.due)}` : "no due date"}</span></span>${icon("chevR", "cr-chev")}</button></li>`).join("")}</ul>`;
  const list = rows.length ? `<div class="list-only-table">${table}</div><div class="list-only-cards">${cards}</div>` : emptyList("inv", "invoice");
  return page({ nav: "invoices", title: "Invoices", meta: `Balances as of ${day(AS_OF)}, the reporting date.`, strip,
    body: toolbar("inv", [["all", "All"], ["open", "Open"], ["overdue", "Overdue"], ["paid", "Paid"], ["nodue", "No due date"]], "Invoice date", "Search invoice or customer") + `<div class="card">${list}</div>` });
}

function paymentsScreen() {
  const f = S.pay, q = f.q.trim().toLowerCase();
  const rows = allPayments().filter((p) => (f.status === "all" || payStatus(p) === f.status) && (!f.customer || p.cust === f.customer) && (!f.month || p.date.startsWith(f.month)) && (!q || `${p.id} ${p.cust} ${p.ref}`.toLowerCase().includes(q)))
    .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const sum = (fn) => rows.reduce((s, p) => s + fn(p), 0);
  const strip = fig("Collected", money(sum((p) => p.amount)), { lead: true }) + fig("Allocated", money(sum((p) => p.allocated))) + fig("Unallocated", money(sum((p) => p.amount - p.allocated))) + fig("Payments", rows.length);
  const table = `<table><caption class="sr">Payments, newest first</caption><thead><tr><th scope="col">Payment</th><th scope="col">Customer</th><th scope="col">Payment date</th><th scope="col">Reference</th><th scope="col" class="r">Amount</th><th scope="col" class="r">Allocated</th><th scope="col">Status</th></tr></thead><tbody>${rows.map((p) => `<tr class="click"><td><button type="button" class="rowlink" data-go="payment" data-id="${p.id}">${p.id}</button></td><td class="trunc" title="${esc(p.cust)}">${esc(p.cust)}</td><td class="num">${day(p.date)}</td><td class="muted">${esc(p.ref)}</td><td class="r num">${money(p.amount)}</td><td class="r num">${money(p.allocated)}</td><td>${payPill(p)}</td></tr>`).join("")}</tbody></table>`;
  const cards = `<ul class="cards" aria-label="Payments, newest first">${rows.map((p) => `<li><button type="button" class="cardrow" data-go="payment" data-id="${p.id}"><span class="cr-main"><span class="cr-top"><span>${p.id}</span>${payPill(p)}</span><span class="cr-sub">${esc(p.cust)}</span><span class="cr-sub num">${money(p.amount)} · paid ${day(p.date)}</span></span>${icon("chevR", "cr-chev")}</button></li>`).join("")}</ul>`;
  const list = rows.length ? `<div class="list-only-table">${table}</div><div class="list-only-cards">${cards}</div>` : emptyList("pay", "payment");
  return page({ nav: "payments", title: "Payments", meta: `Amounts as of ${day(AS_OF)}, the reporting date.`, strip,
    body: toolbar("pay", [["all", "All"], ["allocated", "Allocated"], ["part", "Part allocated"], ["un", "Unallocated"]], "Payment date", "Search payment, customer or reference") + `<div class="card">${list}</div>` });
}

// ---------- Records ----------
function historyList(items) {
  return `<ol style="list-style:none;margin:0;padding:0">${items.map((h) => `<li style="display:grid;grid-template-columns:7rem minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--border)"><span class="muted sm num">${h.when}</span><span class="sm">${h.what}</span></li>`).join("")}</ol>`;
}
function invoiceScreen() {
  const list = allInvoices();
  const i = list.find((x) => x.id === S.id) || list.find((x) => x.id === "INV-2026-09-03");
  const links = allocs.filter((a) => a.inv === i.id).map((a) => ({ ...a, date: payments.find((p) => p.id === a.pay).date }));
  if (S.rPay.saved) for (const r of S.rPay.rows) if (r.on && r.id === i.id) links.push({ pay: "PAY-LIVE-002", inv: i.id, amount: parseAmt(r.amt), date: "2026-10-27" });
  const allocated = links.reduce((s, a) => s + a.amount, 0);
  const dueSrc = { document: "From the document", user: "Entered by a person", unspecified: "" }[i.dueSrc];
  const strip = fig("Outstanding", money(i.out), { lead: true, pill: invPill(i) }) + fig("Total", money(i.total)) + fig("Allocated", money(allocated)) + fig("Due date", i.due ? day(i.due) : "None", { sub: dueSrc });
  const facts = `<dl class="facts"><div><dt>Customer</dt><dd>${esc(i.cust)}</dd></div><div><dt>Invoice date</dt><dd class="num">${day(i.date)}</dd></div>
    <div><dt>Payment terms</dt><dd>${i.terms || "None on the document"}</dd></div>
    <div class="wide"><dt>Description</dt><dd>${esc(i.desc)}</dd></div></dl>`;
  const linkRows = links.length ? `<ul class="cards">${links.map((a) => `<li><button type="button" class="cardrow" data-go="payment" data-id="${a.pay}" style="padding:12px 0"><span class="cr-main"><span class="cr-top"><span>${a.pay}</span><span class="num">${money(a.amount)}</span></span><span class="cr-sub">Paid ${day(a.date)}</span></span>${icon("chevR", "cr-chev")}</button></li>`).join("")}</ul>` : `<p class="muted sm" style="margin:4px 0 0">No payment is linked yet.</p>`;
  // History as sentences: who did what, and what it changed.
  let running = i.total;
  const history = [{ iso: i.date, what: `Invoice recorded from <b>${i.id}.pdf</b>, total ${money(i.total)}.` }]
    .concat(i.dueSrc === "user" ? [{ iso: i.date, what: `Alex Morgan entered the due date ${day(i.due)}. The document states none.` }] : [])
    .concat(links.map((a) => { const from = running; running -= a.amount; return { iso: a.date, what: `Payment <b>${a.pay}</b> linked for ${money(a.amount)}. Outstanding went from ${money(from)} to ${money(running)}.` }; }))
    .concat(i.st === "overdue" ? [{ iso: i.due, what: `The due date passed with ${money(i.total - (links.filter((a) => a.date <= i.due).reduce((s, a) => s + a.amount, 0)))} unpaid. The invoice became overdue.` }] : [])
    .map((h, n) => ({ ...h, n })).sort((a, b) => b.iso.localeCompare(a.iso) || b.n - a.n).map((h) => ({ when: day(h.iso), what: h.what }));
  return page({ nav: "invoices", title: i.id, crumbs: [["Invoices", "invoices"], [i.id]], back: ["Invoices", "invoices"],
    meta: `${esc(i.cust)} · Balances as of ${day(AS_OF)}, the reporting date.`,
    actions: `<a class="btn" href="#" data-act="noop">${icon("external")}Open the PDF<span class="sr"> (source document, opens in a new tab)</span></a><button type="button" class="btn" data-act="noop">${icon("pencil")}Correct the total</button>`,
    strip, body: `<div class="grid2"><section class="card" aria-labelledby="h-details"><div class="card-h"><h2 id="h-details">Details</h2></div><div class="card-b">${facts}</div></section>
      <section class="card" aria-labelledby="h-links"><div class="card-h"><h2 id="h-links">Payments</h2><span class="muted sm num">${links.length} linked</span></div><div class="card-b">${linkRows}</div></section></div>
      <section aria-labelledby="h-history" style="margin-top:32px"><h2 id="h-history" class="sec-h" style="margin-bottom:8px">History</h2>${historyList(history)}</section>` });
}

function paymentScreen() {
  const live = S.state === "unallocated";
  const p = live ? { id: "PAY-LIVE-003", cust: "Meridian Labs", date: "2026-10-27", amount: 2222, ref: "ML-UNREFERENCED", method: "Bank transfer", allocated: 0 }
    : allPayments().find((x) => x.id === S.id) || allPayments().find((x) => x.id === "PAY-2026-026");
  const links = live ? [] : p.id === "PAY-LIVE-002" ? S.rPay.rows.filter((r) => r.on).map((r) => ({ inv: r.id, amount: parseAmt(r.amt) })) : allocs.filter((a) => a.pay === p.id);
  const un = p.amount - p.allocated;
  const strip = fig(un ? "Unallocated" : "Amount", money(un || p.amount), { lead: true, pill: payPill(p) }) + (un ? fig("Amount", money(p.amount)) : "") + fig("Allocated", money(p.allocated)) + fig("Payment date", day(p.date));
  const facts = `<dl class="facts"><div><dt>Customer</dt><dd>${esc(p.cust)}</dd></div><div><dt>Payment date</dt><dd class="num">${day(p.date)}</dd></div><div><dt>Reference</dt><dd>${esc(p.ref)}</dd></div><div><dt>Method</dt><dd>${p.method}</dd></div></dl>`;
  const linkRows = links.length ? `<ul class="cards">${links.map((a) => `<li><button type="button" class="cardrow" data-go="invoice" data-id="${a.inv}" style="padding:12px 0"><span class="cr-main"><span class="cr-top"><span>${a.inv}</span><span class="num">${money(a.amount)}</span></span><span class="cr-sub">${esc(invoices.find((x) => x.id === a.inv).desc)}</span></span>${icon("chevR", "cr-chev")}</button></li>`).join("")}</ul>`
    : `<p class="sm" style="margin:4px 0 0">This payment is not linked to an invoice. It counts in collections, and no invoice balance changes until you link it.</p>`;
  const history = (live ? [{ when: "27 Oct 2026", what: `Recorded from <b>05_Payment_Unmatched.pdf</b>. No invoice carries its reference or its amount, so it stays unallocated.` }]
    : [{ when: day(p.date), what: `Payment recorded from <b>${p.id}.pdf</b>, ${money(p.amount)}.` }].concat(links.map((a) => ({ when: day(p.date), what: `Linked to invoice <b>${a.inv}</b> for ${money(a.amount)}.` })))).reverse();
  const primary = live ? `<button type="button" class="btn pri" data-act="noop">${icon("link")}Link to an invoice</button>` : "";
  return page({ nav: "payments", title: p.id, crumbs: [["Payments", "payments"], [p.id]], back: ["Payments", "payments"],
    meta: `${esc(p.cust)} · Amounts as of ${day(AS_OF)}, the reporting date.`,
    actions: `<a class="btn" href="#" data-act="noop">${icon("external")}Open the PDF<span class="sr"> (source document, opens in a new tab)</span></a>`, primary,
    strip, body: `<div class="grid2"><section class="card" aria-labelledby="h-details"><div class="card-h"><h2 id="h-details">Details</h2></div><div class="card-b">${facts}</div></section>
      <section class="card" aria-labelledby="h-links"><div class="card-h"><h2 id="h-links">Invoices</h2><span class="muted sm num">${links.length} linked</span></div><div class="card-b">${linkRows}</div></section></div>
      <section aria-labelledby="h-history" style="margin-top:32px"><h2 id="h-history" class="sec-h" style="margin-bottom:8px">History</h2>${historyList(history)}</section>` });
}

// ---------- Documents inbox ----------
const TYPE = { inv: "Invoice", pay: "Payment evidence", rcpt: "Paid receipt", po: "Purchase order", unknown: "Not known yet" };
function inboxDocs() {
  const docs = [
    { f: "01_Invoice_Missing_Due_Date.pdf", t: "inv", found: "ABC Trading · SGD 5,000.00", at: "09:02", s: S.rInv.saved ? "saved" : "needs-input", go: "review-invoice" },
    { f: "02_Payment_Partial_Existing_Invoice.pdf", t: "pay", found: "Harbor Foods · SGD 3,000.00 to INV-2026-09-03", at: "09:03", s: "linked-automatically" },
    { f: "03_Payment_Covers_Two_Invoices.pdf", t: "pay", found: "Orchid Retail · SGD 8,250.00 to 2 invoices", at: "09:04", s: S.rPay.saved ? "saved" : "confirm-split", go: "review-payment" },
    { f: "04_Duplicate_of_Partial_Payment.pdf", t: "pay", found: "The same file as 02", at: "09:05", s: "duplicate" },
    { f: "05_Payment_Unmatched.pdf", t: "pay", found: "Meridian Labs · SGD 2,222.00, no invoice found", at: "09:06", s: "no-match", go: "payment", state: "unallocated" },
    { f: "06_Paid_Sales_Receipt.pdf", t: "unknown", found: "Reading the document", at: "09:07", s: "reading" },
    { f: "07_Purchase_Order_Not_Proof_of_Payment.pdf", t: "po", found: "No figure changes", at: "09:08", s: "kept-as-reference" },
  ];
  if (S.state === "failed") docs.push({ f: "Scan_from_phone_2026-10-27.jpg", t: "unknown", found: "The image is too blurred to read", at: "09:10", s: "could-not-read" });
  const GROUP = { "needs-input": "needs", "confirm-split": "needs", "no-match": "needs", "could-not-read": "needs", reading: "reading" };
  return S.state === "empty" ? [] : docs.map((d) => ({ ...d, group: GROUP[d.s] || "done" })).sort((a, b) => b.at.localeCompare(a.at));
}
const DOC_STATUS = { reading: ["", "Reading"], "could-not-read": ["dang", "Could not read"], "needs-input": ["warn", "Needs your input"], "linked-automatically": ["ok", "Linked automatically"], "confirm-split": ["warn", "Confirm the split"], duplicate: ["", "Duplicate (nothing added)"], "no-match": ["warn", "No matching invoice"], "kept-as-reference": ["", "Kept as a reference"], saved: ["ok", "Saved"] };
const docPill = (d) => d.s === "reading" ? `<span role="status" class="pill">${icon("loader", "spin")}Reading</span>` : pill(...DOC_STATUS[d.s]);
const docAction = (d) => d.s === "could-not-read" ? `<button type="button" class="btn small" data-act="noop">${icon("retry")}Retry</button>` : d.group === "needs" ? `<button type="button" class="btn small" data-go="${d.go}" ${d.state ? `data-state="${d.state}"` : ""} aria-label="Review ${esc(d.f)}">Review</button>` : "";
function inboxScreen() {
  const docs = inboxDocs();
  const filter = S.ui.inboxFilter || "all";
  const groups = [["needs", "Needs you"], ["reading", "Reading"], ["done", "Done"]].map(([g, label]) => [g, label, docs.filter((d) => d.group === g)])
    .filter(([g, , rows]) => rows.length && (filter === "all" || filter === g));
  const n = (g) => docs.filter((d) => d.group === g).length;
  const group = ([g, label, rows]) => `<section class="group" aria-labelledby="g-${g}"><div class="ghead"><h2 id="g-${g}">${label}</h2><span class="count ${g === "needs" ? "" : "grey"}">${rows.length}</span></div>
    <div class="list-only-table"><table><thead><tr><th scope="col">Document</th><th scope="col">Type</th><th scope="col">What we found</th><th scope="col">Status</th><th scope="col">Uploaded</th><th scope="col"><span class="sr">Action</span></th></tr></thead><tbody>${rows.map((d) => `<tr><td><span class="fname" title="${esc(d.f)}">${icon("file")}<span>${esc(short(d.f))}</span></span></td><td>${pill("", TYPE[d.t])}</td><td class="trunc" style="max-width:18rem" title="${esc(d.found)}">${esc(d.found)}</td><td>${docPill(d)}</td><td class="num muted">27 Oct 2026, ${d.at}</td><td class="r">${docAction(d)}</td></tr>`).join("")}</tbody></table></div>
    <ul class="cards list-only-cards">${rows.map((d) => `<li style="display:flex;align-items:center;gap:12px;padding:14px 16px"><span class="cr-main"><span class="cr-top"><span class="fname" title="${esc(d.f)}"><span>${esc(short(d.f, 30))}</span></span></span><span>${docPill(d)}</span><span class="cr-sub">${esc(d.found)}</span><span class="cr-sub num">${TYPE[d.t]} · uploaded ${d.at}</span></span>${docAction(d)}</li>`).join("")}</ul></section>`;
  const chips = `<div class="toolbar"><div class="seg" role="group" aria-label="Show">${[["all", `All ${docs.length}`], ["needs", `Needs you ${n("needs")}`], ["done", `Done ${n("done")}`]].map(([v, l]) => `<button type="button" data-inbox="${v}" aria-pressed="${filter === v}">${l}</button>`).join("")}</div></div>`;
  const body = docs.length ? chips + `<div class="card">${groups.map(group).join("")}</div>`
    : `<div class="drop"><span class="dtile">${icon("upload", "lg")}</span><b>Drop invoices, receipts or payment evidence, or browse</b><span class="muted sm">PDF, PNG or JPG, up to 20 MB each. Each file is read, sorted and matched for you.</span><button type="button" class="btn" data-act="noop" style="margin-top:8px">Choose files</button></div>`;
  return page({ nav: "inbox", title: "Documents", meta: docs.length ? `${n("needs")} ${n("needs") === 1 ? "needs" : "need"} you. Newest uploads first.` : "Nothing uploaded yet.",
    primary: `<button type="button" class="btn pri" data-act="noop">${icon("upload")}Upload</button>`, body });
}

// ---------- Review screens: document left, fields right, a fixed action bar ----------
function viewer(doc) {
  return `<section class="viewer" aria-label="Document"><div class="viewer-bar"><span>Page 1 of 1</span><a class="btn ghost small" href="#" data-act="noop">${icon("external")}Open the PDF</a></div><div class="paper">${doc}</div></section>`;
}
const mk = (k, html) => `<mark id="m-${k}" class="${S.ui.sel === k ? "hl" : ""}">${html}</mark>`;

// ---------- Insights figures: computed from the demo pack, never typed by hand ----------
const CHRON = MONTHS.slice().reverse();
const AS_OF_TIME = `${day(AS_OF)}, 09:40`;
const sumBy = (rows, fn) => rows.reduce((s, r) => s + fn(r), 0);
const pct = (now, before) => Math.round(((now - before) / before) * 1000) / 10;
// Month to date: 1 to 27 Oct against the same days of September.
const inMtd = (d, m) => d.startsWith(m) && +d.slice(8) <= +AS_OF.slice(8);
function insights() {
  const inv = allInvoices(), pay = allPayments();
  const period = (m) => ({ inv: sumBy(inv.filter((i) => inMtd(i.date, m)), (i) => i.total), col: sumBy(pay.filter((p) => inMtd(p.date, m)), (p) => p.amount),
    pays: pay.filter((p) => inMtd(p.date, m)).length, cust: new Set(inv.filter((i) => inMtd(i.date, m)).map((i) => i.cust)).size });
  const overdue = inv.filter((i) => i.st === "overdue").sort((a, b) => b.days - a.days);
  const byCust = Object.entries(inv.reduce((m, i) => ((m[i.cust] = (m[i.cust] || 0) + i.out), m), {})).filter(([, a]) => a > 0).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  return { inv, overdue, byCust, outstanding: sumBy(inv, (i) => i.out), overdueSum: sumBy(overdue, (i) => i.out),
    invoiced: CHRON.map(([m]) => sumBy(inv.filter((i) => i.date.startsWith(m)), (i) => i.total)),
    collected: CHRON.map(([m]) => sumBy(pay.filter((p) => p.date.startsWith(m)), (p) => p.amount)),
    cur: period("2026-10"), prev: period("2026-09") };
}
function topOwers(x) {
  const top = x.byCust.filter(([, a]) => a === x.byCust[0][1]);
  return { names: top.map(([c]) => c).join(" and "), each: x.byCust[0][1], n: top.length, share: Math.round((sumBy(top, ([, a]) => a) / x.outstanding) * 100) };
}
const oweSentence = (t) => `<b>${esc(t.names)}</b> ${t.n > 1 ? `owe the most, ${money(t.each)} each` : `owes the most, ${money(t.each)}`}`;
const deltaLine = (now, before, label, goodUp = true) => {
  if (now === before) return `<div class="delta flat">${icon("minus")}No change on ${label}</div>`;
  const p = pct(now, before), up = p > 0;
  return `<div class="delta ${up === goodUp ? "good" : "bad"}">${icon(up ? "trendUp" : "trendDown")}${up ? "+" : "−"}${Math.abs(p)}% on ${label}</div>`;
};

// ---------- Charts: legend on top of every multi-series chart, a table view for every chart ----------
const SHORT = (m) => MON[+m.slice(5) - 1];
function vchart(series) {
  const top = Math.ceil(Math.max(...series.flatMap((s) => s.values)) / 10000) * 10000;
  const legend = series.length > 1 ? `<ul class="legend">${series.map((s, n) => `<li><i style="background:var(--chart-${n + 1})"></i>${s.name}</li>`).join("")}</ul>` : "";
  const cols = CHRON.map(([m], i) => `<div class="vc-col">${series.map((s, n) => `<span style="height:${(s.values[i] / top) * 100}%;background:var(--chart-${n + 1})" title="${s.name}, ${SHORT(m)}: ${money(s.values[i])}"></span>`).join("")}</div>`).join("");
  return `${legend}<div class="vc" aria-hidden="true"><div class="vc-y"><span>${top / 1000}k</span><span>${top / 2000}k</span><span>0</span></div><div class="vc-plot">${cols}</div><div class="vc-x">${CHRON.map(([m]) => `<span>${SHORT(m)}</span>`).join("")}</div></div>`;
}

const REPLIES = { "who owes us the most?": oweReply, "which invoices are overdue?": overdueReply, "how much did we collect in october?": collectReply, "why is this invoice overdue?": whyReply };

function seed(screen, state) {

  }).join("");
  const rise = t.a && !t.shown;
  if (rise) t.shown = true;
  const body = t.err ? `<div class="notice dang" role="alert">${icon("alert", "lg")}<div><p><b>The answer did not finish.</b> ${t.err}</p><div class="acts"><button type="button" class="btn small" data-act="retry">${icon("retry")}Try again</button></div></div></div>`
    : t.a ? `<div class="abody-a ${rise ? "rise" : ""}" style="display:flex;flex-direction:column;gap:12px"><div class="answer">${t.a}</div>${t.card || ""}

  const inner = new URLSearchParams(P); inner.delete("frame"); inner.set("chrome", "0");
  document.getElementById("root").innerHTML = `<iframe title="Phone, 390 by 844" src="?${inner}"></iframe><div id="rv"><b>Phone frame</b><button type="button" id="rv-exit">Back to full width</button></div>`;
  document.getElementById("rv-exit").onclick = () => { P.delete("frame"); location.search = P; };
} else {
  applyState(); render();
}
</script>
</body>
</html>
